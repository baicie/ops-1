[package]
name = "opsweave-node"
version.workspace = true
edition.workspace = true
license.workspace = true

# The binary alone has no importable surface, so integration tests under
# `tests/` could not drive the real DockerAdapter. A thin library target
# re-exports the same modules; `main.rs` is unchanged and still owns the entry
# point.
[lib]
name = "opsweave_node"
path = "src/lib.rs"

[dependencies]
opsweave-http-body-guard = { path = "../../crates/http-body-guard" }
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
dotenvy.workspace = true
futures.workspace = true
libc = "0.2"
opsweave-contracts = { path = "../../crates/contracts" }
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true
urlencoding.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
