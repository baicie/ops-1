openapi: 3.1.0
info:
  title: OpsWeave Incident Slice API (proposed)
  version: 0.0.1-draft
  description: >
    G11 business slice: Incident -> Evidence -> Human Verdict.
    Design and implementation contract for the Kernel-owned incident authority.
    Every field below has a written reason in
    docs/design/g11-incident/incident-adr.md; adding a field here requires
    editing that ADR first. Revalidate against the running Kernel, never treat
    this file as evidence that an endpoint exists.
servers:
  - url: /api/v1
security:
  - cookieSession: []
paths:
  /incidents:
    post:
      summary: Create an incident (operator or admin)
      description: >
        source=nativeId is the natural identity of a reported failure. A repeat
        of the same (source, nativeId) by a caller that can read the existing row
        returns 200 with that incident instead of creating a duplicate; when the
        row exists but sits outside the caller read scope the answer is
        409 INCIDENT_NATIVE_ID_TAKEN, never 404 — the caller supplied the key, so
        "this key is taken" is information it already had, while "not found"
        would deny the row and still refuse to create it. Without nativeId every
        call creates a new incident, because the Kernel cannot decide that two
        manual reports are the same failure.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Incident'}
        '200':
          description: >
            Idempotent replay: the caller owns the row, or its read scope covers
            it (admin); body is the incident that already existed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Incident'}
        '400': {description: INVALID_REQUEST — field shape/value rejected}
        '401': {description: UNAUTHENTICATED}
        '403': {description: FORBIDDEN — viewer may not create incidents}
        '409':
          description: >
            INCIDENT_NATIVE_ID_TAKEN — the (source, nativeId) natural key already
            belongs to an incident outside the caller read scope, so creating it
            and replaying it are both impossible for this caller.
            INCIDENT_WRITE_CONFLICT — a concurrent write changed the row between
            the insert and the re-read; retry the request.
            A POST create never answers 404: that status would report the failure
            as nonexistent while refusing to create it.
        '500':
          description: >
            AUDIT_WRITE_FAILED — the audit row for this write could not be
            stored, so the whole transaction rolled back and nothing was created;
            retryable, and no incident exists with this body's natural key unless
            a later call succeeded.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateIncidentRequest'}
    get:
      summary: Incident list, scoped by role
      description: >
        admin and viewer see every incident; operator sees only incidents it
        owns, mirroring the job list predicate at apps/kernel/src/jobs.rs:1883.
      parameters:
        - name: status
          in: query
          required: false
          schema: {$ref: '#/components/schemas/IncidentStatus'}
        - name: severity
          in: query
          required: false
          schema: {$ref: '#/components/schemas/IncidentSeverity'}
        - name: owner
          in: query
          required: false
          schema: {type: string, format: uuid}
          description: >
            Owner filter added for D3. It narrows the caller's scope and can never
            widen it: the role predicate is still applied first, so an operator
            asking for another user's owner receives an empty page rather than
            their rows.
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: cursor
          in: query
          required: false
          schema: {type: string, maxLength: 512}
          description: Opaque keyset cursor from a previous nextCursor; rejects with 400 when malformed or expired
      responses:
        '200':
          description: Bounded page, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IncidentList'}
        '400': {description: INVALID_REQUEST — unknown filter value or bad cursor}
        '401': {description: UNAUTHENTICATED}
  /incidents/{incidentId}:
    get:
      summary: One incident with derived evidenceRefs and humanVerdict
      parameters:
        - {$ref: '#/components/parameters/incidentId'}
      responses:
        '200':
          description: Incident
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Incident'}
        '401': {description: UNAUTHENTICATED}
        '404': {description: INCIDENT_NOT_FOUND — absent, or outside the caller scope}
  /incidents/{incidentId}/evidence:
    post:
      summary: Append evidence (operator or admin)
      description: >
        The first evidence moves an OPEN incident to INVESTIGATING. A CLOSED
        incident rejects new evidence with 409. Replaying the same
        (kind, source, contentRef) returns 200 with the existing row, unchanged:
        a replay cannot raise the trust of a row that is already stored.

        Since G12 the request does not decide verifiedTrust. The caller may state
        claimedTrust (OPERATOR_ASSERTED or UNVERIFIED, and nothing else); the
        body field "trust" is refused with EVIDENCE_TRUST_NOT_SELF_ASSERTABLE
        rather than reinterpreted. SOURCE_ATTESTED is produced only when the
        request carries an attestation that verifies against a configured source
        adapter: an HMAC-SHA256 signature over the exact evidence tuple, keyed by
        a secret the Kernel holds and the client does not. The Kernel records the
        adapter id, the method, the instant and the submitter on the row.
      parameters:
        - {$ref: '#/components/parameters/incidentId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateEvidenceRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Evidence'}
        '200':
          description: Idempotent replay; body is the evidence that already existed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Evidence'}
        '400':
          description: >
            INVALID_REQUEST — field shape/value rejected, including a
            claimedTrust outside {OPERATOR_ASSERTED, UNVERIFIED}.
            EVIDENCE_TRUST_NOT_SELF_ASSERTABLE — the request tried to state
            verifiedTrust: either it carried the retired "trust" field, or it
            named SOURCE_ATTESTED as a claim. Nothing was written.
        '401':
          description: >
            UNAUTHENTICATED, or the attestation did not verify:
            EVIDENCE_ATTESTATION_INVALID (the signature does not cover this
            tuple), EVIDENCE_ATTESTATION_STALE (signed outside the ±300s window,
            so it cannot be a replay), or EVIDENCE_ADAPTER_UNKNOWN (no configured
            adapter answers to that adapterId). Nothing was written in any of
            these cases — an unverifiable attestation is never downgraded to an
            ordinary row.
        '403': {description: FORBIDDEN — viewer may not append evidence}
        '404': {description: INCIDENT_NOT_FOUND — absent, or outside the caller scope}
        '409':
          description: >
            INCIDENT_CLOSED — a closed incident accepts no new evidence.
            INCIDENT_WRITE_CONFLICT — a concurrent write changed the evidence set
            between the insert and the re-read; retry the request.
        '500':
          description: >
            AUDIT_WRITE_FAILED — the audit row could not be stored, so the
            evidence row and the OPEN -> INVESTIGATING transition rolled back
            with it; retryable.
    get:
      summary: Evidence of one incident, newest collection first
      parameters:
        - {$ref: '#/components/parameters/incidentId'}
      responses:
        '200':
          description: Evidence list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceList'}
        '401': {description: UNAUTHENTICATED}
        '404': {description: INCIDENT_NOT_FOUND — absent, or outside the caller scope}
  /incidents/{incidentId}/verdict:
    post:
      summary: Record the human verdict (operator or admin)
      description: >
        A verdict is a signed audit fact, so it is write-once. CONFIRMED and
        REFUTED require at least one evidence row in the same statement;
        INCONCLUSIVE is allowed without evidence because "not enough evidence to
        conclude" is itself a legitimate conclusion that must be recordable.
      parameters:
        - {$ref: '#/components/parameters/incidentId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateVerdictRequest'}
      responses:
        '201':
          description: Recorded; the incident is now CONCLUDED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Verdict'}
        '400': {description: INVALID_REQUEST — unknown verdict value or rationale too short}
        '401': {description: UNAUTHENTICATED}
        '403': {description: FORBIDDEN — viewer may not conclude}
        '404': {description: INCIDENT_NOT_FOUND — absent, or outside the caller scope}
        '409':
          description: >
            INCIDENT_ALREADY_CONCLUDED (a verdict exists),
            INCIDENT_EVIDENCE_REQUIRED (CONFIRMED/REFUTED without evidence),
            INCIDENT_CLOSED (a closed incident accepts no verdict), or
            INCIDENT_STATE_CONFLICT (the status moved out of a concludable state
            while the verdict was being recorded)
        '500':
          description: >
            AUDIT_WRITE_FAILED — the verdict's audit row could not be stored, so
            the verdict insert and the CONCLUDED transition rolled back together;
            retryable, and the incident still has no verdict.
    get:
      summary: The human verdict of one incident
      parameters:
        - {$ref: '#/components/parameters/incidentId'}
      responses:
        '200':
          description: Verdict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Verdict'}
        '401': {description: UNAUTHENTICATED}
        '404': {description: INCIDENT_NOT_FOUND, or INCIDENT_VERDICT_NOT_FOUND when the incident has no verdict yet}
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: opsweave_session
  parameters:
    incidentId:
      name: incidentId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    IncidentSeverity:
      type: string
      enum: [CRITICAL, MAJOR, MINOR, WARNING]
    IncidentStatus:
      type: string
      enum: [OPEN, INVESTIGATING, CONCLUDED, CLOSED]
    IncidentSource:
      type: string
      enum: [MANUAL, API]
      description: >
        Closed set of sources the Kernel can attest today. A connector such as
        Zabbix or Nebula widens this with its own migration and ADR; a client
        may never claim provenance the system cannot verify.
    EvidenceKind:
      type: string
      enum: [METRIC_SNAPSHOT, LOG_EXCERPT, QUERY_RESULT, OPERATOR_NOTE]
    EvidenceTrust:
      type: string
      enum: [SOURCE_ATTESTED, OPERATOR_ASSERTED, UNVERIFIED]
      description: >
        The closed set of trust values a stored row may carry, in the field the
        Kernel established (verifiedTrust). G12 A1: this is a server verdict, not
        a client input, and it is the only field a reader or a verdict may treat
        as provenance.
    EvidenceTrustClaim:
      type: string
      enum: [OPERATOR_ASSERTED, UNVERIFIED]
      description: >
        What a submitter is allowed to say about its own row (claimedTrust). It
        is deliberately smaller than EvidenceTrust: SOURCE_ATTESTED means "the
        Kernel checked", and a caller cannot perform that check on the Kernel's
        behalf by typing it. A request naming SOURCE_ATTESTED here is refused with
        EVIDENCE_TRUST_NOT_SELF_ASSERTABLE rather than quietly lowered.
    VerificationMethod:
      type: string
      enum: [NONE, OPERATOR_IDENTITY, SOURCE_ADAPTER]
      description: >
        How the Kernel reached verifiedTrust. NONE: nothing was verified.
        OPERATOR_IDENTITY: an authenticated operator holding the write permission
        submitted the row. SOURCE_ADAPTER: a configured adapter proved possession
        of its secret over this exact tuple.
    Attestation:
      type: object
      additionalProperties: false
      required: [adapterId, issuedAt, signature]
      description: >
        Proof a configured source adapter vouches for one evidence row.

        The signed bytes are the UTF-8 encoding of this JSON object, serialized
        with exactly this key order and no whitespace (serde_json::to_string of
        the claims struct in apps/kernel/src/incidents.rs):

          {"v":"opsweave-evidence-attestation-v1","adapterId":...,
           "incidentId":...,"kind":...,"source":...,
           "collectedAtUnix":...,"contentRef":...,"issuedAtUnix":...}

        where incidentId is the lowercase hyphenated UUID, collectedAtUnix and
        issuedAtUnix are the integer seconds of collectedAt and issuedAt, and
        signature is base64url without padding (HMAC-SHA256 keyed by that
        adapter's secret from OPSWEAVE_EVIDENCE_ADAPTERS). Signing the tuple, and
        not just the adapter id, is what stops a genuine attestation being moved
        onto different evidence. issuedAt is bounded to ±300s so a captured
        attestation cannot be replayed later.
      properties:
        adapterId: {type: string, minLength: 1, maxLength: 100}
        issuedAt: {type: string, format: date-time}
        signature:
          type: string
          minLength: 1
          maxLength: 128
          description: base64url (no padding) HMAC-SHA256 over the canonical claims
    VerdictValue:
      type: string
      enum: [CONFIRMED, REFUTED, INCONCLUSIVE]
    CreateIncidentRequest:
      type: object
      additionalProperties: false
      required: [title, severity, startedAt]
      properties:
        title: {type: string, minLength: 4, maxLength: 200}
        severity: {$ref: '#/components/schemas/IncidentSeverity'}
        source:
          allOf: [{$ref: '#/components/schemas/IncidentSource'}]
          default: MANUAL
        nativeId:
          type: [string, 'null']
          maxLength: 200
          description: Source-native identity; with source it forms the natural key
        relatedEntity:
          type: [string, 'null']
          minLength: 3
          maxLength: 200
          description: >
            Opaque stable reference to the affected Host/Service. Null means
            "unknown blast radius", which must stay representable rather than be
            filled with an invented value.
        startedAt:
          type: string
          format: date-time
          description: When the failure began, not when it was recorded
    Incident:
      type: object
      additionalProperties: false
      required:
        [id, title, severity, status, source, nativeId, relatedEntity,
         startedAt, updatedAt, owner, evidenceRefs, humanVerdict]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        severity: {$ref: '#/components/schemas/IncidentSeverity'}
        status: {$ref: '#/components/schemas/IncidentStatus'}
        source: {$ref: '#/components/schemas/IncidentSource'}
        nativeId: {type: [string, 'null']}
        relatedEntity: {type: [string, 'null']}
        startedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        owner: {type: string, format: uuid, description: Accountable user, set to the creator}
        evidenceRefs:
          type: array
          maxItems: 100
          items: {type: string, format: uuid}
          description: >
            Derived at read time from kernel.incident_evidence. It is never a
            stored column, never writable, and always the newest 100 ids.
        humanVerdict:
          oneOf:
            - {$ref: '#/components/schemas/Verdict'}
            - {type: 'null'}
          description: Derived at read time from kernel.incident_verdicts
    IncidentList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Incident'}
        nextCursor:
          type: [string, 'null']
          description: Opaque keyset cursor; null when the page is the last one
    CreateEvidenceRequest:
      type: object
      additionalProperties: false
      required: [kind, source, collectedAt, contentRef]
      properties:
        kind: {$ref: '#/components/schemas/EvidenceKind'}
        source: {type: string, minLength: 2, maxLength: 200}
        collectedAt: {type: string, format: date-time}
        contentRef:
          type: string
          minLength: 2
          maxLength: 1000
          description: >
            Opaque locator (content digest or store key). Never inline payload:
            the Kernel does not fetch it, so it also carries no SSRF surface.
        claimedTrust:
          allOf: [{$ref: '#/components/schemas/EvidenceTrustClaim'}]
          description: >
            What the submitter asserts about this row. Defaults to
            OPERATOR_ASSERTED, which is what an authenticated operator's own
            submission actually is. Recorded as claimedTrust and never read as
            verifiedTrust.
        attestation:
          oneOf:
            - {$ref: '#/components/schemas/Attestation'}
            - {type: 'null'}
          description: >
            Present only when a source adapter is vouching. Its successful
            verification is the sole route to verifiedTrust=SOURCE_ATTESTED; an
            attestation that fails to verify is a 401, never a downgrade.
        trust:
          type: string
          deprecated: true
          description: >
            Retired by G12 A1 and refused with EVIDENCE_TRUST_NOT_SELF_ASSERTABLE
            when present, whatever its value. It is listed so the refusal is
            discoverable: before this change the value in this field was what
            granted attestation.
    Evidence:
      type: object
      additionalProperties: false
      required:
        [id, incidentId, kind, source, collectedAt, contentRef,
         claimedTrust, verifiedTrust, verificationMethod, verifiedAt,
         verifierIdentity, submittedBy, verificationNote, createdAt, afterVerdict]
      properties:
        id: {type: string, format: uuid}
        incidentId: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/EvidenceKind'}
        source: {type: string}
        collectedAt: {type: string, format: date-time}
        contentRef: {type: string}
        claimedTrust:
          $ref: '#/components/schemas/EvidenceTrust'
          # Validity note: historical rows may carry SOURCE_ATTESTED here, because
          # that is what a pre-0017 client claimed. The claim is kept as a fact;
          # verifiedTrust is what the Kernel could establish, and migration 0017
          # downgraded every one of those claims to UNVERIFIED with a note.
        verifiedTrust: {$ref: '#/components/schemas/EvidenceTrust'}
        verificationMethod: {$ref: '#/components/schemas/VerificationMethod'}
        verifiedAt:
          type: [string, 'null']
          format: date-time
          description: When the verification ran; null when nothing was verified.
        verifierIdentity:
          type: [string, 'null']
          description: >
            The authenticated adapter id for SOURCE_ADAPTER rows. Null otherwise:
            for OPERATOR_IDENTITY the vouching identity is submittedBy, and
            naming an adapter there would be a claim the Kernel cannot support.
        submittedBy:
          type: [string, 'null']
          format: uuid
          description: >
            The account that submitted the row. Null for rows recorded before the
            column existed where the audit trail did not answer; never filled with
            a guess.
        verificationNote:
          type: [string, 'null']
          description: >
            Why the row carries the verification it carries. The only value in use
            today is the migration 0017 note that explains a downgraded
            SOURCE_ATTESTED claim.
        createdAt: {type: string, format: date-time}
        afterVerdict:
          type: boolean
          description: >
            G12 A3: true when this row was appended after the incident's verdict
            was signed, so it was never part of the set the signer weighed. When
            the verdict's snapshotKind is RECORDED this is membership of the
            recorded set; for a PRE_MIGRATION_UNRECORDED verdict it falls back to
            createdAt > decidedAt, and the verdict says which rule applied.
    EvidenceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Evidence'}
    CreateVerdictRequest:
      type: object
      additionalProperties: false
      required: [verdict, rationale]
      properties:
        verdict: {$ref: '#/components/schemas/VerdictValue'}
        rationale: {type: string, minLength: 10, maxLength: 4000}
    Verdict:
      type: object
      additionalProperties: false
      required:
        [incidentId, verdict, rationale, decidedBy, decidedAt,
         consideredEvidenceCount, consideredEvidenceDigest, snapshotKind]
      properties:
        incidentId: {type: string, format: uuid}
        verdict: {$ref: '#/components/schemas/VerdictValue'}
        rationale: {type: string}
        decidedBy: {type: string, format: uuid}
        decidedAt: {type: string, format: date-time}
        consideredEvidenceCount:
          type: integer
          minimum: 0
          description: >
            G12 A3: how many evidence rows the signing transaction read. This is
            the number the verdict stands on. It must never be recomputed as the
            number of rows the incident holds now, because CONCLUDED still accepts
            evidence.
        consideredEvidenceDigest:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: >
            sha256 (hex) over the considered set, ordered by evidence id. Null
            when no set was recorded.
        snapshotKind:
          type: string
          enum: [RECORDED, PRE_MIGRATION_UNRECORDED]
          description: >
            RECORDED means consideredEvidenceCount/Digest are a record of the set
            the signer weighed. PRE_MIGRATION_UNRECORDED means the verdict was
            signed before the snapshot existed: the set was never stored, so it is
            unknown, and presenting a reconstruction as the record would be a
            silent rewrite of what was signed.
