openapi: 3.1.0
info:
  title: OpsWeave Typed Pipeline and Durable Job API
  version: 0.0.3-draft
  description: >
    Contract draft for immutable typed pipelines and fenced durable jobs. The
    implementation is blocked until the 0.0.2 review PR is merged to main and
    Gate 0.0.3 is opened. All mutation endpoints use the existing Kernel
    authorization, audit and tenant boundaries; this API does not create a
    second identity system.
servers:
  - url: /api/v1
paths:
  /pipelines:
    post:
      operationId: createPipeline
      summary: Create a draft pipeline definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/pipeline-ir.v1.schema.json
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: ../schema/pipeline-ir.v1.schema.json
        '400':
          $ref: '#/components/responses/ContractError'
    get:
      operationId: listPipelines
      responses:
        '200':
          description: Pipeline summaries
  /pipelines/validate:
    post:
      operationId: validatePipelineDefinition
      summary: Pure validation; no revision, job, receipt or catalog write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/pipeline-ir.v1.schema.json
      responses:
        '200':
          description: Validation result; semantically invalid graphs return valid=false.
          content:
            application/json:
              schema:
                type: object
                required: [valid, errors, warnings, canonicalOrder]
                properties:
                  valid: { type: boolean }
                  errors:
                    type: array
                    items:
                      type: object
                      required: [code, message]
                      properties:
                        code: { type: string }
                        message: { type: string }
                        nodeId: { type: string }
                        port: { type: string }
                  warnings: { type: array, items: { type: object } }
                  canonicalOrder: { type: array, items: { type: string } }
                  planDigest: { type: string, nullable: true }
                  digest: { type: string, nullable: true }
        '401': { description: Unauthenticated }
        '403': { description: Operator role required }
  /pipelines/{pipelineId}/drafts:
    get:
      operationId: listPipelineDrafts
      parameters:
        - $ref: '#/components/parameters/PipelineId'
      responses:
        '200':
          description: Current user's drafts for the pipeline.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PipelineDraft' } }
    post:
      operationId: createPipelineDraft
      parameters:
        - $ref: '#/components/parameters/PipelineId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                baseRevision: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Draft created from a published base revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineDraft' }
        '400': { description: Invalid base revision }
        '401': { description: Unauthenticated }
        '403': { description: Operator role required }
  /pipelines/{pipelineId}/drafts/{draftId}:
    parameters:
      - $ref: '#/components/parameters/PipelineId'
      - $ref: '#/components/parameters/DraftId'
    get:
      operationId: getPipelineDraft
      responses:
        '200':
          description: Draft owned by the current user (or by an admin).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineDraft' }
        '404': { description: Draft not found or not visible }
    put:
      operationId: updatePipelineDraft
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Current draft version for optimistic concurrency.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition: { $ref: ../schema/pipeline-ir.v1.schema.json }
      responses:
        '200':
          description: Draft saved with an incremented version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineDraft' }
        '409': { description: DRAFT_VERSION_CONFLICT or DRAFT_NOT_EDITABLE }
        '400': { description: Missing/invalid If-Match or malformed definition }
  /pipelines/{pipelineId}/drafts/{draftId}/publish:
    post:
      operationId: publishPipelineDraft
      parameters:
        - $ref: '#/components/parameters/PipelineId'
        - $ref: '#/components/parameters/DraftId'
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Atomic published revision (or the same revision for an idempotent retry).
        '400': { description: Validation failed }
        '409': { description: DRAFT_VERSION_CONFLICT or IDEMPOTENCY_CONFLICT }
  /pipelines/{pipelineId}/validate:
    post:
      operationId: validatePipeline
      parameters:
        - $ref: '#/components/parameters/PipelineId'
      responses:
        '200':
          description: Static validation result
          content:
            application/json:
              schema:
                $ref: ../schema/pipeline-ir.v1.schema.json#/$defs/ValidationResult
        '404':
          $ref: '#/components/responses/ContractError'
  /pipelines/{pipelineId}/revisions:
    post:
      operationId: publishPipelineRevision
      description: Publishes an immutable revision after complete static validation.
      parameters:
        - $ref: '#/components/parameters/PipelineId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/pipeline-ir.v1.schema.json
      responses:
        '201':
          description: Immutable published revision
          content:
            application/json:
              schema:
                $ref: ../schema/pipeline-ir.v1.schema.json#/$defs/PipelineRevision
        '409':
          $ref: '#/components/responses/ContractError'
        '422':
          $ref: '#/components/responses/ContractError'
  /pipelines/{pipelineId}/revisions/{revision}/plan:
    get:
      operationId: getPipelineExecutionPlan
      parameters:
        - $ref: '#/components/parameters/PipelineId'
        - name: revision
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Deterministic execution plan
          content:
            application/json:
              schema:
                $ref: ../schema/pipeline-ir.v1.schema.json#/$defs/PipelineExecutionPlan
  /jobs:
    post:
      operationId: submitJob
      summary: Submit one idempotent job for a published pipeline revision
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pipelineId, pipelineRevision, input]
              properties:
                pipelineId: { type: string }
                pipelineRevision: { type: integer, minimum: 1 }
                input: { type: object, maxProperties: 32 }
      responses:
        '202':
          description: Job accepted; a duplicate idempotency key returns the same Job.
          content:
            application/json:
              schema:
                $ref: ../schema/durable-job.v1.schema.json
        '409':
          $ref: '#/components/responses/ContractError'
  /jobs:
    get:
      operationId: listJobs
      parameters:
        - name: pipelineId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [QUEUED, CLAIMED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Durable job list, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { type: object } }
                  nextCursor: { type: string, nullable: true }
        '400': { description: Invalid status/cursor }
        '401': { description: Unauthenticated }
  /jobs/{jobId}/claim:
    post:
      operationId: claimJob
      description: >
        Atomically transitions QUEUED to CLAIMED, creates a lease, increments the
        fencing sequence and returns a fenced JobLease. The caller must present
        its WorkerIdentity. A lease is not proof that the old worker stopped.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/durable-job.v1.schema.json#/$defs/WorkerIdentity
      responses:
        '200':
          description: Lease and fencing token
          content:
            application/json:
              schema:
                $ref: ../schema/durable-job.v1.schema.json#/$defs/JobLease
        '409':
          $ref: '#/components/responses/ContractError'
  /jobs/{jobId}/heartbeat:
    post:
      operationId: heartbeatJob
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/FencingToken'
      responses:
        '200':
          description: Lease renewed
          content:
            application/json:
              schema:
                $ref: ../schema/durable-job.v1.schema.json#/$defs/JobLease
        '409':
          $ref: '#/components/responses/StaleFence'
  /jobs/{jobId}/checkpoint:
    post:
      operationId: saveCheckpoint
      description: Checkpoints are accepted only with the current fencing sequence.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/FencingToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/durable-job.v1.schema.json#/$defs/Checkpoint
      responses:
        '200':
          description: Checkpoint persisted
        '409':
          $ref: '#/components/responses/StaleFence'
  /jobs/{jobId}/result:
    post:
      operationId: submitJobResult
      description: >
        The external side-effect boundary must verify fencing before committing
        output. A stale worker receives 409 and must not receive success.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/FencingToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/durable-job.v1.schema.json#/$defs/JobResult
      responses:
        '200':
          description: Result accepted and persisted
        '409':
          $ref: '#/components/responses/StaleFence'
  /jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: Cancellation requested; worker must observe cancellation at the next fenced boundary.
        '409':
          $ref: '#/components/responses/ContractError'
components:
  parameters:
    PipelineId:
      name: pipelineId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{2,63}$' }
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FencingToken:
      name: X-OpsWeave-Fencing
      in: header
      required: true
      description: Monotonic fencing sequence issued with the current lease.
      schema: { type: integer, minimum: 1 }
  responses:
    ContractError:
      description: Contract or authorization error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StaleFence:
      description: Lease is expired, revoked, or the fencing sequence is stale
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PipelineDraft:
      type: object
      required: [draftId, pipelineId, baseRevision, definition, definitionDigest, version, status]
      properties:
        draftId: { type: string, format: uuid }
        pipelineId: { type: string }
        baseRevision: { type: integer, minimum: 1 }
        definition: { $ref: ../schema/pipeline-ir.v1.schema.json }
        definitionDigest: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        createdBy: { type: string, format: uuid }
        updatedBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]+$' }
        message: { type: string }
        requestId: { type: string }
        retryable: { type: boolean }
