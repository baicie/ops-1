name: staging-preview

# Push to an authorised development branch -> build an immutable SHA-tagged image -> deploy to the
# single staging host over SSH -> verify health -> report one rolling PR comment.
#
# Required repository/environment configuration (GitHub Environment: staging):
#   secrets STAGING_HOST, STAGING_USER, STAGING_SSH_KEY, STAGING_HOST_KEY, STAGING_BASE_URL
#   optional STAGING_ADMIN_EMAIL, STAGING_ADMIN_PASSWORD (the browser smoke logs in with them)
#   optional vars OPSWEAVE_PREVIEW_URL (browser-facing preview origin; defaults to port 3000, the
#     port the kernel listens on, and must name the same origin as STAGING_BASE_URL)
# A missing secret fails the deploy job with an explicit error; the deployment is never skipped.
#
# workflow_dispatch verify_only=true certifies whatever staging already serves: build and deploy are
# skipped, and the expected commit falls back to the dispatched ref HEAD (inputs.sha wins if given).
# Keep it out of a run that is deploying - the "staging-preview" concurrency group cancels in progress.

on:
  push:
    branches:
      - main
      - feat/0.0.5-staging-preview
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA whose image is already published to ghcr.io
        required: false
        type: string
      skip_image_transfer:
        description: Never fall back to shipping the image over SSH when the host cannot pull it (the host pull is always the first and normal transport)
        required: false
        type: boolean
        default: false
      verify_only:
        description: Run only the acceptance suites against the already-deployed staging host; the expected commit is the dispatched ref HEAD
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: staging-preview
  cancel-in-progress: true

env:
  IMAGE_REPO: ghcr.io/baicie/opsweave

jobs:
  build:
    name: build image
    if: ${{ inputs.verify_only != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      digest: ${{ steps.build.outputs.digest }}
      built: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve the target commit
        id: target
        env:
          REQUESTED_SHA: ${{ github.event.inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Expected a 40-character lowercase commit sha, got '$REQUESTED_SHA'."
            exit 1
          fi
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "target commit: $REQUESTED_SHA"

      - name: Decide whether this run must build
        id: decide
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$TARGET_SHA" = "$HEAD_SHA" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "checked-out commit is the target; building it"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "deploying the already published image for $TARGET_SHA instead of relabelling a different tree with that SHA"
          fi

      - name: Verify the staging Dockerfile is present
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          if [ ! -f deployments/staging/Dockerfile ]; then
            echo "::error::deployments/staging/Dockerfile is missing, so the staging image cannot be built. It is owned by the deployment engineer; this job fails instead of producing a broken preview."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.decide.outputs.build == 'true'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the SHA-tagged image
        id: build
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/staging/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ steps.target.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.target.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published image for a re-deploy
        if: steps.decide.outputs.build == 'false'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          if ! docker manifest inspect "$IMAGE_REPO:$TARGET_SHA" >/dev/null 2>&1; then
            echo "::error::No published image found for $TARGET_SHA. Run the build for that commit before re-deploying it."
            exit 1
          fi
          echo "$IMAGE_REPO:$TARGET_SHA exists on the registry"

  deploy:
    name: deploy to staging host
    needs: build
    # verify_only certifies the deployment that is already live; it never re-deploys.
    if: ${{ inputs.verify_only != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: staging
      url: ${{ vars.OPSWEAVE_PREVIEW_URL || 'http://82.156.234.84:3000' }}
    outputs:
      target_sha: ${{ needs.build.outputs.sha }}
      previous_sha: ${{ steps.previous.outputs.sha }}
      result: ${{ steps.fallback.outputs.result || steps.deploy.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate the required configuration
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST_KEY: ${{ secrets.STAGING_HOST_KEY }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          missing=""
          for name in STAGING_HOST STAGING_USER STAGING_SSH_KEY STAGING_HOST_KEY STAGING_BASE_URL; do
            value="${!name:-}"
            if [ -z "${value//[[:space:]]/}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing. Set them on the 'staging' GitHub Environment; this job fails instead of silently skipping the deployment."
            exit 1
          fi
          echo "all five staging secrets are present"

      - name: Configure strict SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST_KEY: ${{ secrets.STAGING_HOST_KEY }}
        run: bash scripts/ci-ssh-setup.sh

      - name: Record the previous release
        id: previous
        run: |
          set -euo pipefail
          previous=""
          if status_out="$(ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" 'sudo -n /srv/opsweave-staging/bin/deploy-staging.sh --status --json' 2>/dev/null)"; then
            previous="$(printf '%s' "$status_out" | python3 -c 'import json,sys;d=json.load(sys.stdin);print((d.get("current") or {}).get("sha") or "")' 2>/dev/null || true)"
          else
            echo "no status from the host yet (first deployment or script not installed)"
          fi
          echo "sha=$previous" >> "$GITHUB_OUTPUT"
          echo "previous release: ${previous:-<none>}"

      - name: Install the deploy script and compose contract on the host
        run: |
          set -euo pipefail
          if [ ! -f deployments/staging/compose.yaml ]; then
            echo "::error::deployments/staging/compose.yaml is missing from the repository; the host cannot be configured and the deploy script would abort."
            exit 1
          fi
          ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" 'sudo -n install -d -m 0755 /srv/opsweave-staging /srv/opsweave-staging/bin'
          scp -F "$SSH_CONFIG_FILE" -o BatchMode=yes scripts/deploy-staging.sh "$SSH_HOST_ALIAS:/tmp/opsweave-deploy-staging.sh"
          scp -F "$SSH_CONFIG_FILE" -o BatchMode=yes deployments/staging/compose.yaml "$SSH_HOST_ALIAS:/tmp/opsweave-compose.yaml"
          ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" 'sudo -n install -m 0755 /tmp/opsweave-deploy-staging.sh /srv/opsweave-staging/bin/deploy-staging.sh'
          ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" 'sudo -n install -m 0644 /tmp/opsweave-compose.yaml /srv/opsweave-staging/compose.yaml'
          ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" 'rm -f /tmp/opsweave-deploy-staging.sh /tmp/opsweave-compose.yaml && /srv/opsweave-staging/bin/deploy-staging.sh --help >/dev/null && echo "deploy script and compose contract installed"'
          # staging.env is operator-owned and is never generated by CI: it carries the database
          # password and the bootstrap admin credential. The deploy script fails loudly without it.

      - name: Authenticate the host to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          set +x
          if ! printf '%s' "$GHCR_ACTOR" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::Unexpected characters in github.actor; refusing to interpolate it into a remote shell."
            exit 1
          fi
          # The token reaches docker login over stdin only: never on a command line, never in a log.
          printf '%s\n' "$GHCR_TOKEN" | ssh -F "$SSH_CONFIG_FILE" -T "$SSH_HOST_ALIAS" "docker login ghcr.io --username '$GHCR_ACTOR' --password-stdin"
          echo "host authenticated to ghcr.io as $GHCR_ACTOR"

      # Transport order: pull first, hand over only as a fallback.
      #
      # The host pulls the image itself. The deploy script warms it before taking the deploy lock
      # (prewarm_image, scripts/deploy-staging.sh:653-666, called from cmd_deploy at :1271), with
      # `docker pull` bounded by ${OPSWEAVE_PULL_TIMEOUT:-900} (:624), and a warm incremental pull
      # is what makes a re-deploy finish in ~29 s. Handing the image over the SSH channel is the
      # fallback: it runs only when this deploy failed *and* the host turned out to hold no image,
      # i.e. only when the host's own pull is what failed. At the measured ~33 KB/s runner -> host
      # rate a full 247 MB docker-save stream needs hours, so the SSH channel can never be the
      # default path - which is why it is not simply given a longer timeout.
      - name: Deploy the release and verify health
        id: deploy
        # Recoverable on purpose: the fallback step below can still obtain the image over SSH. A
        # failure that nothing recovers stays a failure, because every following step is
        # conditional on this outcome and the fallback step fails the job itself.
        continue-on-error: true
        env:
          TARGET_SHA: ${{ needs.build.outputs.sha }}
          PUBLIC_URL: ${{ secrets.STAGING_BASE_URL }}
          # The host-side prewarm reads ${OPSWEAVE_PULL_TIMEOUT:-900}. A workflow env never reaches
          # the host (ssh needs SendEnv, and sudo resets the environment), so the value is also
          # exported on the remote command line in front of sudo; when sudo drops it, the script's
          # own default - the same 900 s - is what bounds the pull.
          OPSWEAVE_PULL_TIMEOUT: '900'
        run: |
          set -euo pipefail
          set +x
          if ! printf '%s' "$PUBLIC_URL" | grep -Eq '^https?://[A-Za-z0-9._~:/?#@!&()*+,;=%-]+$'; then
            echo "::error::STAGING_BASE_URL is not a usable http(s) URL; refusing to interpolate it into a remote command."
            exit 1
          fi
          echo "deploying $TARGET_SHA to the staging host with public origin $PUBLIC_URL"
          if ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" "OPSWEAVE_PULL_TIMEOUT=${OPSWEAVE_PULL_TIMEOUT:-900} sudo -n /srv/opsweave-staging/bin/deploy-staging.sh --sha '$TARGET_SHA' --base-url '$PUBLIC_URL'"; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            code=$?
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "::error::The host deployment failed (exit $code). The host script attempted an automatic rollback; see the staging-deploy artifact for the recorded state."
            exit "$code"
          fi

      - name: Hand the image over SSH after a failed host pull, then deploy again
        id: fallback
        if: ${{ steps.deploy.outcome == 'failure' }}
        timeout-minutes: 20
        env:
          TARGET_SHA: ${{ needs.build.outputs.sha }}
          PUBLIC_URL: ${{ secrets.STAGING_BASE_URL }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          SKIP_IMAGE_TRANSFER: ${{ inputs.skip_image_transfer }}
          OPSWEAVE_PULL_TIMEOUT: '900'
          # The hand-over gets the same 900 s the host pull gets, and it is bounded separately so a
          # timed-out transfer is reported as one instead of being swallowed by the step cap.
          TRANSFER_TIMEOUT: '900'
        run: |
          set -euo pipefail
          set +x
          # Same guard as the deploy step: this step interpolates the same secret into a remote
          # command, and a deploy rejected for a malformed URL must not reach it unvalidated.
          if ! printf '%s' "$PUBLIC_URL" | grep -Eq '^https?://[A-Za-z0-9._~:/?#@!&()*+,;=%-]+$'; then
            echo "::error::STAGING_BASE_URL is not a usable http(s) URL; refusing to interpolate it into a remote command."
            exit 1
          fi
          image="${IMAGE_REPO}:${TARGET_SHA}"

          deploy_release() {
            ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" \
              "OPSWEAVE_PULL_TIMEOUT=${OPSWEAVE_PULL_TIMEOUT:-900} sudo -n /srv/opsweave-staging/bin/deploy-staging.sh --sha '$TARGET_SHA' --base-url '$PUBLIC_URL'"
          }

          # "The host holds no image" is the only evidence that the pull is what failed: prewarm
          # exits before the deploy lock is taken and before anything on the host is touched, so a
          # pull failure leaves the host exactly as it was. Any other failure must not be papered
          # over with a transfer.
          if ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" "sudo docker image inspect '$image' >/dev/null 2>&1"; then
            echo "::error::The host already holds $image, so the failed deploy was not an image transport failure and nothing is transferred; read the deploy step above."
            exit 1
          fi
          if [ "${SKIP_IMAGE_TRANSFER:-false}" = "true" ]; then
            echo "::error::The host does not hold $image and skip_image_transfer disables the fallback transfer for this run; the release cannot be deployed."
            exit 1
          fi

          echo "the host could not obtain $image on its own; handing it over the SSH channel (bounded to ${TRANSFER_TIMEOUT}s)"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin
          docker pull "$image"
          # timeout bounds the transfer itself, and pipefail turns a killed transfer into a failed
          # step instead of a deploy that waits for an image which never arrives.
          docker save "$image" | gzip -1 | timeout "$TRANSFER_TIMEOUT" ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" 'gunzip | sudo docker load'
          ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" "sudo docker image inspect '$image' >/dev/null && echo 'image present on the host: $image'"

          echo "the host holds $image; deploying $TARGET_SHA again"
          deploy_release
          echo "result=success" >> "$GITHUB_OUTPUT"

      - name: Collect host status
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-preview
          if ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" 'sudo -n /srv/opsweave-staging/bin/deploy-staging.sh --status --json' > artifacts/staging-preview/host-status.json 2> artifacts/staging-preview/host-status.stderr; then
            echo "collected host status"
          else
            printf '{"error": "status-unavailable"}\n' > artifacts/staging-preview/host-status.json
          fi
          head -c 4000 artifacts/staging-preview/host-status.json || true

      - name: Upload deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deploy
          path: artifacts/staging-preview/
          if-no-files-found: warn

  smoke:
    name: smoke the preview
    # build is a direct need on purpose: the needs context only exposes direct dependencies, so
    # needs.build.outputs.sha resolves to nothing (and the first smoke case fails closed) whenever
    # build is only reached through deploy.
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    # Sized so that no step can be preempted by the job cap: 20 (core) + 40 (surfaces) + 20
    # (seeded data, which grew by five when visual.spec.ts joined it) = 80 minutes of step caps
    # plus the dependency install. The previous 50 was already below the sum of its own step caps
    # (60), so a slow surfaces run was killed by the job timeout instead of by its own, losing the
    # per-step outcome the record step reports.
    timeout-minutes: 85
    # The suites certify whatever staging serves, so a failed or skipped deploy must not suppress
    # them. verify_only always runs; every other event keeps the deploy-success requirement.
    if: always() && (inputs.verify_only == true || needs.deploy.result == 'success')
    environment:
      name: staging
      url: ${{ vars.OPSWEAVE_PREVIEW_URL || 'http://82.156.234.84:3000' }}
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env:
      # Shared by every browser step below: one preview origin, one credential, one expected commit.
      OPSWEAVE_URL: ${{ secrets.STAGING_BASE_URL }}
      # The commit this run built; staging-smoke.spec.ts fails when the preview does not serve it.
      OPSWEAVE_EXPECTED_SHA: ${{ needs.build.outputs.sha || inputs.sha || github.sha }}
      OPSWEAVE_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
      OPSWEAVE_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Choose the smoke strategy
        id: mode
        run: |
          set -euo pipefail
          if [ -f tests/ui/staging-smoke.spec.ts ]; then
            echo "mode=playwright" >> "$GITHUB_OUTPUT"
            echo "tests/ui/staging-smoke.spec.ts found; running the browser smoke"
          else
            echo "mode=http" >> "$GITHUB_OUTPUT"
            echo "tests/ui/staging-smoke.spec.ts is absent; falling back to inline HTTP assertions (smoke=HTTP_ONLY)"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.mode.outputs.mode == 'playwright'

      - uses: actions/setup-node@v4
        if: steps.mode.outputs.mode == 'playwright'
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace and Chromium
        if: steps.mode.outputs.mode == 'playwright'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @opsweave/ui-tests exec playwright install --with-deps chromium

      # Which job covers which spec file. The lists are literal file filters - never a substring
      # guess and never --grep - and every spec under tests/ui/ is owned by exactly one job:
      #   this job, "core paths"           staging-smoke, dual-surface, admin-shell
      #   this job, "admin, plugin, i18n"  admin-pages, admin-polish, plugin-surfaces,
      #                                    plugin-detail-tabs, business-workspace, overview-partial,
      #                                    async-stale, i18n-locale, dialog-a11y,
      #                                    g08-batch-c, g08-batch-c-mobile
      #   this job, "seeded data"          studio, visual-layout, visual - KNOWN-FLAKY, see the
      #                                    step below. studio and visual-layout navigate to the
      #                                    literal id host-metrics-pipeline and assert a published
      #                                    revision, a rendered node graph and a job that reaches
      #                                    Succeeded. visual is the 1440/1024/390 light+dark
      #                                    screenshot matrix: it reads no pipeline data at all, but
      #                                    it drives a live instance (/ext/trusted-team/hello and an
      #                                    instance log stream), so an idle staging host fails it
      #                                    for a missing deployment rather than a missing seed. No
      #                                    step in this workflow creates either one: the pipeline is
      #                                    seeded out of band through the admin API plus a
      #                                    host-side demo source server
      #                                    (deployments/staging/README.md, "DEMO source"), and the
      #                                    instance comes from installing the demo plugin. The step
      #                                    runs all three and records the outcome plus this reason,
      #                                    and does not gate the job until a seeding step exists.
      #   data-foundation.yml (seeded)     data-foundation, data-foundation-flows
      #                                    (studio and visual-layout also run there against a locally
      #                                    seeded stack, but that gate is path-filtered, so it never
      #                                    fires on a frontend-only change)
      #   uncovered, deliberately          none. visual.spec.ts (the 1440/1024/390 light+dark
      #                                    screenshot matrix) was left uncovered by 49f079f as
      #                                    "needs a seeded staging deployment" and was the last spec
      #                                    wired to nothing; it joins the known-flaky group below,
      #                                    where its outcome is recorded instead of being silent.
      - name: Playwright core paths (staging smoke, dual surface, admin shell)
        id: core
        if: steps.mode.outputs.mode == 'playwright'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-preview
          pnpm --filter @opsweave/ui-tests exec playwright test --output test-results/core \
            staging-smoke.spec.ts \
            dual-surface.spec.ts \
            admin-shell.spec.ts

      # Runs even when the core step failed: a red core path must not silently drop the remaining
      # eleven specs. Both outcomes are recorded separately in the next step and in the PR comment.
      - name: Playwright admin, plugin, i18n and g08 surfaces
        id: surfaces
        if: always() && steps.mode.outputs.mode == 'playwright'
        timeout-minutes: 40
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-preview
          # A separate --output keeps a failed core trace from being overwritten by this run.
          pnpm --filter @opsweave/ui-tests exec playwright test --output test-results/surfaces \
            admin-pages.spec.ts \
            admin-polish.spec.ts \
            plugin-surfaces.spec.ts \
            plugin-detail-tabs.spec.ts \
            business-workspace.spec.ts \
            overview-partial.spec.ts \
            async-stale.spec.ts \
            i18n-locale.spec.ts \
            dialog-a11y.spec.ts \
            g08-batch-c.spec.ts \
            g08-batch-c-mobile.spec.ts

      # The suites whose data this workflow does not own: studio and visual-layout read the seeded
      # staging pipeline, visual reads a live demo instance. They run here rather than being
      # skipped - an absent file list and --grep are both forbidden - and continue-on-error keeps a
      # missing seed from reddening the deployment while the reason is still recorded in
      # health.json and in a warning annotation. Removing the continue-on-error is the whole change
      # once a seeding step lands.
      - name: Playwright seeded-data suites (studio, visual layout, visual) [known-flaky]
        id: seeded
        if: always() && steps.mode.outputs.mode == 'playwright'
        timeout-minutes: 20
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-preview
          # Its own --output so neither neighbouring group's traces are overwritten.
          pnpm --filter @opsweave/ui-tests exec playwright test --output test-results/seeded \
            studio.spec.ts \
            visual-layout.spec.ts \
            visual.spec.ts

      - name: Record the browser suite results
        if: always() && steps.mode.outputs.mode == 'playwright'
        env:
          CORE_OUTCOME: ${{ steps.core.outcome }}
          SURFACES_OUTCOME: ${{ steps.surfaces.outcome }}
          SEEDED_OUTCOME: ${{ steps.seeded.outcome }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-preview
          python3 - <<'PY'
          import json, os

          # Why the seeded-data group is allowed to fail. It names the data it needs so that a red
          # run is self-explaining instead of needing a workflow read to interpret.
          SEED_REASON = (
              "seed-missing: studio and visual-layout read the literal id host-metrics-pipeline and "
              "assert a published revision, a rendered node graph and a job that reaches Succeeded. "
              "visual reads no pipeline data but needs a live instance: it asserts the "
              "/ext/trusted-team/hello extension and an instance log stream, which only exist once "
              "the demo plugin is installed and a node runs it. No step in this workflow creates "
              "either - the pipeline is seeded out of band through the admin API plus a host-side "
              "demo source server. Known-flaky until a seeding step lands."
          )

          # (group, outcome env, spec files, known_flaky, reason)
          GROUPS = [
              ("core",
               os.environ.get("CORE_OUTCOME", ""),
               ["staging-smoke.spec.ts", "dual-surface.spec.ts", "admin-shell.spec.ts"],
               False, ""),
              ("admin-plugin-i18n",
               os.environ.get("SURFACES_OUTCOME", ""),
               ["admin-pages.spec.ts", "admin-polish.spec.ts", "plugin-surfaces.spec.ts",
                "plugin-detail-tabs.spec.ts", "business-workspace.spec.ts", "overview-partial.spec.ts",
                "async-stale.spec.ts", "i18n-locale.spec.ts", "dialog-a11y.spec.ts",
                "g08-batch-c.spec.ts", "g08-batch-c-mobile.spec.ts"],
               False, ""),
              ("seeded-data",
               os.environ.get("SEEDED_OUTCOME", ""),
               ["studio.spec.ts", "visual-layout.spec.ts", "visual.spec.ts"],
               True, SEED_REASON),
          ]

          checks = []
          for name, outcome, files, known_flaky, reason in GROUPS:
              check = {
                  "name": name,
                  "ok": outcome == "success",
                  "known_flaky": known_flaky,
                  "detail": "%s: %s" % (outcome or "not-run", ", ".join(files)),
              }
              if reason:
                  check["reason"] = reason
              checks.append(check)

          # A known-flaky group still runs and is still reported; it is only excluded from the gate.
          ok = all(check["ok"] for check in checks if not check["known_flaky"])

          # The reason must be visible in the run summary, not only in a downloaded artifact.
          for check in checks:
              if check.get("reason") and not check["ok"]:
                  print("::warning::known-flaky suite group '%s' - %s (outcome: %s)"
                        % (check["name"], check["reason"], check["detail"]))

          payload = {
              "mode": "playwright",
              "base_url": os.environ.get("OPSWEAVE_URL", ""),
              "ok": ok,
              "checks": checks,
              "known_flaky_reasons": [reason for _n, _o, _f, _k, reason in GROUPS if reason],
              "suite_groups": [{"name": name, "outcome": outcome, "files": files,
                                "known_flaky": known_flaky}
                               for name, outcome, files, known_flaky, reason in GROUPS],
              "exit_code": 0 if ok else 1,
          }
          with open("artifacts/staging-preview/health.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          print(json.dumps(payload, indent=2))
          PY

      - name: Inline HTTP smoke (fallback)
        if: steps.mode.outputs.mode == 'http'
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          EXPECTED_SHA: ${{ needs.build.outputs.sha || inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-preview
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          base = os.environ["STAGING_BASE_URL"].rstrip("/")
          expected = os.environ.get("EXPECTED_SHA", "").strip()
          marker = 'id="root"'

          def fetch(path, attempts=5, delay=6):
              last = "no attempt"
              for index in range(attempts):
                  try:
                      with urllib.request.urlopen(base + path, timeout=20) as response:
                          return response.getcode(), response.read().decode("utf-8", "replace"), None
                  except urllib.error.HTTPError as exc:
                      last = "http %s" % exc.code
                  except Exception as exc:
                      last = type(exc).__name__
                  if index + 1 < attempts:
                      time.sleep(delay)
              return None, "", last

          checks = []

          def record(name, path, status, ok, detail):
              checks.append({
                  "name": name,
                  "url": base + path,
                  "status": status,
                  "ok": bool(ok),
                  "detail": detail if detail else ("ok" if ok else "failed"),
              })

          status, body, err = fetch("/")
          ok = status == 200 and marker in body
          record("root", "/", status, ok, err or ("root marker present" if ok else "root marker missing"))

          status, _, err = fetch("/livez")
          record("livez", "/livez", status, status == 200, err)

          status, _, err = fetch("/readyz")
          record("readyz", "/readyz", status, status == 200, err)

          status, body, err = fetch("/api/v1/version")
          served = ""
          if status == 200:
              try:
                  served = (json.loads(body) or {}).get("commitSha") or ""
              except Exception:
                  served = ""
          # Fail closed: an unknown expected SHA is a failed certification, not a skipped check.
          ok = status == 200 and bool(expected) and served == expected
          detail = err or ("served %s" % (served or "<none>"))
          if not expected:
              detail = "EXPECTED_SHA is empty; cannot certify the served commit"
          record("version", "/api/v1/version", status, ok, detail)

          payload = {
              "mode": "http-only",
              "base_url": base,
              "expected_sha": expected or None,
              "served_sha": served or None,
              "checked_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "ok": all(check["ok"] for check in checks),
              "checks": checks,
          }
          with open("artifacts/staging-preview/health.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          print(json.dumps(payload, indent=2))
          sys.exit(0 if payload["ok"] else 1)
          PY

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke
          path: |
            artifacts/staging-preview/
            tests/ui/test-results/
          if-no-files-found: warn

  report:
    name: report to pull request
    needs: [build, deploy, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always()
    environment:
      name: staging
      url: ${{ vars.OPSWEAVE_PREVIEW_URL || 'http://82.156.234.84:3000' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      packages: read
    steps:
      - name: Download evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: staging-*
          path: artifacts
          merge-multiple: true

      - name: Compose the single preview comment
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          SMOKE_MODE: ${{ needs.smoke.outputs.mode }}
          TARGET_SHA: ${{ needs.build.outputs.sha || inputs.sha || github.sha }}
          PREVIOUS_SHA: ${{ needs.deploy.outputs.previous_sha }}
          PREVIEW_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import json, os

          MARKER = "<!-- opsweave-staging-preview -->"

          def load(path):
              try:
                  with open(path, encoding="utf-8") as handle:
                      return json.load(handle)
              except Exception:
                  return None

          def cell(value):
              known = {"success": "success", "failure": "failure", "cancelled": "cancelled", "skipped": "skipped"}
              return known.get(value or "", value or "unknown")

          host = load("artifacts/host-status.json") or {}
          health = load("artifacts/health.json") or {}
          last = host.get("last_deploy") or {}
          served = host.get("served_commit") or {}

          rollback = "no"
          if last.get("rolled_back"):
              rollback = "yes, returned to %s" % (last.get("rollback_target") or "<unknown>")

          detail = "unknown"
          if isinstance(health.get("health"), dict):
              probe = health["health"]
              detail = "livez=%s readyz=%s root=%s" % (probe.get("livez"), probe.get("readyz"), probe.get("root"))
          elif isinstance(health.get("checks"), list):
              detail = ", ".join("%s=%s" % (item.get("name"), "ok" if item.get("ok") else "FAIL") for item in health["checks"])
          elif isinstance(health.get("ok"), bool):
              detail = "ok" if health["ok"] else "FAIL"
          elif health.get("exit_code") is not None:
              detail = "playwright exit %s" % health["exit_code"]

          rows = [
              ("Preview", os.environ.get("PREVIEW_URL") or "<unset>"),
              ("Commit", "`%s`" % (os.environ.get("TARGET_SHA") or "<unknown>")),
              ("Build", cell(os.environ.get("BUILD_RESULT"))),
              ("Deploy", cell(os.environ.get("DEPLOY_RESULT"))),
              ("Health (CI)", cell(os.environ.get("SMOKE_RESULT"))),
              ("Health detail", detail),
              ("Smoke mode", os.environ.get("SMOKE_MODE") or "unknown"),
              ("Previous successful deploy", os.environ.get("PREVIOUS_SHA") or "none recorded"),
              ("Rollback", rollback),
              ("Served commit", "%s (%s)" % (served.get("sha") or "unknown", served.get("state") or "unknown")),
          ]

          lines = [MARKER, "## OpsWeave staging preview", "", "| Field | Value |", "|---|---|"]
          for name, value in rows:
              lines.append("| %s | %s |" % (name, str(value).replace("|", "\\|")))
          lines.append("")
          lines.append("Kernel health endpoints: /livez and /readyz. This comment is updated in place on every run and is never duplicated.")
          body = "\n".join(lines) + "\n"

          with open("artifacts/comment.md", "w", encoding="utf-8") as handle:
              handle.write(body)
          with open("artifacts/comment.json", "w", encoding="utf-8") as handle:
              json.dump({"body": body}, handle)
          print(body)
          PY

      - name: Update or create the single PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ needs.build.outputs.sha || inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          pr=""
          if [ -n "${TARGET_SHA:-}" ]; then
            pr="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/commits/$TARGET_SHA/pulls?per_page=20" --jq '[.[] | select(.state=="open")][0].number // empty' 2>/dev/null || true)"
            if [ -z "$pr" ]; then
              pr="$(gh api "repos/$REPO/commits/$TARGET_SHA/pulls?per_page=1" --jq '.[0].number // empty' 2>/dev/null || true)"
            fi
          fi
          if [ -z "$pr" ]; then
            echo "no pull request is associated with ${TARGET_SHA:-this commit}; nothing to comment on"
            exit 0
          fi
          existing="$(gh api --paginate "repos/$REPO/issues/$pr/comments?per_page=100" --jq '.[] | select(.body | contains("<!-- opsweave-staging-preview -->")) | .id' 2>/dev/null | head -n1 || true)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input artifacts/comment.json >/dev/null
            echo "updated the existing staging preview comment (id $existing) on PR #$pr"
          else
            gh api -X POST "repos/$REPO/issues/$pr/comments" --input artifacts/comment.json >/dev/null
            echo "created the staging preview comment on PR #$pr"
          fi
