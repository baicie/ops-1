name: staging-preview

# Push to an authorised development branch -> build an immutable SHA-tagged image -> deploy to the
# single staging host over SSH -> verify health -> report one rolling PR comment.
#
# Required repository/environment configuration (GitHub Environment: staging):
#   secrets STAGING_HOST, STAGING_USER, STAGING_SSH_KEY, STAGING_HOST_KEY, STAGING_BASE_URL
#   optional STAGING_ADMIN_EMAIL, STAGING_ADMIN_PASSWORD (the browser suites and the demo-plugin
#     seed log in with them; when unset both fall back to the demo account committed in
#     tests/ui/*.spec.ts, admin@opsweave.local, because that is the credential the specs drive)
#   optional vars OPSWEAVE_PREVIEW_URL (browser-facing preview origin; defaults to port 3000, the
#     port the kernel listens on, and must name the same origin as STAGING_BASE_URL)
# A missing secret fails the deploy job with an explicit error; the deployment is never skipped.
#
# workflow_dispatch verify_only=true certifies whatever staging already serves: build and deploy are
# skipped, and sha is required. It is the commit the host is serving - the one thing the certification
# asserts - and its absence fails the plan job before a runner is spent, instead of falling back.
# It occupies its own concurrency bucket (see the concurrency block below), so a verification run
# and a deploy run never cancel each other in either direction.
# A certification always runs the full tier - certifying the deployed build with a subset certifies
# nothing - and there is no downgrade switch out of it; the plan job writes down why.
#
# Two acceptance tiers, decided once by the plan job and read by every job that cares:
#   core  a push, or a workflow_dispatch without full_suite=true and without verify_only: the three
#         core specs only (staging-smoke, dual-surface, admin-shell), the 4.4 min path.
#   full  workflow_dispatch full_suite=true, or workflow_dispatch verify_only=true: adds the
#         eleven-file surfaces suite and the three seeded-data suites (one job each).
# A step the tier leaves out is never silent: the record job writes it into health.json
# (steps_not_run, with the reason) and into the PR comment. This repository has been bitten by
# "green because nothing ran" before.

on:
  push:
    branches:
      - main
      - feat/0.0.5-staging-preview
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA whose image is already published to ghcr.io
        required: false
        type: string
      skip_image_transfer:
        description: Never fall back to shipping the image over SSH when the host cannot pull it (the host pull is always the first and normal transport)
        required: false
        type: boolean
        default: false
      verify_only:
        description: Run only the acceptance suites against the already-deployed staging host; requires sha - the commit the host is serving, which the identity assertion checks
        required: false
        type: boolean
        default: false
      full_suite:
        description: Run the full acceptance suite (the eleven-file surfaces suite plus the three seeded-data suites) instead of the push-tier core run (always on when verify_only=true)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  pull-requests: write

# Two buckets, one staging host. The group is keyed by what the run does, not by the workflow name:
#   deploy  a push, or workflow_dispatch without verify_only. It mutates the single staging host, so
#           every deploy run shares one group and cancel-in-progress lets the newest supersede the
#           one in flight - that is the protection that stops repeated pushes from stacking
#           deployments, and it keeps two deploys from ever running at the same time.
#   verify  workflow_dispatch verify_only=true. It only certifies the release that is already live
#           and mutates nothing, so it is keyed by the commit it certifies: a baseline and its
#           candidate are different SHAs, land in different groups, and neither can cancel the
#           other. Repeating a verify of the same SHA is the same work, so that may supersede.
# A deploy and a verify therefore never land in the same group, in either direction.
# Do not fold the buckets back into one name: a single group is what let a CI deploy and a manual
# deploy fight over one lock, and what cancelled run 40818496709 (baseline 11fe91c) the moment
# 40818576895 (candidate e6142ff) was triggered, losing the comparison the two runs existed to make.
concurrency:
  group: "staging-preview-${{ (inputs.verify_only == true) && format('verify-{0}', inputs.sha || github.sha) || 'deploy' }}"
  cancel-in-progress: true

env:
  IMAGE_REPO: ghcr.io/baicie/opsweave

jobs:
  # The acceptance tier is decided once, before anything runs, and every job that cares reads
  # plan.outputs.tier - so the gate that skips a step and the record that explains the skip cannot
  # disagree. Two places deciding one skip is how a skip eventually gets reported wrongly.
  #
  #   core  a push, or a workflow_dispatch without full_suite=true and without verify_only: the three
  #         core specs only (staging-smoke, dual-surface, admin-shell) - the 4.4 min path.
  #   full  workflow_dispatch with full_suite=true or with verify_only=true: adds the eleven-file
  #         surfaces suite and the three seeded-data suites.
  #
  # There is no pull_request tier: this workflow has no pull_request trigger, so a branch that
  # selected one would be unreachable code claiming a behaviour no run has ever had. A pull request
  # that wants the full suite is dispatched with full_suite=true.
  # A step the tier leaves out is written down by the record job (health.json steps_not_run) instead
  # of disappearing: this repository has already paid for "green because nothing ran" once.
  plan:
    name: plan the run tier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      reason: ${{ steps.tier.outputs.reason }}
    steps:
      # verify_only certifies the build that is already deployed, and the single thing it asserts is
      # that the host serves a named commit. That assertion has no useful default, so a dispatch that
      # omits the commit stops here, before any job spends a runner:
      #   - falling back to github.sha is right only on the day the dispatched ref HEAD happens to be
      #     the live build; every other day it is a red run that blames the host for a mismatch the
      #     dispatch created (run on 187fc60 expected 187fc60 and served 192256c - nothing was wrong
      #     with the deployment).
      #   - taking the commit the host reports instead would compare the served sha with itself. That
      #     is a tautology: it cannot fail, so it certifies nothing.
      # Neither is a default worth having; ask for the commit instead.
      - name: Require the commit that verify_only certifies
        id: dispatch
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ "${VERIFY_ONLY:-}" != "true" ]; then
            echo "not a verify_only dispatch: the build job resolves the commit to build and deploy"
            exit 0
          fi
          sha="$(printf '%s' "${INPUT_SHA:-}" | tr -d '[:space:]')"
          if [ -z "$sha" ]; then
            echo "::error::verify_only=true needs the commit the staging host is serving: re-dispatch with -f sha=<40-character commitSha>."
            echo "verify_only never builds and never deploys; it certifies what is already live, so the"
            echo "served-commit assertion (tests/ui/staging-smoke.spec.ts:53, servedSHA == OPSWEAVE_EXPECTED_SHA)"
            echo "has nothing to compare against unless the commit is named. Falling back to github.sha only"
            echo "holds when this ref HEAD is the deployed build, and comparing the host's sha with itself"
            echo "asserts nothing at all."
            echo "Read the served commit from the last run's PR comment ('Served commit'), or on the host from"
            echo "deploy-staging.sh --status --json (served_commit.sha), then re-dispatch:"
            echo "  gh workflow run staging-preview.yml -f verify_only=true -f sha=<that commit>"
            exit 1
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha='$sha' is not a 40-character lowercase hex commit SHA, and the served-commit assertion compares it byte-for-byte (tests/ui/staging-smoke.spec.ts:53)."
            echo "Pass the full commitSha from the last run's PR comment ('Served commit'), or from deploy-staging.sh --status --json (served_commit.sha): gh workflow run staging-preview.yml -f verify_only=true -f sha=<40-hex>"
            exit 1
          fi
          echo "verify_only will certify $sha as the commit the host serves"

      - name: Choose the acceptance tier
        id: tier
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          FULL_SUITE: ${{ inputs.full_suite }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          set -euo pipefail
          # verify_only certifies the build that is already deployed. A certification that runs a
          # subset certifies nothing: it would hand back a green record with the surfaces and
          # seeded-data groups reading "skipped, tier=core" on the one run whose entire purpose is to
          # vouch for what is live. So verify_only is full, unconditionally.
          #
          # There is deliberately no full_suite=false escape hatch out of that. This input is
          # declared default:false, so "the operator passed false" and "the operator passed
          # nothing" both arrive here as the string false; a rule that downgraded on an explicit
          # false would downgrade on every verify_only dispatch, which is precisely the behaviour
          # being removed here. Recovering that distinction means turning full_suite into a string
          # input with no default - a change to the dispatch contract - to buy a fast path whose only
          # purpose is skipping the suites a certification exists to run. Dispatch without
          # verify_only when the core path is what you want; ask for verify_only to certify.
          if [ "$VERIFY_ONLY" = "true" ]; then
            echo "tier=full" >> "$GITHUB_OUTPUT"
            echo "reason=verify_only=true certifies the build that is already deployed, so the whole suite runs" >> "$GITHUB_OUTPUT"
            echo "::notice::acceptance tier full - verify_only=true certifies the deployed build, so the full suite runs (surfaces and seeded-data included)"
            exit 0
          fi
          if [ "$FULL_SUITE" = "true" ]; then
            full_reason="workflow_dispatch asked for the full suite (full_suite=true)"
          else
            full_reason=""
          fi
          if [ -n "$full_reason" ]; then
            echo "tier=full" >> "$GITHUB_OUTPUT"
            echo "reason=$full_reason" >> "$GITHUB_OUTPUT"
            echo "::notice::acceptance tier full - $full_reason"
            exit 0
          fi
          case "$EVENT_NAME" in
            push) trigger="a push to $REF_NAME" ;;
            workflow_dispatch) trigger="a workflow_dispatch without full_suite=true and without verify_only" ;;
            *) trigger="event $EVENT_NAME" ;;
          esac
          reason="$trigger, so only the core path runs (staging-smoke.spec.ts, dual-surface.spec.ts, admin-shell.spec.ts)"
          echo "tier=core" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "::notice::acceptance tier core - $reason. The surfaces suite and the three seeded-data suites are recorded as not-run in health.json; run workflow_dispatch with full_suite=true for the full suite."

  build:
    name: build image
    if: ${{ inputs.verify_only != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      digest: ${{ steps.build.outputs.digest }}
      built: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve the target commit
        id: target
        env:
          REQUESTED_SHA: ${{ github.event.inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Expected a 40-character lowercase commit sha, got '$REQUESTED_SHA'."
            exit 1
          fi
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "target commit: $REQUESTED_SHA"

      - name: Decide whether this run must build
        id: decide
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$TARGET_SHA" = "$HEAD_SHA" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "checked-out commit is the target; building it"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "deploying the already published image for $TARGET_SHA instead of relabelling a different tree with that SHA"
          fi

      - name: Verify the staging Dockerfile is present
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          if [ ! -f deployments/staging/Dockerfile ]; then
            echo "::error::deployments/staging/Dockerfile is missing, so the staging image cannot be built. It is owned by the deployment engineer; this job fails instead of producing a broken preview."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.decide.outputs.build == 'true'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the SHA-tagged image
        id: build
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/staging/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ steps.target.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.target.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published image for a re-deploy
        if: steps.decide.outputs.build == 'false'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          if ! docker manifest inspect "$IMAGE_REPO:$TARGET_SHA" >/dev/null 2>&1; then
            echo "::error::No published image found for $TARGET_SHA. Run the build for that commit before re-deploying it."
            exit 1
          fi
          echo "$IMAGE_REPO:$TARGET_SHA exists on the registry"

  deploy:
    name: deploy to staging host
    needs: build
    # verify_only certifies the deployment that is already live; it never re-deploys.
    if: ${{ inputs.verify_only != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: staging
      url: ${{ vars.OPSWEAVE_PREVIEW_URL || 'http://82.156.234.84:3000' }}
    outputs:
      target_sha: ${{ needs.build.outputs.sha }}
      previous_sha: ${{ steps.previous.outputs.sha }}
      result: ${{ steps.fallback.outputs.result || steps.deploy.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate the required configuration
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST_KEY: ${{ secrets.STAGING_HOST_KEY }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          missing=""
          for name in STAGING_HOST STAGING_USER STAGING_SSH_KEY STAGING_HOST_KEY STAGING_BASE_URL; do
            value="${!name:-}"
            if [ -z "${value//[[:space:]]/}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing. Set them on the 'staging' GitHub Environment; this job fails instead of silently skipping the deployment."
            exit 1
          fi
          echo "all five staging secrets are present"

      - name: Configure strict SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST_KEY: ${{ secrets.STAGING_HOST_KEY }}
        run: bash scripts/ci-ssh-setup.sh

      - name: Record the previous release
        id: previous
        run: |
          set -euo pipefail
          previous=""
          if status_out="$(ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" 'sudo -n /srv/opsweave-staging/bin/deploy-staging.sh --status --json' 2>/dev/null)"; then
            previous="$(printf '%s' "$status_out" | python3 -c 'import json,sys;d=json.load(sys.stdin);print((d.get("current") or {}).get("sha") or "")' 2>/dev/null || true)"
          else
            echo "no status from the host yet (first deployment or script not installed)"
          fi
          echo "sha=$previous" >> "$GITHUB_OUTPUT"
          echo "previous release: ${previous:-<none>}"

      - name: Install the deploy script and compose contract on the host
        run: |
          set -euo pipefail
          if [ ! -f deployments/staging/compose.yaml ]; then
            echo "::error::deployments/staging/compose.yaml is missing from the repository; the host cannot be configured and the deploy script would abort."
            exit 1
          fi
          ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" 'sudo -n install -d -m 0755 /srv/opsweave-staging /srv/opsweave-staging/bin'
          scp -F "$SSH_CONFIG_FILE" -o BatchMode=yes scripts/deploy-staging.sh "$SSH_HOST_ALIAS:/tmp/opsweave-deploy-staging.sh"
          scp -F "$SSH_CONFIG_FILE" -o BatchMode=yes deployments/staging/compose.yaml "$SSH_HOST_ALIAS:/tmp/opsweave-compose.yaml"
          ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" 'sudo -n install -m 0755 /tmp/opsweave-deploy-staging.sh /srv/opsweave-staging/bin/deploy-staging.sh'
          ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" 'sudo -n install -m 0644 /tmp/opsweave-compose.yaml /srv/opsweave-staging/compose.yaml'
          ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" 'rm -f /tmp/opsweave-deploy-staging.sh /tmp/opsweave-compose.yaml && /srv/opsweave-staging/bin/deploy-staging.sh --help >/dev/null && echo "deploy script and compose contract installed"'
          # staging.env is operator-owned and is never generated by CI: it carries the database
          # password and the bootstrap admin credential. The deploy script fails loudly without it.

      - name: Authenticate the host to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          set +x
          if ! printf '%s' "$GHCR_ACTOR" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::Unexpected characters in github.actor; refusing to interpolate it into a remote shell."
            exit 1
          fi
          # The token reaches docker login over stdin only: never on a command line, never in a log.
          printf '%s\n' "$GHCR_TOKEN" | ssh -F "$SSH_CONFIG_FILE" -T "$SSH_HOST_ALIAS" "docker login ghcr.io --username '$GHCR_ACTOR' --password-stdin"
          echo "host authenticated to ghcr.io as $GHCR_ACTOR"

      # Transport order: pull first, hand over only as a fallback.
      #
      # The host pulls the image itself. The deploy script warms it before taking the deploy lock
      # (prewarm_image, scripts/deploy-staging.sh:653-666, called from cmd_deploy at :1271), with
      # `docker pull` bounded by ${OPSWEAVE_PULL_TIMEOUT:-900} (:624), and a warm incremental pull
      # is what makes a re-deploy finish in ~29 s. Handing the image over the SSH channel is the
      # fallback: it runs only when this deploy failed *and* the host turned out to hold no image,
      # i.e. only when the host's own pull is what failed. At the measured ~33 KB/s runner -> host
      # rate a full 247 MB docker-save stream needs hours, so the SSH channel can never be the
      # default path - which is why it is not simply given a longer timeout.
      - name: Deploy the release and verify health
        id: deploy
        # Recoverable on purpose: the fallback step below can still obtain the image over SSH. A
        # failure that nothing recovers stays a failure, because every following step is
        # conditional on this outcome and the fallback step fails the job itself.
        continue-on-error: true
        env:
          TARGET_SHA: ${{ needs.build.outputs.sha }}
          PUBLIC_URL: ${{ secrets.STAGING_BASE_URL }}
          # The host-side prewarm reads ${OPSWEAVE_PULL_TIMEOUT:-900}. A workflow env never reaches
          # the host (ssh needs SendEnv, and sudo resets the environment), so the value is also
          # exported on the remote command line in front of sudo; when sudo drops it, the script's
          # own default - the same 900 s - is what bounds the pull.
          OPSWEAVE_PULL_TIMEOUT: '900'
        run: |
          set -euo pipefail
          set +x
          if ! printf '%s' "$PUBLIC_URL" | grep -Eq '^https?://[A-Za-z0-9._~:/?#@!&()*+,;=%-]+$'; then
            echo "::error::STAGING_BASE_URL is not a usable http(s) URL; refusing to interpolate it into a remote command."
            exit 1
          fi
          echo "deploying $TARGET_SHA to the staging host with public origin $PUBLIC_URL"
          if ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" "OPSWEAVE_PULL_TIMEOUT=${OPSWEAVE_PULL_TIMEOUT:-900} sudo -n /srv/opsweave-staging/bin/deploy-staging.sh --sha '$TARGET_SHA' --base-url '$PUBLIC_URL'"; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            code=$?
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "::error::The host deployment failed (exit $code). The host script attempted an automatic rollback; see the staging-deploy artifact for the recorded state."
            exit "$code"
          fi

      - name: Hand the image over SSH after a failed host pull, then deploy again
        id: fallback
        if: ${{ steps.deploy.outcome == 'failure' }}
        timeout-minutes: 20
        env:
          TARGET_SHA: ${{ needs.build.outputs.sha }}
          PUBLIC_URL: ${{ secrets.STAGING_BASE_URL }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          SKIP_IMAGE_TRANSFER: ${{ inputs.skip_image_transfer }}
          OPSWEAVE_PULL_TIMEOUT: '900'
          # The hand-over gets the same 900 s the host pull gets, and it is bounded separately so a
          # timed-out transfer is reported as one instead of being swallowed by the step cap.
          TRANSFER_TIMEOUT: '900'
        run: |
          set -euo pipefail
          set +x
          # Same guard as the deploy step: this step interpolates the same secret into a remote
          # command, and a deploy rejected for a malformed URL must not reach it unvalidated.
          if ! printf '%s' "$PUBLIC_URL" | grep -Eq '^https?://[A-Za-z0-9._~:/?#@!&()*+,;=%-]+$'; then
            echo "::error::STAGING_BASE_URL is not a usable http(s) URL; refusing to interpolate it into a remote command."
            exit 1
          fi
          image="${IMAGE_REPO}:${TARGET_SHA}"

          deploy_release() {
            ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" \
              "OPSWEAVE_PULL_TIMEOUT=${OPSWEAVE_PULL_TIMEOUT:-900} sudo -n /srv/opsweave-staging/bin/deploy-staging.sh --sha '$TARGET_SHA' --base-url '$PUBLIC_URL'"
          }

          # "The host holds no image" is the only evidence that the pull is what failed: prewarm
          # exits before the deploy lock is taken and before anything on the host is touched, so a
          # pull failure leaves the host exactly as it was. Any other failure must not be papered
          # over with a transfer.
          if ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" "sudo docker image inspect '$image' >/dev/null 2>&1"; then
            echo "::error::The host already holds $image, so the failed deploy was not an image transport failure and nothing is transferred; read the deploy step above."
            exit 1
          fi
          if [ "${SKIP_IMAGE_TRANSFER:-false}" = "true" ]; then
            echo "::error::The host does not hold $image and skip_image_transfer disables the fallback transfer for this run; the release cannot be deployed."
            exit 1
          fi

          echo "the host could not obtain $image on its own; handing it over the SSH channel (bounded to ${TRANSFER_TIMEOUT}s)"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin
          docker pull "$image"
          # timeout bounds the transfer itself, and pipefail turns a killed transfer into a failed
          # step instead of a deploy that waits for an image which never arrives.
          docker save "$image" | gzip -1 | timeout "$TRANSFER_TIMEOUT" ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" 'gunzip | sudo docker load'
          ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" "sudo docker image inspect '$image' >/dev/null && echo 'image present on the host: $image'"

          echo "the host holds $image; deploying $TARGET_SHA again"
          deploy_release
          echo "result=success" >> "$GITHUB_OUTPUT"

      - name: Collect host status
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-preview
          if ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes "$SSH_HOST_ALIAS" 'sudo -n /srv/opsweave-staging/bin/deploy-staging.sh --status --json' > artifacts/staging-preview/host-status.json 2> artifacts/staging-preview/host-status.stderr; then
            echo "collected host status"
          else
            printf '{"error": "status-unavailable"}\n' > artifacts/staging-preview/host-status.json
          fi
          head -c 4000 artifacts/staging-preview/host-status.json || true

      - name: Upload deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deploy
          path: artifacts/staging-preview/
          if-no-files-found: warn

  smoke:
    name: smoke the preview
    # build is a direct need on purpose: the needs context only exposes direct dependencies, so
    # needs.build.outputs.sha resolves to nothing (and the first smoke case fails closed) whenever
    # build is only reached through deploy.
    # plan is a direct need for the same reason build is: the needs context only exposes direct
    # dependencies, so needs.plan.outputs.tier would resolve to nothing - and a core-tier push would
    # silently run every surfaces step - whenever plan were reached only through another job.
    needs: [plan, build, deploy]
    runs-on: ubuntu-24.04
    # Sized so that no step can be preempted by the job cap: 20 (core) + 40 (surfaces) = 60 minutes
    # of step caps plus the dependency install. The seeded-data suites are their own jobs now, so
    # the 20 minutes they used to add no longer belong here.
    timeout-minutes: 70
    # The suites certify whatever staging serves, so a failed or skipped deploy must not suppress
    # them. verify_only always runs; every other event keeps the deploy-success requirement.
    # A failed plan does suppress them: the plan job is where a dispatch that cannot certify anything
    # is rejected (verify_only without the commit it certifies), and running the suites anyway would
    # report that rejection as a served-commit mismatch - the confusing red this gate removes.
    if: always() && needs.plan.result == 'success' && (inputs.verify_only == true || needs.deploy.result == 'success')
    environment:
      name: staging
      url: ${{ vars.OPSWEAVE_PREVIEW_URL || 'http://82.156.234.84:3000' }}
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      # Step outcomes, not job results: the record job has no other way to learn that core passed and
      # surfaces did not, and a single job result would collapse the two into one.
      core_outcome: ${{ steps.core.outcome }}
      surfaces_outcome: ${{ steps.surfaces.outcome }}
      # Diagnostics, carried as job outputs rather than left to the artifact: the record job composes
      # health.json from the needs context, and a download step would go red whenever a cancelled
      # smoke job left no artifact. Both are compact JSON summaries of the files the steps also write
      # under artifacts/staging-preview/ (runner-network.json, playwright-timings.json).
      runner_network: ${{ steps.netprobe.outputs.summary }}
      playwright_timings: ${{ steps.timings.outputs.summary }}
      # The table audit and its geometry gate are acceptance steps too, and they used to be
      # invisible to the record: run 41612408372 had 4/6 audit cases time out, the job went red,
      # and health.json still said ok:true / exit_code:0. A red step that the record cannot see is
      # the "green because nothing recorded it" failure this workflow exists to prevent.
      metrics_outcome: ${{ steps.metrics.outcome }}
      geometry_outcome: ${{ steps.geometry.outcome }}
      # What Playwright actually said when it failed, so the record can tell "the product answered
      # wrong" from "the browser never reached the product". Empty on a green run.
      core_failure: ${{ steps.core.outputs.failure_summary }}
    env:
      # Shared by every browser step below: one preview origin, one credential, one expected commit.
      OPSWEAVE_URL: ${{ secrets.STAGING_BASE_URL }}
      # The commit this run built; staging-smoke.spec.ts fails when the preview does not serve it.
      OPSWEAVE_EXPECTED_SHA: ${{ needs.build.outputs.sha || inputs.sha || github.sha }}
      OPSWEAVE_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
      OPSWEAVE_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Choose the smoke strategy
        id: mode
        run: |
          set -euo pipefail
          if [ -f tests/ui/staging-smoke.spec.ts ]; then
            echo "mode=playwright" >> "$GITHUB_OUTPUT"
            echo "tests/ui/staging-smoke.spec.ts found; running the browser smoke"
          else
            echo "mode=http" >> "$GITHUB_OUTPUT"
            echo "tests/ui/staging-smoke.spec.ts is absent; falling back to inline HTTP assertions (smoke=HTTP_ONLY)"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.mode.outputs.mode == 'playwright'

      - uses: actions/setup-node@v4
        if: steps.mode.outputs.mode == 'playwright'
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace and Chromium
        if: steps.mode.outputs.mode == 'playwright'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @opsweave/ui-tests exec playwright install --with-deps chromium

      # Stage 1 and stage 2, measured on the machine that has never measured them: this runner.
      #
      # docs/acceptance/g12-staging-runner-measurement.md §7.1: four runs of this workflow at the
      # same commit produced two failures and two passes with no code difference, and every
      # measurement made anywhere else says the host is healthy - so the failure localises to the
      # path between this runner and the host, by elimination only. Nothing inside the job had ever
      # recorded what this runner's own network stack saw. This step does, immediately before the
      # browsers start: DNS, TCP connect, TLS ('n/a' on this http origin), TTFB and total, four
      # attempts per path, plus the runner's own nproc, load average and free memory.
      #
      # Diagnostics, never a gate: a failed probe is written into the JSON with its curl exit code
      # and stderr, announced with ::warning::, and the step still exits 0. A probe that failed the
      # run would turn "the path is bad" into "the job is red", which is the distinction this record
      # exists to make. The file rides with artifacts/staging-preview and its summary is exported as
      # the runner_network job output, which the record job carries into health.json.
      - name: Measure the runner-side network path
        id: netprobe
        if: always()
        # Bounded so a path that blackholes every attempt cannot hold the job open: the worst case
        # is 16 attempts x curl --max-time 20 s (~5.3 min) plus process start-up.
        timeout-minutes: 10
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          set -uo pipefail
          mkdir -p artifacts/staging-preview
          # Never let an undefined output read as a measurement the record job can trust.
          printf 'summary=%s\n' '{"available":false,"reason":"probe-did-not-complete"}' >> "${GITHUB_OUTPUT:-/dev/null}"
          python3 - <<'PY'
          import json, os, statistics, subprocess, time

          OUT = os.environ.get("RUNNER_NETWORK_OUT", "artifacts/staging-preview/runner-network.json")
          PATHS = ("/livez", "/readyz", "/api/v1/version", "/")
          ATTEMPTS = 4
          CURL_TEMPLATE = (
              '{"http_code":"%{http_code}","dns_s":%{time_namelookup},"connect_s":%{time_connect},'
              '"appconnect_s":%{time_appconnect},"starttransfer_s":%{time_starttransfer},'
              '"total_s":%{time_total},"size_download":%{size_download},'
              '"remote_ip":"%{remote_ip}","num_connects":%{num_connects}}'
          )


          def now_iso():
              return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())


          def runner_facts():
              facts = {"nproc": os.cpu_count()}
              try:
                  with open("/proc/loadavg", encoding="utf-8") as handle:
                      facts["loadavg"] = [float(value) for value in handle.read().split()[:3]]
                  facts["loadavg_source"] = "/proc/loadavg"
              except (OSError, ValueError):
                  try:
                      facts["loadavg"] = list(os.getloadavg())
                      facts["loadavg_source"] = "os.getloadavg"
                  except (OSError, AttributeError):
                      facts["loadavg"] = None
                      facts["loadavg_source"] = "unavailable"
              try:
                  memory = {}
                  with open("/proc/meminfo", encoding="utf-8") as handle:
                      for line in handle:
                          key, _, rest = line.partition(":")
                          if key in ("MemTotal", "MemFree", "MemAvailable"):
                              memory[key + "_kb"] = int(rest.split()[0])
                  facts["memory"] = memory or None
                  facts["memory_source"] = "/proc/meminfo" if memory else "unavailable"
              except (OSError, ValueError, IndexError):
                  facts["memory"] = None
                  facts["memory_source"] = "unavailable"
              return facts


          def curl_version():
              try:
                  completed = subprocess.run(["curl", "--version"], capture_output=True, text=True, timeout=10)
                  first = (completed.stdout or "").strip().splitlines()
                  return first[0] if first else None
              except (OSError, subprocess.TimeoutExpired):
                  return None


          def millis(seconds):
              try:
                  return round(float(seconds) * 1000.0, 2)
              except (TypeError, ValueError):
                  return None


          def probe_once(url, scheme):
              command = ["curl", "-sS", "-o", os.devnull, "--connect-timeout", "10",
                         "--max-time", "20", "-w", CURL_TEMPLATE, url]
              started = time.time()
              try:
                  completed = subprocess.run(command, capture_output=True, text=True, timeout=30)
              except (OSError, subprocess.TimeoutExpired) as exc:
                  return {"ok": False, "curl_exit": None,
                          "error": "%s: %s" % (type(exc).__name__, exc),
                          "wall_ms": millis(time.time() - started)}
              # One line, so the ::warning:: annotation stays one annotation per path.
              stderr = " ".join((completed.stderr or "").split())
              lines = (completed.stdout or "").strip().splitlines()
              parsed, error = None, None
              if lines:
                  try:
                      parsed = json.loads(lines[-1])
                  except ValueError as exc:
                      error = "unparseable curl -w output: %s" % exc
              else:
                  error = "curl -w produced no output"
              if completed.returncode != 0:
                  detail = "curl exit %d" % completed.returncode
                  if stderr:
                      detail += ": " + stderr
                  error = (error + "; " + detail) if error else detail
              if parsed is None:
                  return {"ok": False, "curl_exit": completed.returncode,
                          "error": error or "no measurement", "wall_ms": millis(time.time() - started)}
              dns = millis(parsed.get("dns_s"))
              connect = millis(parsed.get("connect_s"))
              appconnect = millis(parsed.get("appconnect_s"))
              tcp_connect = None if dns is None or connect is None else round(max(0.0, connect - dns), 2)
              if scheme == "https":
                  tls = "n/a" if tcp_connect is None or appconnect is None else round(max(0.0, appconnect - tcp_connect - dns), 2)
              else:
                  tls = "n/a"
              http_code = parsed.get("http_code")
              try:
                  http_code = int(http_code)
              except (TypeError, ValueError):
                  pass
              http_ok = isinstance(http_code, int) and 200 <= http_code < 400
              ok = completed.returncode == 0 and http_ok
              if not error and completed.returncode == 0 and not http_ok:
                  error = "http %s" % http_code
              return {
                  "ok": ok,
                  "curl_exit": completed.returncode,
                  "http_code": http_code,
                  "dns_ms": dns,
                  "tcp_connect_ms": tcp_connect,
                  "tls_ms": tls,
                  "ttfb_ms": millis(parsed.get("starttransfer_s")),
                  "total_ms": millis(parsed.get("total_s")),
                  "size_download": parsed.get("size_download"),
                  "remote_ip": parsed.get("remote_ip") or None,
                  "num_connects": parsed.get("num_connects"),
                  "error": error,
              }


          def stats(values):
              numbers = [value for value in values if isinstance(value, (int, float))]
              if not numbers:
                  return None
              return {"min": min(numbers), "median": round(statistics.median(numbers), 2), "max": max(numbers)}


          def build(base):
              scheme = "https" if base.lower().startswith("https://") else "http"
              probes = []
              for path in PATHS:
                  url = base + path
                  attempts = []
                  for index in range(1, ATTEMPTS + 1):
                      record = probe_once(url, scheme)
                      record["attempt"] = index
                      attempts.append(record)
                  successes = [record for record in attempts if record["ok"]]
                  failures = [record for record in attempts if not record["ok"]]
                  probes.append({
                      "path": path,
                      "url": url,
                      "attempts": attempts,
                      "summary": {
                          "attempts": len(attempts),
                          "successes": len(successes),
                          "failures": len(failures),
                          "http_codes": sorted({record.get("http_code") for record in attempts
                                                if record.get("http_code") is not None}, key=str),
                          "dns_ms": stats([record.get("dns_ms") for record in successes]),
                          "tcp_connect_ms": stats([record.get("tcp_connect_ms") for record in successes]),
                          "tls_ms": "n/a" if scheme == "http" else stats([record.get("tls_ms") for record in successes]),
                          "ttfb_ms": stats([record.get("ttfb_ms") for record in successes]),
                          "total_ms": stats([record.get("total_ms") for record in successes]),
                          "errors": [record["error"] for record in failures if record.get("error")],
                      },
                  })
              if all(probe["summary"]["successes"] == ATTEMPTS for probe in probes):
                  overall = "ok"
              elif all(probe["summary"]["successes"] > 0 for probe in probes):
                  overall = "degraded"
              else:
                  overall = "failed"
              return scheme, probes, overall


          def write_payload(payload):
              directory = os.path.dirname(OUT)
              if directory:
                  os.makedirs(directory, exist_ok=True)
              with open(OUT, "w", encoding="utf-8") as handle:
                  json.dump(payload, handle, indent=2)
                  handle.write("\n")


          def emit_summary(payload):
              compact = json.dumps(payload, separators=(",", ":"))
              output = os.environ.get("GITHUB_OUTPUT")
              if output:
                  with open(output, "a", encoding="utf-8") as handle:
                      handle.write("summary<<OPSWEAVE_NET_EOF\n%s\nOPSWEAVE_NET_EOF\n" % compact)


          def main():
              base = (os.environ.get("STAGING_BASE_URL", "") or "").strip().rstrip("/")
              if not base:
                  payload = {"schema": "opsweave.runner-network/1", "available": False,
                             "reason": "STAGING_BASE_URL-empty", "recorded_at": now_iso()}
                  write_payload(payload)
                  emit_summary(payload)
                  print("::warning::runner network probe did not run: STAGING_BASE_URL is empty")
                  return
              scheme, probes, overall = build(base)
              payload = {
                  "schema": "opsweave.runner-network/1",
                  "available": True,
                  "recorded_at": now_iso(),
                  "base_url": base,
                  "scheme": scheme,
                  "attempts_per_path": ATTEMPTS,
                  "curl_version": curl_version(),
                  "runner": runner_facts(),
                  "time_semantics": ("All values are milliseconds. dns_ms = curl time_namelookup; "
                                     "tcp_connect_ms = time_connect - time_namelookup; tls_ms = "
                                     "time_appconnect - time_connect (https only, 'n/a' on http); ttfb_ms = "
                                     "time_starttransfer; total_ms = time_total. ttfb_ms and total_ms are "
                                     "cumulative from the start of the request, as curl defines them."),
                  "overall": overall,
                  "paths": probes,
              }
              write_payload(payload)
              summary = {
                  "schema": payload["schema"],
                  "available": True,
                  "source": "artifacts/staging-preview/runner-network.json (staging-smoke artifact)",
                  "recorded_at": payload["recorded_at"],
                  # The origin is DELIBERATELY absent here even though the file keeps it: it is the
                  # value of the STAGING_BASE_URL secret, and an output carrying a secret does not
                  # survive into the record job. Measured on run 41611651844: the probe ran and
                  # printed its summary, the record job received `RUNNER_NETWORK: ` empty, and the
                  # only difference from the step output that did propagate (playwright_timings)
                  # was this field. The record job already has the URL through DEPLOY_BASE_URL.
                  "attempts_per_path": ATTEMPTS,
                  "curl_version": payload["curl_version"],
                  "runner": payload["runner"],
                  "overall": overall,
                  "paths": [{"path": probe["path"], **{key: probe["summary"][key] for key in
                             ("successes", "failures", "http_codes", "dns_ms", "tcp_connect_ms",
                              "tls_ms", "ttfb_ms", "total_ms", "errors")}}
                            for probe in probes],
              }
              emit_summary(summary)
              print(json.dumps(summary, indent=2))
              for probe in probes:
                  failed = probe["summary"]["failures"]
                  if failed:
                      errors = "; ".join(dict.fromkeys(probe["summary"]["errors"])) or "unknown error"
                      print("::warning::runner network probe %s: %d/%d attempts failed (%s)"
                            % (probe["path"], failed, probe["summary"]["attempts"], errors))
              print("runner network probe: %s" % overall)


          try:
              main()
          except Exception as exc:
              payload = {"schema": "opsweave.runner-network/1", "available": False,
                         "reason": "probe-crashed", "recorded_at": now_iso(),
                         "error": "%s: %s" % (type(exc).__name__, exc)}
              try:
                  write_payload(payload)
                  emit_summary(payload)
              finally:
                  print("::warning::runner network probe crashed: %s" % payload["error"])
          PY
          exit 0

      # Which job covers which spec file. The lists are literal file filters - never a substring
      # guess and never --grep - and every spec under tests/ui/ is owned by exactly one job:
      #   this job, "core paths"           staging-smoke, dual-surface, admin-shell
      #   this job, "admin, plugin, i18n"  admin-pages, admin-polish, plugin-surfaces,
      #                                    plugin-detail-tabs, business-workspace, overview-partial,
      #                                    async-stale, i18n-locale, dialog-a11y,
      #                                    g08-batch-c, g08-batch-c-mobile
      #   seeded-* jobs (one each)        studio, visual-layout, visual - KNOWN-FLAKY, see the
      #                                    step below. studio and visual-layout navigate to the
      #                                    literal id host-metrics-pipeline and assert a published
      #                                    revision and a rendered node graph; studio's run-page case
      #                                    submits a job and asserts it reaches Succeeded, so that
      #                                    stack has to be able to execute one. Neither is created by
      #                                    this workflow: the pipeline is seeded out of band through
      #                                    the admin API plus a host-side demo source server
      #                                    (deployments/staging/README.md, "DEMO source"). visual is
      #                                    the 1440/1024/390 light+dark screenshot matrix: it reads no
      #                                    pipeline data at all, but it drives a live instance
      #                                    (/ext/trusted-team/hello and an instance log stream), so an
      #                                    idle host fails it for a missing deployment rather than a
      #                                    missing seed - and that half is seeded now: seeded_visual
      #                                    installs the demo plugin before its suite, idempotently, in
      #                                    a step whose failure is reported instead of hidden. Each
      #                                    of the three runs as its own known-flaky job, so the record
      #                                    job can name the file that actually failed, and none of
      #                                    them gates the run.
      #   data-foundation.yml (seeded)     data-foundation, data-foundation-flows
      #                                    (studio and visual-layout also run there against a locally
      #                                    seeded stack, but that gate is path-filtered, so it never
      #                                    fires on a frontend-only change)
      #   uncovered, deliberately          none. visual.spec.ts (the 1440/1024/390 light+dark
      #                                    screenshot matrix) was left uncovered by 49f079f as
      #                                    "needs a seeded staging deployment" and was the last spec
      #                                    wired to nothing; it joins the known-flaky group below,
      #                                    where its outcome is recorded instead of being silent.
      - name: Playwright core paths (staging smoke, dual surface, admin shell)
        id: core
        if: steps.mode.outputs.mode == 'playwright'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-preview/timings
          # Bounds for "Record Playwright wall-clock durations", below the last suite: the trap
          # writes the end marker even when this step fails, so a slow run and a failed run can be
          # told apart after the fact. Seconds resolution is enough for steps that take minutes.
          date +%s > artifacts/staging-preview/timings/core.start
          trap 'date +%s > artifacts/staging-preview/timings/core.end' EXIT
          # Capture the run's output so the record can classify a red. Step outcomes say only
          # "failure"; without the text, a navigation that expired and an assertion that was
          # contradicted are indistinguishable downstream - measured: every reachable
          # check["detail"] is "failure: file1, file2", which matches no classifier.
          set +e
          pnpm --filter @opsweave/ui-tests exec playwright test --output test-results/core \
            staging-smoke.spec.ts \
            dual-surface.spec.ts \
            admin-shell.spec.ts 2>&1 | tee artifacts/staging-preview/core.log
          core_status=${PIPESTATUS[0]}
          set -e
          # Keep only the lines that say WHY, bounded so the job output stays small.
          grep -E 'Error:|expect\(|Timeout|TimeoutError|waitFor|navigating to|ERR_|at .*spec\.ts' \
            artifacts/staging-preview/core.log 2>/dev/null | tail -40 \
            > artifacts/staging-preview/core-failure.txt || true
          {
            printf 'failure_summary<<OPSWEAVE_CORE_EOF\n'
            head -c 4000 artifacts/staging-preview/core-failure.txt 2>/dev/null || true
            printf '\nOPSWEAVE_CORE_EOF\n'
          } >> "$GITHUB_OUTPUT"
          exit "$core_status"

      # Runs even when the core step failed: a red core path must not silently drop the remaining
      # eleven specs. Both outcomes are recorded separately in the next step and in the PR comment.
      - name: Playwright admin, plugin, i18n and g08 surfaces
        id: surfaces
        # Tier gate: this is the 16.8 min step, so it runs in the full tier only. A core-tier run
        # records it in health.json as not-run with that reason - it never just looks absent.
        if: always() && steps.mode.outputs.mode == 'playwright' && needs.plan.outputs.tier == 'full'
        timeout-minutes: 40
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-preview/timings
          # Same wall-clock bounds as the core step; absent (and recorded as such) when the tier
          # skipped this step.
          date +%s > artifacts/staging-preview/timings/surfaces.start
          trap 'date +%s > artifacts/staging-preview/timings/surfaces.end' EXIT
          # A separate --output keeps a failed core trace from being overwritten by this run.
          pnpm --filter @opsweave/ui-tests exec playwright test --output test-results/surfaces \
            admin-pages.spec.ts \
            admin-polish.spec.ts \
            plugin-surfaces.spec.ts \
            plugin-detail-tabs.spec.ts \
            business-workspace.spec.ts \
            overview-partial.spec.ts \
            async-stale.spec.ts \
            i18n-locale.spec.ts \
            dialog-a11y.spec.ts \
            g08-batch-c.spec.ts \
            g08-batch-c-mobile.spec.ts

      - name: Inline HTTP smoke (fallback)
        if: steps.mode.outputs.mode == 'http'
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          EXPECTED_SHA: ${{ needs.build.outputs.sha || inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-preview
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          base = os.environ["STAGING_BASE_URL"].rstrip("/")
          expected = os.environ.get("EXPECTED_SHA", "").strip()
          marker = 'id="root"'

          def fetch(path, attempts=5, delay=6):
              last = "no attempt"
              for index in range(attempts):
                  try:
                      with urllib.request.urlopen(base + path, timeout=20) as response:
                          return response.getcode(), response.read().decode("utf-8", "replace"), None
                  except urllib.error.HTTPError as exc:
                      last = "http %s" % exc.code
                  except Exception as exc:
                      last = type(exc).__name__
                  if index + 1 < attempts:
                      time.sleep(delay)
              return None, "", last

          checks = []

          def record(name, path, status, ok, detail):
              checks.append({
                  "name": name,
                  "url": base + path,
                  "status": status,
                  "ok": bool(ok),
                  "detail": detail if detail else ("ok" if ok else "failed"),
              })

          status, body, err = fetch("/")
          ok = status == 200 and marker in body
          record("root", "/", status, ok, err or ("root marker present" if ok else "root marker missing"))

          status, _, err = fetch("/livez")
          record("livez", "/livez", status, status == 200, err)

          status, _, err = fetch("/readyz")
          record("readyz", "/readyz", status, status == 200, err)

          status, body, err = fetch("/api/v1/version")
          served = ""
          if status == 200:
              try:
                  served = (json.loads(body) or {}).get("commitSha") or ""
              except Exception:
                  served = ""
          # Fail closed: an unknown expected SHA is a failed certification, not a skipped check.
          ok = status == 200 and bool(expected) and served == expected
          detail = err or ("served %s" % (served or "<none>"))
          if not expected:
              detail = "EXPECTED_SHA is empty; cannot certify the served commit"
          record("version", "/api/v1/version", status, ok, detail)

          payload = {
              "mode": "http-only",
              "base_url": base,
              "expected_sha": expected or None,
              "served_sha": served or None,
              "checked_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "ok": all(check["ok"] for check in checks),
              "checks": checks,
          }
          # The record job owns health.json on every path, so this fallback keeps its own evidence
          # file; the PR comment falls back to it when health.json carries no http result.
          with open("artifacts/staging-preview/http-smoke.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          print(json.dumps(payload, indent=2))
          sys.exit(0 if payload["ok"] else 1)
          PY

      # table-spec §4.2: the nine geometry assertions, in two steps because they have two failure
      # modes. The audit writes _metrics_*.json (a browser pass); the gate reads that JSON (no
      # browser). Until this pair existed the numbers were produced and nothing consumed them:
      # artifacts/ui/visual-v3/audit/_metrics_r390-light-en.json recorded 223px of horizontal
      # overflow on /admin/jobs/{id} and shipped, because scripts/check-ui-metrics.mjs only read
      # `overflow` and only ci.yml ran it - and ci.yml has no browser.
      #
      # It lives here rather than in a new ci.yml job because a login is real: the harness stubs
      # every data endpoint, but POST /api/v1/auth/login still reaches a kernel. A ci.yml job would
      # have to build and start the Rust kernel plus a database for every pull request - more
      # infrastructure than the gate it pays for. This job already installs Chromium and holds the
      # admin credential, so the gate costs one extra browser pass.
      #
      # if: always() on both, and the steps are separate on purpose: a red core run must not skip
      # the measurement, and a gate that receives no files must fail rather than find nothing wrong
      # (check-ui-metrics.mjs exits 1 on an empty directory for exactly that reason).
      - name: Table geometry audit (table-spec §4.1, writes _metrics_*.json)
        id: metrics
        if: always() && steps.mode.outputs.mode == 'playwright'
        timeout-minutes: 15
        env:
          V3_MODE: after
          # This host has Chrome; a runner has Chromium. Same engine class, same geometry.
          V3_CHANNEL: chromium
          V3_OUT: ${{ github.workspace }}/artifacts/staging-preview/metrics
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-preview/timings
          # Same wall-clock bounds as the two suites above; this Playwright pass is the last one
          # that writes into artifacts/staging-preview between the probe and the timing record.
          date +%s > artifacts/staging-preview/timings/metrics.start
          trap 'date +%s > artifacts/staging-preview/timings/metrics.end' EXIT
          mkdir -p artifacts/staging-preview/metrics
          pnpm --filter @opsweave/ui-tests exec playwright test --output test-results/metrics \
            ui-table-audit.spec.ts

      - name: Table geometry gate (table-spec §4.2)
        id: geometry
        if: always() && steps.mode.outputs.mode == 'playwright'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # ls first: when the audit step died, this log says so instead of leaving a bare exit 1.
          ls -la artifacts/staging-preview/metrics
          node scripts/check-ui-metrics.mjs artifacts/staging-preview/metrics

      # A slow run and a failed run are different evidence, and the step outcome alone cannot tell
      # them apart: core "failure" after 180 s is a stall, core "success" after 19 min is a slow path
      # that still got there. The runner does not expose per-step durations to the job, so each
      # Playwright step above writes its own start/end markers (the end via an EXIT trap, so a failed
      # step has one too) and this step reads them back. Diagnostics only, like the probe: it exits 0
      # and its file rides with artifacts/staging-preview.
      - name: Record Playwright wall-clock durations
        id: timings
        if: always()
        env:
          CORE_OUTCOME: ${{ steps.core.outcome }}
          SURFACES_OUTCOME: ${{ steps.surfaces.outcome }}
          METRICS_OUTCOME: ${{ steps.metrics.outcome }}
        run: |
          set -uo pipefail
          mkdir -p artifacts/staging-preview
          printf 'summary=%s\n' '{"available":false,"reason":"timings-did-not-complete"}' >> "${GITHUB_OUTPUT:-/dev/null}"
          python3 - <<'PY'
          import json, os, time

          OUT = os.environ.get("PLAYWRIGHT_TIMINGS_OUT", "artifacts/staging-preview/playwright-timings.json")
          MARKER_DIR = os.environ.get("PLAYWRIGHT_TIMINGS_DIR", "artifacts/staging-preview/timings")
          STEPS = (
              ("core", "Playwright core paths (staging smoke, dual surface, admin shell)", "CORE_OUTCOME"),
              ("surfaces", "Playwright admin, plugin, i18n and g08 surfaces", "SURFACES_OUTCOME"),
              ("metrics", "Table geometry audit (Playwright, writes _metrics_*.json)", "METRICS_OUTCOME"),
          )


          def read_epoch(name):
              try:
                  with open(os.path.join(MARKER_DIR, name), encoding="utf-8") as handle:
                      return float((handle.read() or "").strip())
              except (OSError, ValueError):
                  return None


          def main():
              now = time.time()
              steps = []
              for step, title, outcome_env in STEPS:
                  started = read_epoch("%s.start" % step)
                  ended = read_epoch("%s.end" % step)
                  end_source = "end-marker"
                  if ended is None and started is not None:
                      ended = now
                      end_source = "timing-step-clock"
                  outcome = (os.environ.get(outcome_env, "") or "").strip()
                  steps.append({
                      "step": step,
                      "title": title,
                      "outcome": outcome or "not-evaluated",
                      "outcome_recorded": outcome in ("success", "failure"),
                      "started_epoch": round(started, 3) if started is not None else None,
                      "ended_epoch": round(ended, 3) if ended is not None else None,
                      "elapsed_seconds": round(ended - started, 2) if started is not None and ended is not None else None,
                      "end_source": end_source if started is not None else "no-start-marker",
                  })
              measured = [entry["elapsed_seconds"] for entry in steps if entry["elapsed_seconds"] is not None]
              payload = {
                  "schema": "opsweave.playwright-timings/1",
                  "available": True,
                  "recorded_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "note": ("elapsed_seconds is wall clock between the start and end markers the Playwright step "
                           "writes itself (end marker via an EXIT trap, so a failed step still has one). A step "
                           "the tier/mode skipped has no markers and null elapsed_seconds. outcome is the step's "
                           "own recorded outcome, so a slow run (success, long) is distinguishable from a "
                           "failed one (failure, any duration)."),
                  "steps": steps,
                  "total_playwright_seconds": round(sum(measured), 2) if measured else None,
              }
              directory = os.path.dirname(OUT)
              if directory:
                  os.makedirs(directory, exist_ok=True)
              with open(OUT, "w", encoding="utf-8") as handle:
                  json.dump(payload, handle, indent=2)
                  handle.write("\n")
              summary = {
                  "schema": payload["schema"],
                  "available": True,
                  "source": "artifacts/staging-preview/playwright-timings.json (staging-smoke artifact)",
                  "recorded_at": payload["recorded_at"],
                  "steps": [{"step": entry["step"], "outcome": entry["outcome"],
                             "elapsed_seconds": entry["elapsed_seconds"]} for entry in steps],
                  "total_playwright_seconds": payload["total_playwright_seconds"],
              }
              compact = json.dumps(summary, separators=(",", ":"))
              output = os.environ.get("GITHUB_OUTPUT")
              if output:
                  with open(output, "a", encoding="utf-8") as handle:
                      handle.write("summary<<OPSWEAVE_TIMINGS_EOF\n%s\nOPSWEAVE_TIMINGS_EOF\n" % compact)
              print(json.dumps(summary, indent=2))


          try:
              main()
          except Exception as exc:
              payload = {"schema": "opsweave.playwright-timings/1", "available": False,
                         "reason": "timings-crashed",
                         "recorded_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                         "error": "%s: %s" % (type(exc).__name__, exc)}
              try:
                  with open(OUT, "w", encoding="utf-8") as handle:
                      json.dump(payload, handle, indent=2)
                      handle.write("\n")
              finally:
                  print("::warning::playwright timing record crashed: %s" % payload["error"])
          PY
          exit 0

      # The core and surfaces steps above drive admin-pages, admin-polish, g08-batch-c*,
      # overview-partial, async-stale, i18n-locale, dialog-a11y, business-workspace,
      # plugin-surfaces and admin-shell. Every one of those specs writes full-page PNGs into
      # artifacts/ui/ or artifacts/ui-admin-shell-v2/ rather than a temp dir, and admin-polish
      # alone emits 84 of them as g08-<short-sha>-<page>-<viewport>-<theme>-<lang>.png. This was
      # the only smoke/seeded job whose path list omitted those two trees, so a run's screenshots
      # had no way off the runner except being committed - which is how nine successive g08 runs
      # landed in the index. They are run output, not curated baselines: archive them here and let
      # tests/ci/check-tracked-png-budget.mjs keep them out of the tree. The three seeded jobs
      # below already upload artifacts/ui/ in exactly this shape.
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke
          path: |
            artifacts/staging-preview/
            artifacts/ui/
            artifacts/ui-admin-shell-v2/
            tests/ui/test-results/
          if-no-files-found: warn

  # The three seeded-data suites run one spec file per job. Their data used to be created out of band
  # only (a host-metrics-pipeline with a published revision, plus an installed demo plugin with a live
  # instance - deployments/staging/README.md, "DEMO source"). Half of that is in the workflow now:
  # seeded_visual runs "Seed the demo hello plugin" before its suite. The pipeline still has no step,
  # and nothing in this workflow observes it, so all three stay known-flaky and none gates the run.
  #
  # Why parallel: the three used to be three steps of one job, run one after another, and they share
  # no mutable state. studio.spec.ts writes (draft create/save, one publish on host-metrics-pipeline,
  # one job submission); visual-layout.spec.ts only reads geometry of the same pages (card count and
  # box heights, canvas box, .studio-rf-node presence, page overflow) and asserts no data value a
  # publish would change; visual.spec.ts touches no pipeline at all (overview/plugins/nodes/activity/
  # access/settings matrices, the /ext/trusted-team/hello extension and an instance log stream). The
  # editor opens the published revision unless a draft is explicitly created ("Create draft",
  # studio.spec.ts:49), so a draft studio holds is not picked up by the other two.
  seeded_studio:
    name: seeded-data studio [known-flaky]
    needs: [plan, build, deploy, smoke]
    if: ${{ always() && needs.plan.outputs.tier == 'full' && needs.smoke.outputs.mode == 'playwright' && (inputs.verify_only == true || needs.deploy.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.OPSWEAVE_PREVIEW_URL || 'http://82.156.234.84:3000' }}
    outputs:
      # The suite's own outcome, not the job's: the run step is continue-on-error, so a red suite
      # leaves the job green (it must never gate) while the record job still learns what happened.
      outcome: ${{ steps.play.outcome }}
    env:
      OPSWEAVE_URL: ${{ secrets.STAGING_BASE_URL }}
      OPSWEAVE_EXPECTED_SHA: ${{ needs.build.outputs.sha || inputs.sha || github.sha }}
      OPSWEAVE_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
      OPSWEAVE_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace and Chromium
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @opsweave/ui-tests exec playwright install --with-deps chromium

      - name: Playwright seeded-data suite - studio (host-metrics-pipeline) [known-flaky]
        id: play
        timeout-minutes: 9
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-preview
          pnpm --filter @opsweave/ui-tests exec playwright test --output test-results/seeded-studio \
            studio.spec.ts

      - name: Name the outcome in the run summary
        if: always()
        env:
          OUTCOME: ${{ steps.play.outcome }}
        run: |
          set -euo pipefail
          echo "studio.spec.ts outcome: ${OUTCOME:-not-run}"
          if [ "${OUTCOME:-not-run}" != "success" ]; then
            echo "::warning::seeded-data suite studio.spec.ts is ${OUTCOME:-not-run}. It does not gate this run; health.json names the data it needs."
          fi

      - name: Upload the seeded-data evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-seeded-studio
          path: |
            artifacts/staging-preview/
            artifacts/ui/
            tests/ui/test-results/
          if-no-files-found: warn

  seeded_visual_layout:
    name: seeded-data visual layout [known-flaky]
    needs: [plan, build, deploy, smoke]
    if: ${{ always() && needs.plan.outputs.tier == 'full' && needs.smoke.outputs.mode == 'playwright' && (inputs.verify_only == true || needs.deploy.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.OPSWEAVE_PREVIEW_URL || 'http://82.156.234.84:3000' }}
    outputs:
      # The suite's own outcome, not the job's: the run step is continue-on-error, so a red suite
      # leaves the job green (it must never gate) while the record job still learns what happened.
      outcome: ${{ steps.play.outcome }}
    env:
      OPSWEAVE_URL: ${{ secrets.STAGING_BASE_URL }}
      OPSWEAVE_EXPECTED_SHA: ${{ needs.build.outputs.sha || inputs.sha || github.sha }}
      OPSWEAVE_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
      OPSWEAVE_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace and Chromium
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @opsweave/ui-tests exec playwright install --with-deps chromium

      - name: Playwright seeded-data suite - visual layout (host-metrics-pipeline) [known-flaky]
        id: play
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-preview
          pnpm --filter @opsweave/ui-tests exec playwright test --output test-results/seeded-vlayout \
            visual-layout.spec.ts

      - name: Name the outcome in the run summary
        if: always()
        env:
          OUTCOME: ${{ steps.play.outcome }}
        run: |
          set -euo pipefail
          echo "visual-layout.spec.ts outcome: ${OUTCOME:-not-run}"
          if [ "${OUTCOME:-not-run}" != "success" ]; then
            echo "::warning::seeded-data suite visual-layout.spec.ts is ${OUTCOME:-not-run}. It does not gate this run; health.json names the data it needs."
          fi

      - name: Upload the seeded-data evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-seeded-vlayout
          path: |
            artifacts/staging-preview/
            artifacts/ui/
            tests/ui/test-results/
          if-no-files-found: warn

  seeded_visual:
    name: seeded-data visual [known-flaky]
    # Runs after smoke: all four jobs drive the same single staging host, and the core/surfaces
    # suites are timing sensitive (which is why core and surfaces never run in parallel either).
    # Sequencing this group behind smoke keeps the only new concurrency inside the group.
    needs: [plan, build, deploy, smoke]
    if: ${{ always() && needs.plan.outputs.tier == 'full' && needs.smoke.outputs.mode == 'playwright' && (inputs.verify_only == true || needs.deploy.result == 'success') }}
    runs-on: ubuntu-24.04
    # 30, not 20: this job now seeds the demo plugin first, and that seed builds opsctl from source
    # (a cold cargo build) before it can talk to the platform. The cap is set so the build, the
    # workspace install and the 6-minute suite can all finish - a step must never be preempted by
    # the job cap, because a preempted step reports a timeout instead of its real outcome.
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.OPSWEAVE_PREVIEW_URL || 'http://82.156.234.84:3000' }}
    outputs:
      # The suite's own outcome, not the job's: the run step is continue-on-error, so a red suite
      # leaves the job green (it must never gate) while the record job still learns what happened.
      outcome: ${{ steps.play.outcome }}
      # The seed step's outcome, so the record job can name the step that failed rather than only the
      # resource it left missing.
      hello_install: ${{ steps.hello.outcome }}
    env:
      OPSWEAVE_URL: ${{ secrets.STAGING_BASE_URL }}
      OPSWEAVE_EXPECTED_SHA: ${{ needs.build.outputs.sha || inputs.sha || github.sha }}
      OPSWEAVE_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
      OPSWEAVE_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace and Chromium
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @opsweave/ui-tests exec playwright install --with-deps chromium

      # The demo plugin is the half of this suite's data that a step can actually create: visual.spec.ts
      # drives /ext/trusted-team/hello and an instance log stream, which exist only while
      # dev.opsweave.hello is installed, deployed and serving a READY instance. Until now that was true
      # only because someone had installed it by hand on the host - the hand-installed folklore 6d04a83
      # set out to remove - so it is wired in here, in the job that needs it.
      #
      # It may fail without turning this job red. The group is known-flaky and never gates, and the
      # suite must still run: skipping it would leave the record job reading a step outcome of nothing
      # for a job that reported success, which it would have to record as a failure with no cause
      # (resolve_status falls through to "failed / job-success"). Running it produces a real outcome,
      # and the step below writes the seed's own outcome - and where to read the reason - into the log
      # and into health.json. What must never happen is the failure being invisible.
      - name: Install the Rust toolchain for opsctl (the installer's only API client)
        uses: dtolnay/rust-toolchain@stable

      - name: Seed the demo hello plugin (idempotent)
        id: hello
        continue-on-error: true
        timeout-minutes: 12
        env:
          # role=node is the label the staging node runtime enrols with; the deployment is pinned to
          # it. Override here if the node is ever relabelled.
          OPSWEAVE_HELLO_SELECTOR: role=node
        run: |
          set -euo pipefail
          # opsctl and a session are runner-side needs of the installer, not install-time needs of the
          # plugin. What the step deliberately does not take is the publish path's registry and SSH
          # secrets: the bundle is already staged on the platform (scripts/publish-demo-hello-plugin.sh
          # is a release step, run once, not per CI run), so this only deploys and activates it. That is
          # also why the bundle is needed only on the ABSENT branch of the installer.
          # Credentials: the staging environment has no STAGING_ADMIN_* secret. An unset secret used to
          # reach login as an empty email/password and fail there with INVALID_REQUEST ("email and
          # password are required"), so the seed could not work at all. These are the same documented
          # demo-account defaults every tests/ui/*.spec.ts already logs in with, so the seed resolves
          # them exactly the way the suites do - and, like the suites, a real secret still wins. The
          # source is announced and the value is not: it is a demo account, not a secret, but there is
          # no reason to echo a password into a public log.
          admin_email="${OPSWEAVE_ADMIN_EMAIL:-admin@opsweave.local}"
          admin_password="${OPSWEAVE_ADMIN_PASSWORD:-OpsWeave!2026}"
          if [ -n "${OPSWEAVE_ADMIN_EMAIL:-}" ] && [ -n "${OPSWEAVE_ADMIN_PASSWORD:-}" ]; then
            echo "admin credentials: STAGING_ADMIN_EMAIL/STAGING_ADMIN_PASSWORD"
          else
            echo "::warning::STAGING_ADMIN_EMAIL/STAGING_ADMIN_PASSWORD are not set in the staging environment; the seed logs in with the demo account committed in tests/ui/*.spec.ts. If that account has been rotated, set both secrets."
            echo "admin credentials: tests/ui demo-account default (staging secrets unset)"
          fi
          cargo build -q -p opsweave-opsctl
          ./target/debug/opsctl --url "$OPSWEAVE_URL" login \
            --email "$admin_email" --password "$admin_password"
          bash scripts/demo_hello_up.sh

      - name: Name the demo plugin seed outcome in the run summary
        if: always()
        env:
          OUTCOME: ${{ steps.hello.outcome }}
        run: |
          set -euo pipefail
          echo "demo hello plugin seed: ${OUTCOME:-not-run}"
          if [ "${OUTCOME:-not-run}" != "success" ]; then
            # An error annotation, not a failed step: continue-on-error above keeps the suite runnable,
            # and this is what makes the failure impossible to miss in the run summary.
            echo "::error::could not install dev.opsweave.hello@0.0.1 (seed outcome: ${OUTCOME:-not-run}); the seed step's log above names the cause - a missing bundle means the package was never staged on the platform (scripts/publish-demo-hello-plugin.sh), and a deploy or activate error means the platform holds the package but could not serve it"
            echo "visual.spec.ts still runs. Whatever it reports, the record job writes this seed's outcome into health.json (the seeded-data check's seeds) and into the PR comment, so a green suite is never read as 'this pipeline installed the plugin' when it did not."
          fi

      - name: Playwright seeded-data suite - visual (demo plugin, live instance) [known-flaky]
        id: play
        timeout-minutes: 6
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-preview
          pnpm --filter @opsweave/ui-tests exec playwright test --output test-results/seeded-visual \
            visual.spec.ts

      - name: Name the outcome in the run summary
        if: always()
        env:
          OUTCOME: ${{ steps.play.outcome }}
        run: |
          set -euo pipefail
          echo "visual.spec.ts outcome: ${OUTCOME:-not-run}"
          if [ "${OUTCOME:-not-run}" != "success" ]; then
            echo "::warning::seeded-data suite visual.spec.ts is ${OUTCOME:-not-run}. It does not gate this run; health.json names the data it needs."
          fi

      - name: Upload the seeded-data evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-seeded-visual
          path: |
            artifacts/staging-preview/
            artifacts/ui/
            tests/ui/test-results/
          if-no-files-found: warn

  # health.json has exactly one author: this job. It is the only place that knows every suite's fate -
  # a step outcome for core/surfaces, a job output plus job result for the three seeded suites - and it
  # is where a suite that did not run is written down instead of vanishing. A skipped step carries the
  # reason it was skipped, because "green because nothing ran" is a failure this repository has already
  # paid for once.
  record:
    name: record the acceptance evidence
    needs: [plan, build, deploy, smoke, seeded_studio, seeded_visual_layout, seeded_visual]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Always: a red core step, a failed seeded job and a cancelled run all still owe the reader a record.
    if: always()
    environment:
      name: staging
      url: ${{ vars.OPSWEAVE_PREVIEW_URL || 'http://82.156.234.84:3000' }}
    steps:
      - name: Compose health.json
        if: always()
        env:
          TIER: ${{ needs.plan.outputs.tier }}
          TIER_REASON: ${{ needs.plan.outputs.reason }}
          OPSWEAVE_URL: ${{ secrets.STAGING_BASE_URL }}
          SMOKE_MODE: ${{ needs.smoke.outputs.mode }}
          CORE_OUTCOME: ${{ needs.smoke.outputs.core_outcome }}
          SURFACES_OUTCOME: ${{ needs.smoke.outputs.surfaces_outcome }}
          STUDIO_OUTCOME: ${{ needs.seeded_studio.outputs.outcome }}
          STUDIO_RESULT: ${{ needs.seeded_studio.result }}
          VISUAL_LAYOUT_OUTCOME: ${{ needs.seeded_visual_layout.outputs.outcome }}
          VISUAL_LAYOUT_RESULT: ${{ needs.seeded_visual_layout.result }}
          VISUAL_OUTCOME: ${{ needs.seeded_visual.outputs.outcome }}
          VISUAL_RESULT: ${{ needs.seeded_visual.result }}
          # The demo-plugin seed's own outcome, so a red visual suite can name the step that was
          # supposed to install the plugin instead of only the plugin it is missing.
          VISUAL_SEED_OUTCOME: ${{ needs.seeded_visual.outputs.hello_install }}
          # Deployment facts. These are the ONLY inputs the deployment verdict may read: `checks`
          # carries suite groups and nothing about the deploy, which is how the first version of
          # this verdict reported PASSED on every run including a failed deploy.
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          EXPECTED_SHA: ${{ needs.deploy.outputs.target_sha }}
          # The origin the preview answers on, for the served-commit probe.
          DEPLOY_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          # The deploy step's own outcome: it exits 0 only after /livez, /readyz and / answer.
          DEPLOY_STEP_OUTCOME: ${{ needs.deploy.outputs.result }}
          # Diagnostics from the smoke job. They are parsed AFTER `verdicts` is computed and nothing
          # below branches on them: the runner's own network view (docs/acceptance/
          # g12-staging-runner-measurement.md §7.1) and each Playwright step's wall-clock duration.
          # A degraded path here is evidence, not a verdict - it must not turn a suite failure into
          # UNVERIFIED or a green run into anything else.
          RUNNER_NETWORK: ${{ needs.smoke.outputs.runner_network }}
          PLAYWRIGHT_TIMINGS: ${{ needs.smoke.outputs.playwright_timings }}
          METRICS_OUTCOME: ${{ needs.smoke.outputs.metrics_outcome }}
          GEOMETRY_OUTCOME: ${{ needs.smoke.outputs.geometry_outcome }}
          CORE_FAILURE: ${{ needs.smoke.outputs.core_failure }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-preview
          # What the host actually serves, read from the endpoint that answers it. The deploy
          # job's host-status.json lives in ITS artifact, not in this job's working directory -
          # the first version parsed a path this job never has, so served_sha was always empty
          # (measured on the first post-merge run: served_sha ""). /api/v1/version is the same
          # fact from the same host, needs no session, and is exactly what the deploy step and
          # staging-smoke.spec.ts already assert against.
          BASE_URL_FOR_PROBE="${DEPLOY_BASE_URL:-}"
          SERVED_SHA=""
          if [ -n "$BASE_URL_FOR_PROBE" ]; then
            SERVED_SHA="$(curl -fsS -m 15 "$BASE_URL_FOR_PROBE/api/v1/version" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commitSha") or "")' 2>/dev/null || true)"
          fi
          {
            printf 'SERVED_SHA=%s\n' "$SERVED_SHA"
            # The deploy step's own outcome is the health fact this job can see: it polls
            # /livez, /readyz and / until the release answers, and exits 0 only then.
            printf 'DEPLOY_STEP_OUTCOME=%s\n' "${DEPLOY_STEP_OUTCOME:-}"
          } > artifacts/staging-preview/deploy-facts.env
          cat artifacts/staging-preview/deploy-facts.env
          set -a; . artifacts/staging-preview/deploy-facts.env; set +a
          python3 - <<'PY'
          import json, os

          TIER = os.environ.get("TIER", "") or "unknown"
          TIER_REASON = os.environ.get("TIER_REASON", "") or ""
          MODE = os.environ.get("SMOKE_MODE", "") or "unknown"
          # The seed step's reported outcome: "success", "failure", or empty when the job never reached it.
          VISUAL_SEED_OUTCOME = os.environ.get("VISUAL_SEED_OUTCOME", "") or ""
          VISUAL_JOB_RESULT = os.environ.get("VISUAL_RESULT", "") or ""

          # The demo-plugin seed is a prerequisite of visual.spec.ts, not a suite, so it is recorded on
          # its own and on every path. A green suite only says the plugin was there; it says nothing
          # about who put it there, and run 40854403102 is the case in point - the seed failed, the
          # suite was 5/5 green against the hand-installed plugin, and the record said nothing.
          #
          # An empty outcome means the step was never evaluated. Two ways: the job never ran (tier, run
          # mode, cancellation - recorded as not-run, with steps_not_run carrying the reason) or the job
          # ran and died before the step (a real gap in the seed, so it counts as failed).
          VISUAL_JOB_RAN = VISUAL_JOB_RESULT not in ("", "skipped", "cancelled")
          if VISUAL_SEED_OUTCOME == "success":
              SEED_STATUS, SEED_SHORT = "passed", "success"
          elif VISUAL_SEED_OUTCOME == "failure":
              SEED_STATUS, SEED_SHORT = "failed", "failure"
          elif VISUAL_JOB_RAN:
              SEED_STATUS, SEED_SHORT = "failed", "step-not-reached"
          else:
              SEED_STATUS, SEED_SHORT = "not-run", "job-not-run"

          SEEDS = [{
              "name": "demo-plugin",
              "job": "seeded_visual",
              "step": "hello",
              "installs": "dev.opsweave.hello@0.0.1 (the /ext/trusted-team/hello extension and the "
                          "instance log stream visual.spec.ts drives)",
              "outcome": VISUAL_SEED_OUTCOME or SEED_SHORT,
              "status": SEED_STATUS,
              "short_reason": SEED_SHORT,
              # The one question this record exists to answer: did this run produce the data, or did it
              # inherit it? Green on inherited data is not evidence the pipeline can produce a green.
              "produced_by_pipeline": SEED_STATUS == "passed",
          }]
          # Which specs this run can actually speak for: only the demo-plugin seed has a step here. The
          # pipeline seed has no step and no probe, so a red studio/visual-layout suite cannot be
          # attributed to it by this job - see suite_attribution in seed_reason.
          OBSERVED_SEEDS = {"visual.spec.ts": SEEDS[0]}

          # What each seeded-data spec file needs, and where this workflow does or does not create it. The
          # reason is composed from the files whose own suite actually failed, so it can never name a green
          # spec or send the next reader to the wrong suite - the fault of the fixed string this replaces,
          # which blamed studio and visual-layout for a missing seed on run 40818576895 where both were green
          # (8/8 and 4/4) and only visual.spec.ts was red.
          SEED_NEEDS = {
              "studio.spec.ts":
                  "the out-of-band pipeline seed - the literal id host-metrics-pipeline with a published "
                  "revision and a rendered node graph, plus a stack that can execute the job its own run "
                  "page submits (admin API seed plus a host-side demo source server, deployments/staging/"
                  "README.md 'DEMO source')",
              "visual-layout.spec.ts":
                  "the same out-of-band pipeline seed as studio.spec.ts - the literal id host-metrics-pipeline "
                  "with a published revision and a rendered node graph (it asserts canvas geometry, not a job)",
              "visual.spec.ts":
                  "an installed demo plugin and a live instance - it drives /ext/trusted-team/hello and an "
                  "instance log stream, which exist only once the demo plugin is installed and a node runs "
                  "it (the 'Seed the demo hello plugin' step in seeded_visual installs it)",
          }

          # Named for the gap it describes rather than for the two resources it once covered. The demo-plugin
          # half has a step now, so a reason claiming no step creates it would be false in the record - and so
          # would the sentence this replaces ("its outcome is reported above"), which was true only on the
          # runs where the suite was red, i.e. exactly the runs where the seed outcome was already visible.
          SEED_GAP = (
              "The demo-plugin half does have a step: seeded_visual runs it before its suite, and this record "
              "carries that step's own outcome in every run (the seeded-data check's 'seeds'). The pipeline "
              "half is still seeded out of band through the admin API plus a host-side demo source server "
              "(deployments/staging/README.md 'DEMO source'), and no step in this workflow creates or observes "
              "it, so this record cannot say whether it was missing. Known-flaky until that seeding step lands."
          )

          # Where each seeded job writes its Playwright trace (playwright test --output test-results/<dir>),
          # so a reason that declines to guess a cause can still send the reader to the step and locator.
          TRACE_DIR = {
              "studio.spec.ts": "tests/ui/test-results/seeded-studio/",
              "visual-layout.spec.ts": "tests/ui/test-results/seeded-vlayout/",
              "visual.spec.ts": "tests/ui/test-results/seeded-visual/",
          }

          CORE_FILES = ("staging-smoke.spec.ts", "dual-surface.spec.ts", "admin-shell.spec.ts")
          # The table audit writes geometry and the gate judges it; both belong to acceptance.
          METRICS_FILES = ("ui-table-audit.spec.ts",)
          SURFACES_FILES = (
              "admin-pages.spec.ts", "admin-polish.spec.ts", "plugin-surfaces.spec.ts",
              "plugin-detail-tabs.spec.ts", "business-workspace.spec.ts", "overview-partial.spec.ts",
              "async-stale.spec.ts", "i18n-locale.spec.ts", "dialog-a11y.spec.ts",
              "g08-batch-c.spec.ts", "g08-batch-c-mobile.spec.ts",
          )

          # (step id, group, the tier the step belongs to, spec files, reported outcome, job result).
          # A step inside the smoke job reports steps.<id>.outcome; a seeded suite is its own job, so its
          # outcome is that job's output and its result is the job's result - "skipped" when the tier left it
          # out, "failure" when the job died before the suite could run.
          STEPS = [
              ("core", "core", "core", CORE_FILES,
               os.environ.get("CORE_OUTCOME", ""), ""),
              ("metrics", "table-geometry", "core", METRICS_FILES,
               os.environ.get("METRICS_OUTCOME", ""), ""),
              ("geometry", "table-geometry", "core", METRICS_FILES,
               os.environ.get("GEOMETRY_OUTCOME", ""), ""),
              ("surfaces", "admin-plugin-i18n", "full", SURFACES_FILES,
               os.environ.get("SURFACES_OUTCOME", ""), ""),
              ("seeded_studio", "seeded-data", "full", ("studio.spec.ts",),
               os.environ.get("STUDIO_OUTCOME", ""), os.environ.get("STUDIO_RESULT", "")),
              ("seeded_visual_layout", "seeded-data", "full", ("visual-layout.spec.ts",),
               os.environ.get("VISUAL_LAYOUT_OUTCOME", ""), os.environ.get("VISUAL_LAYOUT_RESULT", "")),
              ("seeded_visual", "seeded-data", "full", ("visual.spec.ts",),
               os.environ.get("VISUAL_OUTCOME", ""), VISUAL_JOB_RESULT),
          ]

          # (group name, known_flaky). A known-flaky group still runs and is still reported; it is only
          # excluded from the gate.
          GROUPS = [("core", False), ("table-geometry", False),
                    ("admin-plugin-i18n", False), ("seeded-data", True)]


          def resolve_status(step_tier, reported, job_result):
              # The suite's own outcome, when it reported one.
              if reported in ("success", "failure"):
                  return ("passed" if reported == "success" else "failed"), reported
              # It never reported. Say exactly why, cheapest explanation first: the run mode, the tier, the
              # job's own fate, and only then "the job ran but never reached the suite".
              if MODE == "http":
                  return "skipped", "mode=http"
              if MODE != "playwright":
                  # No mode was chosen at all: the smoke job never ran (its deploy dependency did
                  # not succeed) or the run was cancelled, so this step was never evaluated.
                  return "skipped", "smoke-job-not-run"
              if step_tier == "full" and TIER == "core":
                  return "skipped", "tier=core"
              if job_result in ("skipped", "cancelled", ""):
                  return "skipped", (job_result or "not-run")
              return "failed", "job-%s" % job_result


          records = []
          for step_id, group, step_tier, files, reported, job_result in STEPS:
              status, short = resolve_status(step_tier, reported, job_result)
              records.append({
                  "step": step_id,
                  "group": group,
                  "spec_files": list(files),
                  "status": status,
                  "outcome": reported or (job_result or "not-run"),
                  "reported": reported in ("success", "failure"),
                  "short_reason": short,
              })


          def not_run_reason(record):
              short = record["short_reason"]
              if short == "tier=core":
                  return ("tier=core: %s. This step did not run in the core tier and nothing about it failed; "
                          "run workflow_dispatch with full_suite=true to execute it."
                          % (TIER_REASON or "only the core path runs on this trigger"))
              if short.startswith("mode="):
                  return ("%s: tests/ui/staging-smoke.spec.ts is absent, so this run took the inline HTTP "
                          "smoke path and no Playwright suite ran." % short)
              if short == "smoke-job-not-run":
                  return ("smoke-job-not-run: the smoke job did not run in this workflow run (its "
                          "dependency did not succeed, or the run was cancelled), so this step was "
                          "never evaluated. Nothing about it failed.")
              if short == "cancelled":
                  return ("cancelled: the run was cancelled before this step finished; nothing about it "
                          "failed.")
              return ("%s: the job that owns this step never reached it; read the job result of its "
                      "dependency." % short)


          def seed_reason(group_records):
              # The prefix states what this run actually observed, and nothing more. 'seed-or-data-missing'
              # is claimed only where a step in this run was supposed to create the data and reported that
              # it did not - that is evidence. Where nothing here observes the data, the record says so and
              # names the trace instead of asserting a cause: on run 40854403102 this string blamed a
              # missing pipeline seed for a locator.click timeout in studio.spec.ts:45, while the same
              # file's draft-conflict case (:130) drove the same editor and the same node and the pipeline
              # list case (:109) passed - the pipeline seed was demonstrably there.
              clauses = []
              labels = []
              for record in group_records:
                  # A skipped step was excluded by the tier or by the run mode; that is recorded in
                  # steps_not_run, and calling it a missing seed would be a wrong reason.
                  if record["status"] != "failed":
                      continue
                  for spec in record["spec_files"]:
                      if not record["reported"]:
                          labels.append("suite-did-not-run")
                          clauses.append("%s did not run: the job never reached the suite (job result: %s) - "
                                         "read the job log" % (spec, record["outcome"]))
                          continue
                      needs = SEED_NEEDS.get(spec)
                      if needs is None:
                          labels.append("suite-failed-with-unclear-cause")
                          clauses.append("%s failed (outcome: %s) with no recorded data dependency"
                                         % (spec, record["outcome"]))
                          continue
                      seed = OBSERVED_SEEDS.get(spec)
                      if seed is not None and seed["status"] == "failed":
                          # The step that installs this spec's data ran in this job and failed before the
                          # suite: this is the one case the seed attribution is entitled to assert.
                          labels.append("seed-or-data-missing")
                          clauses.append("%s failed (outcome: %s) and the step that installs its data "
                                         "reported '%s' in this run: it needs %s"
                                         % (spec, record["outcome"], seed["outcome"], needs))
                      elif seed is not None:
                          labels.append("suite-failed-with-unclear-cause")
                          clauses.append("%s failed (outcome: %s) although the step that installs its data "
                                         "reported success in this run, so the install/deploy/activate path "
                                         "completed here - the plugin's presence is not the open question (%s), "
                                         "so the cause is more likely the page, the instance or the suite than "
                                         "a missing seed: the trace under %s names the step and the locator"
                                         % (spec, record["outcome"], needs, TRACE_DIR.get(spec, "tests/ui/test-results/")))
                      else:
                          labels.append("suite-failed-with-unclear-cause")
                          clauses.append("%s failed (outcome: %s). No step in this workflow creates or "
                                         "observes %s, so this record cannot tell a missing seed from a page "
                                         "that never became ready: the trace under %s names the step and the "
                                         "locator that timed out"
                                         % (spec, record["outcome"], needs, TRACE_DIR.get(spec, "tests/ui/test-results/")))
              if not clauses:
                  return ""
              head = ", ".join(dict.fromkeys(labels))
              if "seed-or-data-missing" in labels:
                  return head + " - " + "; ".join(clauses) + ". " + SEED_GAP
              return head + " - " + "; ".join(clauses) + "."


          checks = []
          for group, known_flaky in GROUPS:
              group_records = [record for record in records if record["group"] == group]
              failures = [record for record in group_records if record["status"] == "failed"]
              if failures:
                  status = "failed"
              elif any(record["status"] == "passed" for record in group_records):
                  status = "passed"
              else:
                  status = "skipped"
              check = {
                  "name": group,
                  # detail keeps the step granularity: a step that runs several files cannot tell them apart,
                  # so it must not read as if every file in it were red.
                  "detail": "; ".join("%s: %s" % (record["outcome"], ", ".join(record["spec_files"]))
                                      for record in group_records),
                  "status": status,
                  "ok": status == "passed",
                  "known_flaky": known_flaky,
                  "steps": [record["step"] for record in group_records],
                  # Exact only where a step covers one file; a multi-file step is in detail instead.
                  "failed_files": [spec for record in failures if len(record["spec_files"]) == 1
                                   for spec in record["spec_files"]],
              }
              if group == "seeded-data":
                  # Carried on every path, not only when a suite is red: the run this record failed to
                  # describe was 5/5 green with a failed seed, and a field that appears only on failure
                  # is exactly how that stays invisible.
                  check["seeds"] = SEEDS
                  check["detail"] = "; ".join(part for part in (
                      check["detail"],
                      "; ".join("seed %s: %s" % (seed["name"], seed["status"]) for seed in SEEDS),
                  ) if part)
              if status == "skipped":
                  check["skip_reason"] = "; ".join("%s: %s" % (record["step"], record["short_reason"])
                                                   for record in group_records)
              if known_flaky and status == "failed":
                  reason = seed_reason(group_records)
                  if reason:
                      check["reason"] = reason
              checks.append(check)

          # The gate: a known-flaky group never gates, and a step the tier excluded is not a failure - it is
          # written into steps_not_run instead of being counted as green.
          ok = all(check["status"] != "failed" for check in checks if not check["known_flaky"])

          steps_not_run = [
              {"step": record["step"],
               "group": record["group"],
               "spec_files": record["spec_files"],
               "short_reason": record["short_reason"],
               "reason": not_run_reason(record)}
              for record in records if record["status"] == "skipped"
          ]

          # Every skip is announced in the run summary, not only in the downloaded artifact.
          for entry in steps_not_run:
              print("::notice::step %s did not run (%s): %s"
                    % (entry["step"], entry["short_reason"], entry["reason"]))
          for check in checks:
              if check.get("reason"):
                  print("::warning::known-flaky suite group '%s' - %s (outcome: %s)"
                        % (check["name"], check["reason"], check["detail"]))

          # The seed is announced on its own, independently of the suite it feeds. This is the line run
          # 40854403102 did not have: the seed failed, the suite was green, and nothing in the run said
          # that the green had been inherited from a plugin someone installed on the host by hand.
          for seed in SEEDS:
              if seed["status"] == "passed":
                  print("::notice::seed %s succeeded in this run: %s" % (seed["name"], seed["installs"]))
              elif seed["status"] == "failed":
                  print("::warning::the seed for %s did NOT succeed in this run (outcome: %s, step %s/%s). "
                        "%s was not installed by this workflow, so a green suite here is not evidence the "
                        "pipeline can produce it - the host already had it, and a rebuilt host would fail "
                        "that suite. Read the %s job log for the cause."
                        % ("visual.spec.ts", seed["outcome"], seed["job"], seed["step"],
                           seed["installs"], seed["job"]))
              else:
                  print("::notice::the seed for %s did not run (%s, step %s/%s): %s was not installed by "
                        "this run, and nothing here certifies it."
                        % ("visual.spec.ts", seed["short_reason"], seed["job"], seed["step"],
                           seed["installs"]))

          # The two questions this workflow answers are kept apart on purpose, because a green
          # answer to one has been read as a green answer to the other more than once:
          #
          #   DEPLOYED_ENVIRONMENT  is the commit we built the one the host serves, and is the host
          #                         healthy? A failure here is about the deployment or the host.
          #   CODE_ACCEPTANCE       do the browser suites pass against that deployment? A failure
          #                         here may be a product defect OR the path between this runner
          #                         and the host (measured: the same suite is 19/19 in 1.8 min from
          #                         a laptop against this host, and stalled twice for 180 s on the
          #                         runner at the same commit and image).
          #
          # `code_acceptance` is UNVERIFIED - never PASSED - when the suites could not reach the
          # host: a run that proved nothing must not be quoted as if it had.
          # The deployment question is answered from the DEPLOY job's own reported facts, not from
          # `checks`. `checks` only ever carries the three suite groups (core, admin-plugin-i18n,
          # seeded-data) - there has never been an "identity" or "health" entry - so filtering it
          # produced an EMPTY list on every run and the previous expression then fell through to
          # PASSED. Measured: a run whose deploy job failed and whose smoke job never started
          # reported deployment_environment=PASSED. That is the one case this field exists for.
          #
          # deploy_result is the job outcome; SERVED_SHA is what the host reports (collected above
          # from deploy-facts.env, itself parsed from host-status.json); DEPLOY_HEALTHY is the
          # deploy script's own health verdict, "" when it recorded none.
          DEPLOY_RESULT = os.environ.get("DEPLOY_RESULT", "") or ""
          SERVED_SHA = os.environ.get("SERVED_SHA", "") or ""
          EXPECTED_SHA = os.environ.get("EXPECTED_SHA", "") or ""
          # The deploy job's own result output: "success" once the release answered /livez,
          # /readyz and /, "failure" when the script rolled back.
          _step = (os.environ.get("DEPLOY_STEP_OUTCOME", "") or "").strip()
          DEPLOY_HEALTHY = True if _step == "success" else (False if _step == "failure" else None)
          deployment_facts = {
              "deploy_job": DEPLOY_RESULT or "not-run",
              "served_sha": SERVED_SHA,
              "expected_sha": EXPECTED_SHA,
              "deploy_healthy": DEPLOY_HEALTHY,
          }
          if DEPLOY_RESULT != "success":
              # The deploy job did not complete successfully: whatever the host serves, this run
              # did not put it there and did not verify it.
              deployment_verdict = "NOT_RUN" if DEPLOY_RESULT in ("", "skipped", "cancelled") else "FAILED"
          elif not SERVED_SHA or not EXPECTED_SHA:
              deployment_verdict = "UNVERIFIED"
          elif SERVED_SHA != EXPECTED_SHA:
              # The host answered, and it answered with a different commit: a definite failure.
              deployment_verdict = "FAILED"
          elif DEPLOY_HEALTHY is not True:
              # Served commit matches but the health verdict was not a recorded pass.
              deployment_verdict = "UNVERIFIED" if DEPLOY_HEALTHY is None else "FAILED"
          else:
              deployment_verdict = "PASSED"

          # Only the groups this tier was SUPPOSED to run can decide the verdict. A core-tier push
          # leaves `admin-plugin-i18n` and `seeded-data` as status "skipped" with ok=false - the
          # tier rule, not a failure - so requiring every check to be ok made code_acceptance
          # FAILED on every core run. Measured: core success -> FAILED before this line.
          #
          # A skipped group is not evidence either way: it neither passes nor fails the verdict.
          # At least one group must have actually run, or the answer is NOT_RUN.
          executed = [c for c in checks if c["status"] in ("passed", "failed")]
          # What a failure actually says, so "the assertion was wrong" and "the browser never got
          # to make the assertion" are not reported as the same thing. A Playwright timeout that
          # expires inside a navigation, a response wait, or the test budget itself is consistent
          # with the product never having been reached; an expectation that received a value is a
          # statement about the product. This is a classification of the recorded text, not a
          # re-run and not a retry: it changes which verdict a red produces, never whether it is
          # red.
          # The Playwright text comes from the step's own captured output, not from `checks`:
          # a check's detail is "failure: <files>" and matches no classifier at all (measured).
          core_failure = (os.environ.get("CORE_FAILURE", "") or "").lower()
          failure_text = " ".join(
              json.dumps(check).lower() for check in executed if check["status"] == "failed"
          ) + " " + core_failure
          # A Playwright call that ran out of time is, by itself, evidence that the value never
          # arrived - it is the same shape whether the cause is the link or the product. Stated as
          # a closed list of the calls that mean "waiting for something external": navigation,
          # response, url change, request. Everything else (`expect(received).toBe(...)` with a
          # received value) is a verdict about what the product answered.
          unreachable = any(
              marker in failure_text
              for marker in (
                  "waitforresponse", "page.goto", "navigating to", "test timeout",
                  "page.waitforurl", "waiting until", "page.waitforloadstate",
                  # A locator that never appeared is the element/response never arriving, not a
                  # contradicted value. FILLED/CLICK belong here for the same reason.
                  "waiting for locator", "waiting for selector", "page.fill", "page.click",
                  "econnreset", "enotfound", "net::err", "socket hang up",
              )
          )
          # A Playwright expectation that EXPIRED is not a contradicted expectation: the message
          # contains both `expect(` and `Timeout:`, and it means the value never arrived. Order
          # matters, and the first version got it backwards - it read `expect(...toHaveURL ...
          # Timeout: 10000ms` as a product failure, which is exactly the red this round is trying
          # to classify as UNVERIFIED.
          expectation_expired = any(
              marker in failure_text
              for marker in ("timeout:", "exceeded while waiting", "waiting for locator",
                             "waiting for getby")
          )
          assertion_failed = (
              ("expect(" in failure_text or "tohave" in failure_text)
              and not unreachable
              and not expectation_expired
          )
          if not executed:
              code_verdict = "NOT_RUN"
          elif assertion_failed:
              # The product answered and an expectation was contradicted. That is evidence about
              # the code, and it outranks the reachability heuristic: a run can contain both a
              # stall and a real failure, and the real failure is the one worth reporting.
              code_verdict = "FAILED"
          elif all(c["status"] == "passed" for c in executed):
              # A skipped known-flaky group does not veto a green run; a failed one cannot hide,
              # because known-flaky groups are still reported and this reads their status.
              code_verdict = "PASSED"
          elif unreachable or expectation_expired:
              # The wait expired and nothing was contradicted: the value never arrived. This is the
              # staging shape - a 20 s response wait or an expectation whose deadline passed - and
              # it must not read as a product failure.
              code_verdict = "UNVERIFIED"
          else:
              code_verdict = "FAILED"
          # A run whose primary suite did not execute has not accepted any code, whatever else
          # passed. This is the same "green because nothing ran" rule the workflow applies to the
          # tier: the table audit alone is not the core path, so a PASSED built from it would be a
          # claim about acceptance that the run did not make. (Found by simulating CORE_OUTCOME
          # empty with the audit green: it reported PASSED before this guard.)
          if MODE == "playwright" and code_verdict == "PASSED":
              core_check = next((c for c in checks if c["name"] == "core"), None)
              if core_check is None or core_check["status"] != "passed":
                  code_verdict = "UNVERIFIED"

          # Three layers, because they fail for different reasons and a red in one must never be
          # read as a verdict about another. The brief for this round requires the split:
          #
          #   deployment_environment  the host serves the commit this run built, and the deploy
          #                           job's own health polling succeeded.
          #   remote_browser          the browser suites that ran HERE, against that live host,
          #                           passed. This is the only layer that can be hurt by the
          #                           runner->host link.
          #   code_acceptance         the code under test is accepted. It is computed from the
          #                           same checks, but it is UNVERIFIED whenever remote_browser is
          #                           UNVERIFIED, because a suite that could not reach the product
          #                           has not accepted its code either.
          #
          # The deterministic layer (a runner-local kernel + database + browser) is NOT this
          # workflow; it is the g12-acceptance job, and it reports separately.
          # There is no browser layer at all in `http` mode: the inline HTTP smoke checks
          # reachability and the served SHA, nothing about the product's rendering. Reporting
          # PASSED here would be the "green because nothing ran" defect in a new place.
          remote_browser_verdict = "NOT_RUN" if MODE != "playwright" else code_verdict
          # `code_acceptance` can never be stronger than the remote-browser layer it is derived
          # from: a suite that could not reach the product has not accepted its code either.
          code_verdict = remote_browser_verdict if remote_browser_verdict in ("PASSED", "FAILED") else "UNVERIFIED"
          verdicts = {
              "deployment_environment": deployment_verdict,
              "remote_browser": remote_browser_verdict,
              "code_acceptance": code_verdict,
          }

          # Diagnostics, never verdict inputs. The smoke job exports compact JSON summaries; an
          # empty output means the job never produced one (not run, or the step never reached), and
          # that is recorded as unavailable rather than as a silent absence.
          def optional_json_env(name):
              raw = (os.environ.get(name, "") or "").strip()
              if not raw:
                  return {"available": False, "reason": "no-output",
                          "detail": "the smoke job produced no %s output (job not run, or the step "
                                    "never reached)" % name.lower()}
              try:
                  value = json.loads(raw)
              except ValueError:
                  return {"available": False, "reason": "unparseable-output",
                          "raw_head": raw[:300]}
              if not isinstance(value, dict):
                  return {"available": False, "reason": "not-an-object"}
              value.setdefault("available", True)
              return value


          runner_network = optional_json_env("RUNNER_NETWORK")
          playwright_timings = optional_json_env("PLAYWRIGHT_TIMINGS")
          if runner_network.get("available") and runner_network.get("overall") != "ok":
              failed_paths = [probe.get("path") for probe in (runner_network.get("paths") or [])
                              if isinstance(probe, dict) and probe.get("failures")]
              print("::warning::runner-side network was %s in this run (health.json runner_network): %s"
                    % (runner_network.get("overall") or "unknown",
                       ", ".join(str(path) for path in failed_paths) or "see paths"))

          payload = {
              "mode": MODE,
              "tier": TIER,
              "tier_reason": TIER_REASON,
              "base_url": os.environ.get("OPSWEAVE_URL", ""),
              "verdicts": verdicts,
              # The meaning of `ok`, stated where the value is, so nobody has to infer it from
              # this workflow's source. `ok` answers one question: did every non-known-flaky
              # check that RAN avoid failing. It does NOT mean "release accepted" - read
              # `verdicts` for that, and `steps_not_run` for what the tier left out.
              "verdict_definition": {
                  "ok": ("true when every non-known-flaky check that ran has status != failed. "
                         "It says nothing about steps the tier skipped, and it is not a release "
                         "decision."),
                  "verdicts.deployment_environment": ("PASSED only when the deploy job succeeded, "
                                                      "the served commit equals the built commit, "
                                                      "and the deploy script's health polling "
                                                      "passed; UNVERIFIED when any of those facts "
                                                      "could not be read; FAILED otherwise."),
                  "verdicts.remote_browser": ("the browser suites executed here against the live "
                                              "host. UNVERIFIED when a group that should have "
                                              "run did not, or when the run recorded a "
                                              "timeout/reset that is consistent with not reaching "
                                              "the product."),
                  "verdicts.code_acceptance": ("the code under test is accepted. A definite "
                                               "assertion failure is FAILED; a suite that could "
                                               "not reach the product leaves this UNVERIFIED "
                                               "rather than pretending either way."),
                  "not_covered_here": ("deterministic acceptance (runner-local kernel, database "
                                       "and browser, no external link) is the g12-acceptance "
                                       "workflow; this one never certifies code on its own."),
              },
              "deployment_facts": deployment_facts,
              # Diagnostics only, and deliberately outside `checks`: no verdict expression above
              # reads them. They exist so the next failure is attributable from inside this job
              # instead of by elimination against a machine that is not the runner.
              "runner_network": runner_network,
              "playwright_timings": playwright_timings,
              "ok": ok,
              "checks": checks,
              "seeds": SEEDS,
              "steps_not_run": steps_not_run,
              "known_flaky_reasons": [check["reason"] for check in checks if check.get("reason")],
              "suite_groups": [
                  {"name": check["name"],
                   "known_flaky": check["known_flaky"],
                   "status": check["status"],
                   "files": [spec for record in records if record["group"] == check["name"]
                             for spec in record["spec_files"]],
                   "steps": [{"files": record["spec_files"], "outcome": record["outcome"]}
                             for record in records if record["group"] == check["name"]]}
                  for check in checks
              ],
              "exit_code": 0 if ok else 1,
          }
          with open("artifacts/staging-preview/health.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload the acceptance record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-health
          path: artifacts/staging-preview/
          if-no-files-found: warn

  report:
    name: report to pull request
    needs: [build, deploy, smoke, record]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always()
    environment:
      name: staging
      url: ${{ vars.OPSWEAVE_PREVIEW_URL || 'http://82.156.234.84:3000' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      packages: read
    steps:
      - name: Download evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: staging-*
          path: artifacts
          merge-multiple: true

      - name: Compose the single preview comment
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          SMOKE_MODE: ${{ needs.smoke.outputs.mode }}
          TARGET_SHA: ${{ needs.build.outputs.sha || inputs.sha || github.sha }}
          PREVIOUS_SHA: ${{ needs.deploy.outputs.previous_sha }}
          PREVIEW_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import json, os

          MARKER = "<!-- opsweave-staging-preview -->"

          def load(path):
              try:
                  with open(path, encoding="utf-8") as handle:
                      return json.load(handle)
              except Exception:
                  return None

          def cell(value):
              known = {"success": "success", "failure": "failure", "cancelled": "cancelled", "skipped": "skipped"}
              return known.get(value or "", value or "unknown")

          def check_label(item):
              # A step the tier excluded is "skipped", never "ok" and never "FAIL": scoring it green is
              # the "green because nothing ran" failure this record exists to prevent.
              if item.get("status") == "skipped":
                  return "skipped"
              return "ok" if item.get("ok") else "FAIL"

          def not_run_summary(payload):
              steps = payload.get("steps_not_run") or []
              if not steps:
                  return "none"
              return "; ".join("%s (%s)" % (step.get("step"), step.get("short_reason") or "not-run")
                              for step in steps)

          host = load("artifacts/host-status.json") or {}
          # health.json is written by the record job on every path; the inline HTTP fallback keeps its
          # own file so the two can never overwrite each other once the artifacts are merged.
          health = load("artifacts/health.json") or load("artifacts/http-smoke.json") or {}
          last = host.get("last_deploy") or {}
          served = host.get("served_commit") or {}

          rollback = "no"
          if last.get("rolled_back"):
              rollback = "yes, returned to %s" % (last.get("rollback_target") or "<unknown>")

          detail = "unknown"
          if isinstance(health.get("health"), dict):
              probe = health["health"]
              detail = "livez=%s readyz=%s root=%s" % (probe.get("livez"), probe.get("readyz"), probe.get("root"))
          elif isinstance(health.get("checks"), list):
              detail = ", ".join("%s=%s" % (item.get("name"), check_label(item)) for item in health["checks"])
          elif isinstance(health.get("ok"), bool):
              detail = "ok" if health["ok"] else "FAIL"
          elif health.get("exit_code") is not None:
              detail = "playwright exit %s" % health["exit_code"]

          # The seeded-data prerequisites, read back from the record instead of from a job output: this
          # job does not need seeded_visual, and a seed that failed while its suite was green must still
          # appear here. That combination - the one run 40854403102 was - is what this row exists for.
          def seeds(health):
              found = [item for item in (health.get("seeds") or []) if isinstance(item, dict)]
              if found:
                  return found
              return [seed for item in (health.get("checks") or []) if isinstance(item, dict)
                      for seed in (item.get("seeds") or []) if isinstance(seed, dict)]

          def suite_outcome(health, spec):
              for group in health.get("suite_groups") or []:
                  for step in group.get("steps") or []:
                      if spec in (step.get("files") or []):
                          return step.get("outcome") or "not-run"
              return "not-run"

          def seed_cell(found):
              if not found:
                  return "not recorded (no seeded-data suites in this run)"
              cells = []
              for seed in found:
                  status = seed.get("status") or "unknown"
                  outcome = seed.get("outcome") or "not-run"
                  if status == "passed":
                      cells.append("%s: ok (installed by this run)" % seed.get("name"))
                  elif status == "failed":
                      cells.append("%s: FAILED (outcome %s) - NOT installed by this run"
                                   % (seed.get("name"), outcome))
                  else:
                      cells.append("%s: not run (%s)" % (seed.get("name"), outcome))
              return "; ".join(cells)

          def seed_notes(health, found):
              # One line per seed that did not succeed. Saying it in the table is not enough: the table
              # is scanned, and the point of the sentence is that a green suite may be inherited.
              notes = []
              for seed in found:
                  status = seed.get("status") or "unknown"
                  outcome = seed.get("outcome") or "not-run"
                  installs = seed.get("installs") or "the data its suite needs"
                  if status == "passed":
                      continue
                  if status != "failed":
                      notes.append("The %s seed did not run in this run (%s), so nothing here certifies that "
                                   "%s exists." % (seed.get("name"), outcome, installs))
                      continue
                  visual = suite_outcome(health, "visual.spec.ts")
                  if visual == "success":
                      tail = ("visual.spec.ts passed anyway, which means it drove a plugin that was already "
                              "on the host: this green was not produced by the pipeline, and a rebuilt host "
                              "would not have it.")
                  elif visual == "failure":
                      tail = ("visual.spec.ts is red in this run, and the plugin it needs was never "
                              "installed by it.")
                  else:
                      tail = ("visual.spec.ts did not run in this tier, so nothing about it was certified "
                              "either way.")
                  notes.append("**The %s seed did not succeed** (outcome: %s), so %s was not installed by "
                               "this run. %s" % (seed.get("name"), outcome, installs, tail))
              return notes

          found_seeds = seeds(health)

          rows = [
              ("Preview", os.environ.get("PREVIEW_URL") or "<unset>"),
              ("Commit", "`%s`" % (os.environ.get("TARGET_SHA") or "<unknown>")),
              ("Build", cell(os.environ.get("BUILD_RESULT"))),
              ("Deploy", cell(os.environ.get("DEPLOY_RESULT"))),
              ("Health (CI)", cell(os.environ.get("SMOKE_RESULT"))),
              ("Health detail", detail),
              ("Suite tier", "%s - %s" % (health.get("tier") or "unrecorded", health.get("tier_reason") or "no tier recorded")),
              ("Not run this run", not_run_summary(health)),
              ("Seeded data (this run)", seed_cell(found_seeds)),
              ("Smoke mode", os.environ.get("SMOKE_MODE") or "unknown"),
              ("Previous successful deploy", os.environ.get("PREVIOUS_SHA") or "none recorded"),
              ("Rollback", rollback),
              ("Served commit", "%s (%s)" % (served.get("sha") or "unknown", served.get("state") or "unknown")),
          ]

          lines = [MARKER, "## OpsWeave staging preview", "", "| Field | Value |", "|---|---|"]
          for name, value in rows:
              lines.append("| %s | %s |" % (name, str(value).replace("|", "\\|")))
          lines.append("")
          for note in seed_notes(health, found_seeds):
              lines.append(note)
              lines.append("")
          lines.append("Kernel health endpoints: /livez and /readyz. This comment is updated in place on every run and is never duplicated.")
          body = "\n".join(lines) + "\n"

          with open("artifacts/comment.md", "w", encoding="utf-8") as handle:
              handle.write(body)
          with open("artifacts/comment.json", "w", encoding="utf-8") as handle:
              json.dump({"body": body}, handle)
          print(body)
          PY

      - name: Update or create the single PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ needs.build.outputs.sha || inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          pr=""
          if [ -n "${TARGET_SHA:-}" ]; then
            pr="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/commits/$TARGET_SHA/pulls?per_page=20" --jq '[.[] | select(.state=="open")][0].number // empty' 2>/dev/null || true)"
            if [ -z "$pr" ]; then
              pr="$(gh api "repos/$REPO/commits/$TARGET_SHA/pulls?per_page=1" --jq '.[0].number // empty' 2>/dev/null || true)"
            fi
          fi
          if [ -z "$pr" ]; then
            echo "no pull request is associated with ${TARGET_SHA:-this commit}; nothing to comment on"
            exit 0
          fi
          existing="$(gh api --paginate "repos/$REPO/issues/$pr/comments?per_page=100" --jq '.[] | select(.body | contains("<!-- opsweave-staging-preview -->")) | .id' 2>/dev/null | head -n1 || true)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input artifacts/comment.json >/dev/null
            echo "updated the existing staging preview comment (id $existing) on PR #$pr"
          else
            gh api -X POST "repos/$REPO/issues/$pr/comments" --input artifacts/comment.json >/dev/null
            echo "created the staging preview comment on PR #$pr"
          fi
