name: reliability
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'tests/reliability/**'
      - '.github/workflows/reliability.yml'
    # Mirrors the paths `tests/ci/impact.mjs` says require `quality-faults`. The push
    # side used to be unfiltered, on the argument that a path filter would decide
    # "this change cannot break it" using a table the gate distrusts. Measurement
    # refuted that: the docs-only commit 6824796 needed ZERO suites per the
    # analyzer and still started all seven workflows - 74 machine-minutes,
    # reliability.yml of them this one.
    #
    # The argument's real content is "the two tables must not disagree", and the
    # answer to that is to derive one from the other, not to delete one. These
    # entries are generated from impact.mjs, and
    # tests/ci/check-impact-consistency.mjs fails the required spec-coverage job
    # when they drift.
    #
    # `ci.yml` stays unfiltered on push: it carries HARD_REQUIRED (rust, web,
    # contracts, spec-coverage), which is what catches a docs commit that broke
    # the build.

# Supersede the previous run for the same ref - but keep protected runs (a
# `workflow_dispatch`, a `schedule`) in a group of their own.
#
# THE DEFECT THIS FIXES, twice over.
#
# The previous version was `group: ${{ github.workflow }}-${{ github.ref }}` with
# `cancel-in-progress: ${{ event_name == 'pull_request' || event_name == 'push' }}`.
# Two things were wrong with it:
#
#   1. `cancel-in-progress` is evaluated by the INCOMING run, against the group it
#      is joining. A push whose expression is `true` therefore cancels whatever is
#      RUNNING in that group - including a `workflow_dispatch` somebody started by
#      hand. The expression never mentions dispatch; the shared GROUP is what put
#      them in each other's way.
#
#   2. Even at `cancel-in-progress: false`, GitHub's default `queue: single`
#      displaces an already-PENDING run: "any existing pending job or workflow run
#      in the same concurrency group is canceled" and the newcomer takes its slot.
#      So two manual runs queued behind a push lose one of them, flag or no flag.
#
# Both dissolve when the group differs by event class. A protected run gets a
# group keyed on its own `run_id`, so no automatic run can ever share a group
# with it; an automatic run gets the ref, so a newer push still supersedes an
# older one on the same branch and never touches another branch.
#
# `queue: max` would be the other way to protect a pending manual run, but it is
# not available here: actionlint's schema (1.7.7 in this repository's CI) rejects
# `queue:` as an unknown key, so it cannot be linted, let alone relied on.
#
# `tests/ci/check-concurrency-supersede.mjs` evaluates these two expressions
# against an arrival matrix and simulates the cancellation rules - it does not
# match substrings, because a substring match is what passed the broken version.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && format('protected-{0}', github.run_id) || format('auto-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  quality-faults:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install catalog backend dependencies
        working-directory: plugins/data-catalog/backend
        run: npm ci --omit=dev --no-audit --no-fund
      # `tests/acceptance/b2_response_bounds.sh` asserts two things about the
      # shipped code: that no call site buffers a response before bounding it,
      # and that the shared reader's own suite passes (including the real-socket
      # chunked-forever case). It needs no platform - only a workspace and a
      # toolchain - and no workflow ran it until here.
      #
      # It used to be in `check-spec-coverage`'s KNOWN_UNRUN list with the note
      # "candidate for ci.yml". Wiring it is the better answer than keeping the
      # note.
      - name: Response bodies are bounded while read, not after buffering
        run: |
          set -eu
          cargo build --locked -p opsweave-kernel >/dev/null
          bash tests/acceptance/b2_response_bounds.sh

      - name: Run isolated quality fault harness
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          FT_DATABASE_PREFIX: postgres://postgres:postgres@localhost
        run: ./tests/reliability/run.sh --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-evidence
          path: artifacts/reliability/
