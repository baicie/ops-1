name: reliability
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-faults:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install catalog backend dependencies
        working-directory: plugins/data-catalog/backend
        run: npm ci --omit=dev --no-audit --no-fund
      # `tests/acceptance/b2_response_bounds.sh` asserts two things about the
      # shipped code: that no call site buffers a response before bounding it,
      # and that the shared reader's own suite passes (including the real-socket
      # chunked-forever case). It needs no platform - only a workspace and a
      # toolchain - and no workflow ran it until here.
      #
      # It used to be in `check-spec-coverage`'s KNOWN_UNRUN list with the note
      # "candidate for ci.yml". Wiring it is the better answer than keeping the
      # note.
      - name: Response bodies are bounded while read, not after buffering
        run: |
          set -eu
          cargo build --locked -p opsweave-kernel >/dev/null
          bash tests/acceptance/b2_response_bounds.sh

      - name: Run isolated quality fault harness
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          FT_DATABASE_PREFIX: postgres://postgres:postgres@localhost
        run: ./tests/reliability/run.sh --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-evidence
          path: artifacts/reliability/
