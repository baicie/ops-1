name: data-foundation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/kernel/**'
      - 'apps/node/**'
      - 'contracts/**'
      - 'plugins/data-catalog/**'
      - 'plugins/data-integration/**'
      - 'scripts/**'
      - 'tests/ci/**'
      - 'tests/acceptance/data_foundation.sh'
      - '.github/workflows/data-foundation.yml' 

permissions:
  contents: read
jobs:
  golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opsweave/ui-tests exec playwright install --with-deps chromium
      - run: RUN_BROWSER_SMOKE=1 tests/ci/data_foundation_ci.sh
