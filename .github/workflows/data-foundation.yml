name: data-foundation
on:
  workflow_dispatch:
  # `push` as well as `pull_request`, with no path filter.
  #
  # Every other suite workflow in this repository triggers on both. This one did
  # not, and the gap only became visible once `ci-gate` started reading the
  # check-run API: on the merge commit for #120 (61b73f0) the gate demanded
  # `data-foundation` and there was no check to find, because a push does not
  # fire a `pull_request` trigger. The gate was right to fail - it had been told
  # the suite was required and could not verify it - but the missing half was
  # here.
  #
  # No `paths:` on the push side, deliberately. The point of running on main is
  # to know whether main is green, and a path filter on a merge commit would
  # silently decide "this change cannot break it" using the same table the gate
  # distrusts. It is the post-merge answer, and there is exactly one of them per
  # merge.
  push:
    branches: [main]
    paths:
      - 'apps/kernel/**'
      - 'apps/node/**'
      - 'apps/pipeline-worker/**'
      - 'contracts/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'tests/acceptance/**'
      - 'tests/ci/**'
      - 'tests/runtime/**'
      - 'tests/ui/**'
      - '.github/workflows/data-foundation.yml'
    # Mirrors the paths `tests/ci/impact.mjs` says require `data-foundation`. The push
    # side used to be unfiltered, on the argument that a path filter would decide
    # "this change cannot break it" using a table the gate distrusts. Measurement
    # refuted that: the docs-only commit 6824796 needed ZERO suites per the
    # analyzer and still started all seven workflows - 74 machine-minutes,
    # data-foundation.yml of them this one.
    #
    # The argument's real content is "the two tables must not disagree", and the
    # answer to that is to derive one from the other, not to delete one. These
    # entries are generated from impact.mjs, and
    # tests/ci/check-impact-consistency.mjs fails the required spec-coverage job
    # when they drift.
    #
    # `ci.yml` stays unfiltered on push: it carries HARD_REQUIRED (rust, web,
    # contracts, spec-coverage), which is what catches a docs commit that broke
    # the build.
  pull_request:
    paths:
      - 'apps/kernel/**'
      - 'apps/node/**'
      # The 42-step harness drives the pipeline worker directly (claim-next,
      # leases, fencing, sink effects). A change to the worker or to the runtime
      # helpers it is exercised through belongs here, not only in
      # typed-pipeline-runtime.
      - 'apps/pipeline-worker/**'
      - 'contracts/**'
      # Every plugin, not just the data ones: the harness installs and activates
      # plugins, and `plugins/**` used to reach it only through
      # typed-pipeline-runtime's second invocation of the same script.
      - 'plugins/**'
      - 'tests/ui/**'
      - 'scripts/**'
      - 'tests/ci/**'
      - 'tests/acceptance/**'
      - 'tests/runtime/**'
      - '.github/workflows/data-foundation.yml' 

permissions:
  contents: read
# Supersede the previous run for the SAME ref, but only when a newer one was
# triggered the same automatic way.
#
# `cancel-in-progress` unconditionally would be wrong here, and the existing
# `staging-preview.yml` shows why: it keeps three separate buckets so a push can
# never cancel a nightly certification. The same reasoning applies to every
# suite in this file - a `workflow_dispatch` is a person asking for THIS run, and
# a `schedule` is a run whose whole purpose is to exist at a fixed time. Neither
# is "superseded" by the next push, so neither is cancelled by one.
#
# What IS superseded: a push to main followed by another push to main, or a new
# commit on a pull request branch. The older run is now testing a tree nobody
# will merge, and on 2026-11-20 six merges in one minute queued four identical
# `ci.yml` runs that each spent a full suite-worth of billed minutes on commits
# already superseded.
#
# `cancel-in-progress` takes an expression here rather than `true`: GitHub
# evaluates it per run, and for a `workflow_dispatch` or `schedule` event this
# is `false`, so those runs are never cancelled out from under themselves.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  golden-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # See .github/workflows/ci.yml for why `shared-key` is set: without it the
      # key includes the job id and every job writes a cache nobody reads.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: data-foundation
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm --filter @opsweave/ui-tests exec playwright install --with-deps chromium
      # A GitHub-hosted runner is dedicated to this job, so the container sweep
      # is scoped to this run's installation ids and leftovers from a retried
      # attempt are allowed. On a shared daemon the script refuses instead.
      - run: RUN_BROWSER_SMOKE=1 OPSWEAVE_CI_ALLOW_SHARED_DAEMON=1 tests/ci/data_foundation_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-foundation-screenshots
          path: |
            artifacts/ui/data-foundation/*.png
            artifacts/ui/studio/*.png
          if-no-files-found: warn
      # The heartbeat acceptance's evidence. It records every poll that decided
      # the verdict, so a red job can be explained from the artifact instead of
      # guessed at - and a green one can be read to confirm the heartbeat really
      # landed during execution rather than being inferred from timing.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-heartbeat-evidence
          path: |
            /tmp/long-heartbeat-evidence.log
            /tmp/long-heartbeat-negatives.log
            /tmp/long-heartbeat-counterfactuals.log
            /tmp/long-heartbeat.log
            # One per job the negatives start. On run 43598745794 five cases
            # reported "the job did not reach RUNNING (got QUEUED)" and the
            # worker's own explanation was in these files, which were not kept.
            /tmp/neg-*.log
          if-no-files-found: warn
  legacy-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # See .github/workflows/ci.yml for why `shared-key` is set: without it the
      # key includes the job id and every job writes a cache nobody reads.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: data-foundation
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: sudo apt-get update && sudo apt-get install -y maven
      - run: pnpm install --frozen-lockfile
      - run: |
          docker run -d --name opsweave-legacy-registry -p 5002:5000 registry:2
          cargo build -q -p opsweave-kernel -p opsweave-node -p opsweave-opsctl
          mkdir -p keys
          ./target/debug/opsctl keygen --out-dir keys >/dev/null
          make web
          OPSWEAVE_REGISTRY=localhost:5002 scripts/build-plugins.sh
      - name: 0.0.1 E2E
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          OPSWEAVE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/opsweave
          OPSWEAVE_SKIP_REGISTRY: '1'
        run: |
          # `SKIP_BUILD=1` because this job built the binaries at line 118 and the
          # web bundles on the next line. `BUILD=0` never covered those - it only
          # skipped the plugin bundles - so without this the whole thing was built
          # twice inside one job.
          RESET=1 BUILD=0 SKIP_BUILD=1 scripts/demo_up.sh
          tests/acceptance/e2e_platform.sh
