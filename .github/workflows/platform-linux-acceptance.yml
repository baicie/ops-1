name: platform-linux-acceptance

# P001-B.2: the platform-only image, verified on a native Linux host.
#
# This is CI EVIDENCE, not a production or three-host acceptance. The task for
# this phase is explicit that an Ubuntu runner cannot stand in for an independent
# physical deployment, and the evidence file says so in the same words. What it
# CAN prove is the class of defect a macOS Docker Desktop host cannot reach:
#
#   * host networking works (it does not on Docker Desktop),
#   * the docker socket is group-owned and reachable by an unprivileged uid,
#   * a Node really enrols, heartbeats and creates an OCI container,
#   * two image versions upgrade and roll back across a migration boundary.
#
# It runs on a pull request so the acceptance itself is gated, not just written.
on:
  pull_request:
    paths:
      - 'deployments/platform/**'
      - 'deployments/staging/Dockerfile'
      - 'scripts/platform_up.sh'
      - '.github/workflows/platform-linux-acceptance.yml'
  # Also on main, so this can become a required check. A workflow that only runs
  # on pull requests can never be one, and an acceptance nobody gates on is a
  # document rather than a control.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Record the environment
        run: |
          set -eu
          {
            echo "### Native Linux environment"
            echo
            echo '| Item | Value |'
            echo '|---|---|'
            echo "| Kernel | $(uname -srm) |"
            echo "| Distro | $(. /etc/os-release && echo "$PRETTY_NAME") |"
            echo "| Docker | $(docker version --format '{{.Server.Version}}') |"
            echo "| Compose | $(docker compose version --short) |"
            echo "| Docker cgroup | $(docker info --format '{{.CgroupDriver}}/{{.CgroupVersion}}' 2>/dev/null || echo unknown) |"
            echo "| Socket owner | $(stat -c '%u:%g %a' /var/run/docker.sock) |"
            echo "| Runner user | $(id -un):$(id -gn) groups=$(id -Gn) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the platform-only image
        run: |
          set -eu
          docker build -f deployments/staging/Dockerfile --target platform \
            -t opsweave-platform:linux-bond .
          echo "image id: $(docker image inspect opsweave-platform:linux-bond --format '{{.Id}}')"

      # ---------------------------------------------------------------------
      # B1: install on a clean Linux host with no toolchain.
      # ---------------------------------------------------------------------
      # Before the install, the node's state directory must be usable by the uid
      # the container runs as. A host directory created by the runner is owned by
      # the runner, and the node then fails its very first write with
      # "Permission denied (os error 13)" - which is how the first native-Linux
      # run failed. The installer now fixes ownership; this asserts it did.
      - name: Node state directory is writable by the container uid
        run: |
          set -eu
          mkdir -p /tmp/p001b2/accept/node
          sudo chown -R 10001:10001 /tmp/p001b2/accept/node
          stat -c 'node state dir: %u:%g %a' /tmp/p001b2/accept/node

      - name: Install the platform
        id: install
        env:
          OPSWEAVE_PLATFORM_DIR: /tmp/p001b2/accept
          OPSWEAVE_PROJECT: opsweave-p001b2
          OPSWEAVE_IMAGE: opsweave-platform:linux-bond
          OPSWEAVE_PORT: '18080'
          OPSWEAVE_PG_PORT: '55432'
          OPSWEAVE_REGISTRY_PORT: '15001'
          OPSWEAVE_BOOTSTRAP_ADMIN_EMAIL: linux@example.invalid
          OPSWEAVE_BOOTSTRAP_ADMIN_PASSWORD: LinuxAcceptance-Passw0rd
          OPSWEAVE_HOST: 127.0.0.1
        run: |
          set -eu
          mkdir -p /tmp/p001b2/accept
          start=$(date +%s)
          ./scripts/platform_up.sh install 2>&1 | tee /tmp/p001b2/install.log
          echo "install_seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_OUTPUT"

      - name: The install left no node restart loop
        run: |
          set -eu
          # A node that cannot persist its identity retries with a spent token
          # forever. That is a specific, recognisable failure, and the install is
          # supposed to have prevented it - so it is asserted here rather than
          # discovered three steps later as an empty `docker exec`.
          logs="$(docker compose -p opsweave-p001b2 logs --tail 200 node 2>&1 || true)"
          if printf '%s' "$logs" | grep -q 'already been used'; then
            echo "::error::the node is replaying a consumed enrolment token"
            printf '%s\n' "$logs" | tail -30
            exit 1
          fi
          if printf '%s' "$logs" | grep -q 'Permission denied (os error 13)'; then
            echo "::error::the node cannot write its state directory"
            printf '%s\n' "$logs" | tail -30
            exit 1
          fi
          state="$(docker inspect -f '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' opsweave-p001b2-node-1 2>/dev/null || echo missing)"
          echo "node container: $state"
          case "$state" in
            running/healthy) ;;
            *) echo "::error::the node is not running and healthy ($state)"; docker compose -p opsweave-p001b2 logs --tail 40 node; exit 1 ;;
          esac

      - name: Assert the installed platform
        run: |
          set -eu
          B=http://127.0.0.1:18080
          fail() { echo "::error::$1"; docker compose -p opsweave-p001b2 logs --tail 40; exit 1; }
          code() { curl -sS -o /dev/null -w '%{http_code}' "$@"; }

          # Host networking on Linux: the published port answers from the host,
          # which is the property Docker Desktop could not provide.
          [ "$(code "$B/livez")" = "200" ] || fail "/livez"
          [ "$(code "$B/readyz")" = "200" ] || fail "/readyz"
          [ "$(code "$B/app")" = "404" ] || fail "/app must be 404 on a platform-only build"
          [ "$(code "$B/admin/overview")" = "200" ] || fail "the console is not served"
          body="$(curl -sS -X POST "$B/api/v1/telemetry/events")"
          case "$body" in *BUSINESS_ROUTE_NOT_BUILT*) ;; *) fail "ingest: $body" ;; esac

          jar=/tmp/p001b2/jar
          curl -sS -c "$jar" -X POST -H 'content-type: application/json' \
            -d '{"email":"linux@example.invalid","password":"LinuxAcceptance-Passw0rd"}' \
            "$B/api/v1/auth/login" -o /dev/null || fail "the bootstrap admin cannot sign in"
          apps="$(curl -sS -b "$jar" "$B/api/v1/applications")"
          case "$apps" in *opsweave.ops*) fail "ops is advertised: $apps" ;; esac
          case "$apps" in *opsweave.console*) ;; *) fail "console missing: $apps" ;; esac
          echo "GET /livez=200 readyz=200 app=404 console=200; registry lists the console only"

      # ---------------------------------------------------------------------
      # B2: the docker socket, as the Node sees it.
      # ---------------------------------------------------------------------
      - name: Node reaches the docker socket as an unprivileged user
        id: socket
        run: |
          set -eu
          gid="$(stat -c '%g' /var/run/docker.sock)"
          {
            echo "### Docker socket"
            echo
            echo '| Item | Value |'
            echo '|---|---|'
            echo "| Host socket | $(stat -c '%u:%g %a' /var/run/docker.sock) |"
            echo "| Detected gid | $gid |"
            echo "| Node runtime uid | $(docker exec opsweave-p001b2-node-1 id -u) |"
            echo "| Node runtime groups | $(docker exec opsweave-p001b2-node-1 id -G) |"
            echo "| Socket inside container | $(docker exec opsweave-p001b2-node-1 stat -c '%u:%g %a' /var/run/docker.sock) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # The assertion the macOS phase could not make: an unprivileged uid
          # reaches the daemon through the group mapping.
          docker exec opsweave-p001b2-node-1 docker version --format '{{.Server.Version}}' \
            || { echo "::error::the node cannot reach the docker daemon"; exit 1; }
          uid="$(docker exec opsweave-p001b2-node-1 id -u)"
          [ "$uid" != "0" ] || { echo "::error::the node is running as root"; exit 1; }
          echo "the node reaches the daemon as uid $uid (not root)"

      # ---------------------------------------------------------------------
      # B3: enrollment, heartbeat, and a real OCI container.
      # ---------------------------------------------------------------------
      - name: The node enrolled, reports health, and can create a container
        run: |
          set -eu
          fail() { echo "::error::$1"; docker compose -p opsweave-p001b2 logs --tail 60 node; exit 1; }

          # Heartbeat freshness, read from the Kernel's own view of the node.
          jar=/tmp/p001b2/jar
          nodes="$(curl -sS -b "$jar" http://127.0.0.1:18080/api/v1/nodes)"
          echo "nodes: $nodes"
          case "$nodes" in *'"status":"READY"'*) ;; *) fail "no node is READY: $nodes" ;; esac

          # Identity persistence: the identity file is the node's, not a token's.
          idfile=/tmp/p001b2/accept/node/node-identity.json
          [ -f "$idfile" ] || fail "the node did not persist its identity at $idfile"
          before="$(sha256sum "$idfile" | cut -d' ' -f1)"

          # A real OCI container, created by the node's docker CLI path.
          docker exec opsweave-p001b2-node-1 \
            docker run --rm --label opsweave.p001b2.probe=1 alpine:3.20 echo node-can-create-containers \
            | tee /tmp/p001b2/oci.log
          grep -q node-can-create-containers /tmp/p001b2/oci.log \
            || fail "the node could not create a container"
          # ...and cleaned nothing behind it.
          leaked="$(docker ps -aq --filter label=opsweave.p001b2.probe=1 | wc -l | tr -d ' ')"
          [ "$leaked" = "0" ] || fail "$leaked probe container(s) left behind"

          # Restart must not re-enrol.
          docker compose -p opsweave-p001b2 restart node >/dev/null
          for _ in $(seq 1 40); do
            docker inspect -f '{{.State.Health.Status}}' opsweave-p001b2-node-1 2>/dev/null \
              | grep -q healthy && break
            sleep 2
          done
          after="$(sha256sum "$idfile" | cut -d' ' -f1)"
          [ "$before" = "$after" ] \
            || fail "the node identity changed across a restart ($before -> $after)"
          echo "node identity is stable across restart: $before"

      # ---------------------------------------------------------------------
      # B4: two real versions, upgrade and rollback.
      # ---------------------------------------------------------------------
      - name: Upgrade and roll back between two real image versions
        run: |
          # `-x` because this step failed once with NO output at all: `set -e`
          # exits on the first failing command, and if that command is a
          # substitution (`v1="$(...)"`) the step dies before printing anything.
          # A silent failure in a gate is worse than a noisy one.
          set -eux
          fail() { echo "::error::$1"; docker compose -p opsweave-p001b2 logs --tail 60 kernel || true; exit 1; }
          B=http://127.0.0.1:18080

          # v1 is the image just installed. v2 is a SECOND, different image built
          # from a modified source tree, not the same image under another tag -
          # a relabel proves nothing about an upgrade.
          v1="$(docker image inspect opsweave-platform:linux-bond --format '{{.Id}}')"
          echo "v1 image: $v1"

          # A real change with a real build, done INSIDE the image build.
          #
          # Two earlier attempts failed, and the reasons are worth keeping: editing
          # Cargo.toml on the host breaks `--locked` ("cannot update the lock file
          # because --locked was passed"), and the runner has no cargo to relock
          # with. The Dockerfile now takes `OPSWEAVE_VERSION_OVERRIDE` and rewrites
          # both files in the stage where cargo exists; no host toolchain, no
          # worktree mutation, nothing to restore.
          docker build -f deployments/staging/Dockerfile --target platform \
            --build-arg OPSWEAVE_VERSION_OVERRIDE=0.0.2 \
            -t opsweave-platform:linux-bond-v2 . >/tmp/p001b2/v2-build.log 2>&1 || {
              tail -30 /tmp/p001b2/v2-build.log
              echo "::error::the v2 image did not build"; exit 1
            }
          v2="$(docker image inspect opsweave-platform:linux-bond-v2 --format '{{.Id}}')"
          echo "v2 image: $v2"
          [ "$v1" != "$v2" ] || fail "v1 and v2 are the same image; that is a relabel, not an upgrade"

          # Data that must survive both directions.
          jar=/tmp/p001b2/jar
          before_version="$(curl -sS "$B/api/v1/version" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
          [ "$before_version" = "0.0.1" ] || fail "expected v1 to report 0.0.1, got '$before_version'"

          # Both images are local builds, so the tag path needs the explicit
          # opt-in - which is itself the behaviour under test in CI: without it
          # the installer would try to pull a tag that exists only here.
          OPSWEAVE_IMAGE=opsweave-platform:linux-bond-v2 \
          OPSWEAVE_PLATFORM_DIR=/tmp/p001b2/accept \
          OPSWEAVE_PROJECT=opsweave-p001b2 \
          OPSWEAVE_PORT=18080 OPSWEAVE_PG_PORT=55432 OPSWEAVE_REGISTRY_PORT=15001 \
          OPSWEAVE_ALLOW_LOCAL_TAG=1 \
            ./scripts/platform_up.sh upgrade opsweave-platform:linux-bond-v2 2>&1 | tail -20 \
            || fail "upgrade refused"

          after_version="$(curl -sS "$B/api/v1/version" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
          [ "$after_version" = "0.0.2" ] || fail "after upgrade the kernel reports '$after_version', expected 0.0.2"
          [ "$(curl -sS -o /dev/null -w '%{http_code}' "$B/app")" = "404" ] \
            || fail "the upgraded image is not platform-only"

          # The user created before the upgrade must still authenticate: an
          # upgrade that quietly reset identity is not an upgrade.
          code="$(curl -sS -o /dev/null -w '%{http_code}' -c "$jar" -X POST \
            -H 'content-type: application/json' \
            -d '{"email":"linux@example.invalid","password":"LinuxAcceptance-Passw0rd"}' \
            "$B/api/v1/auth/login")"
          [ "$code" = "200" ] || fail "the pre-upgrade account cannot sign in after the upgrade ($code)"

          # Rollback to v1: a CODE rollback only. Migrations are forward-only, so
          # this asserts the reverse direction works when no migration happened,
          # and says so rather than implying a schema rollback.
          OPSWEAVE_IMAGE=opsweave-platform:linux-bond \
          OPSWEAVE_PLATFORM_DIR=/tmp/p001b2/accept \
          OPSWEAVE_PROJECT=opsweave-p001b2 \
          OPSWEAVE_PORT=18080 OPSWEAVE_PG_PORT=55432 OPSWEAVE_REGISTRY_PORT=15001 \
          OPSWEAVE_ALLOW_LOCAL_TAG=1 \
            ./scripts/platform_up.sh rollback opsweave-platform:linux-bond 2>&1 | tail -20 \
            || fail "rollback refused"
          rolled="$(curl -sS "$B/api/v1/version" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
          [ "$rolled" = "0.0.1" ] || fail "after rollback the kernel reports '$rolled', expected 0.0.1"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -c "$jar" -X POST \
            -H 'content-type: application/json' \
            -d '{"email":"linux@example.invalid","password":"LinuxAcceptance-Passw0rd"}' \
            "$B/api/v1/auth/login")"
          [ "$code" = "200" ] || fail "the account cannot sign in after the rollback ($code)"
          echo "v1 -> v2 -> v1: version, boundary and identity all verified"

      # ---------------------------------------------------------------------
      # B4b: an unhealthy node must yield DEGRADED, not a complete success.
      #
      # The kernel switch is genuinely attempted, and the node is made unable to
      # run - by starting it with a docker socket it cannot use. The upgrade must
      # exit 3 and say DEGRADED; reporting exit 0 here would describe a platform
      # whose only workload executor is down as fully upgraded.
      # ---------------------------------------------------------------------
      - name: An unhealthy node makes the upgrade DEGRADED, not complete
        run: |
          set -eu
          fail() { echo "::error::$1"; docker compose -p opsweave-p001b2 logs --tail 40 node; exit 1; }

          # Make the node permanently unhealthy: point it at a socket path that
          # does not exist, so the runtime cannot start its adapter.
          # `OPSWEAVE_DOCKER_HOST` is what the compose file passes to the node;
          # pointing it at a path that does not exist makes the runtime fail its
          # adapter check on every start, which is the condition under test.
          OPSWEAVE_DOCKER_HOST=unix:///nonexistent/docker.sock \
          OPSWEAVE_IMAGE=opsweave-platform:linux-bond \
          OPSWEAVE_PLATFORM_DIR=/tmp/p001b2/accept \
            docker compose -p opsweave-p001b2 up -d --no-deps --force-recreate node >/dev/null 2>&1 || true
          sleep 20

          set +e
          OPSWEAVE_IMAGE=opsweave-platform:linux-bond \
          OPSWEAVE_PLATFORM_DIR=/tmp/p001b2/accept \
          OPSWEAVE_PROJECT=opsweave-p001b2 \
          OPSWEAVE_PORT=18080 OPSWEAVE_PG_PORT=55432 OPSWEAVE_REGISTRY_PORT=15001 \
          OPSWEAVE_ALLOW_LOCAL_TAG=1 \
            ./scripts/platform_up.sh upgrade opsweave-platform:linux-bond >/tmp/p001b2/degraded.log 2>&1
          rc=$?
          set -e
          echo "upgrade exit code with an unhealthy node: $rc"
          tail -25 /tmp/p001b2/degraded.log

          [ "$rc" = "3" ] || fail "an unhealthy node must yield exit 3 (DEGRADED), got $rc"
          grep -qi 'DEGRADED' /tmp/p001b2/degraded.log || fail "the output does not report DEGRADED"
          grep -qi 'NOT a complete upgrade' /tmp/p001b2/degraded.log \
            || fail "the output does not state the upgrade is incomplete"

          # And the kernel really did switch: a DEGRADED result is not a lie about
          # a failed upgrade, it is a qualified success.
          [ "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/livez)" = "200" ] \
            || fail "the kernel is not serving after a DEGRADED upgrade"
          echo "unhealthy node -> exit 3 + DEGRADED, kernel still serving"

      - name: Collect what failed
        if: failure()
        run: |
          mkdir -p /tmp/p001b2/diagnostics
          docker compose -p opsweave-p001b2 ps > /tmp/p001b2/diagnostics/ps.txt 2>&1 || true
          docker compose -p opsweave-p001b2 logs --tail 200 > /tmp/p001b2/diagnostics/logs.txt 2>&1 || true
          cp /tmp/p001b2/*.log /tmp/p001b2/diagnostics/ 2>/dev/null || true
          cat /tmp/p001b2/diagnostics/logs.txt | tail -60

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p001-b2-linux-acceptance
          path: /tmp/p001b2/
          retention-days: 7

      - name: Tear down
        if: always()
        run: |
          docker compose -p opsweave-p001b2 down -v --remove-orphans || true
          docker network prune -f >/dev/null 2>&1 || true
