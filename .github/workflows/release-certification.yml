name: release-certification

# Certify ONE commit, by tag or by explicit dispatch, in a run that no push can
# take away. TASK-08.
#
# WHY THIS EXISTS, and it is not "run the tests again".
#
# Every suite in this repository is triggered by `push` and `pull_request`, and
# every one of them uses `concurrency` with `cancel-in-progress` on those events -
# deliberately, because six merges in one minute should not run six copies of
# `data-foundation`. The cost of that choice, stated plainly in
# `docs/ci/concurrency-isolation.md`: for all but the last commit of a rapid
# series, the CI result is `cancelled`. A cancelled check is not a pass, and there
# is nothing in a later run's green that says anything about an earlier commit.
#
# So "every commit on main is verified" is FALSE today, and no amount of reading
# `main`'s latest green run makes it true. This workflow is the alternative: pick
# a commit explicitly, certify THAT commit, and keep the evidence.
#
# WHAT MAKES IT UNSURPERSEDABLE
#
# The group contains `github.run_id`, so every certification is its own group. No
# push can cancel it, no pending run can displace it, and a repeated certification
# of one SHA queues rather than replacing the earlier one - which is what you want
# from an evidence-producing run: two certifications of one SHA are two records,
# not one record and a gap.
#
# `check-concurrency-supersede.mjs` asserts exactly this shape for every workflow,
# so the guarantee is enforced rather than intended.
#
# WHAT THIS DOES NOT DO
#
# No promotion, no tag creation, no deployment. It produces a receipt
# (`scripts/release-receipt.mjs`) and uploads it. Deciding to release is a separate
# action with its own authority - see ADR-029.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA to certify (must be on main)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  # Per certification, never shared. See the header.
  group: release-certification-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve the commit to certify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          INPUT_SHA: ${{ inputs.sha }}
          TAG_REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        # THE DECISION IS A SCRIPT, NOT A SHELL BLOCK.
        #
        # Five branches - tag vs dispatch, 40-hex, a real commit, an ancestor of
        # main, and the ref the receipt will claim - with no test, because "the
        # workflow exists" was taken as "the chain is verified". That is the
        # assumption this repository has already recorded as wrong.
        #
        # `scripts/ci/resolve-certification-target.mjs` is the same decision with 11
        # cases. It also refuses a UPPERCASE sha: git accepts one, and
        # `release-receipt.mjs` validates `^[0-9a-f]{40}$` - so the old block could
        # resolve a target whose own receipt would then fail verification.
        run: |
          set -euo pipefail
          # NOT `OUT="$(...)"`. A command substitution in an assignment does not
          # trip `set -e`: measured, the resolver exited 1 on a malformed sha and the
          # step still finished with rc=0, certifying whatever the next step could
          # find. Capture to a file and check the code explicitly.
          if ! node scripts/ci/resolve-certification-target.mjs \
              --event "$EVENT" --tag-ref "$TAG_REF" --sha "$INPUT_SHA" > /tmp/target.txt; then
            cat /tmp/target.txt >&2 || true
            echo "::error::the certification target could not be resolved; see the refusal above"
            exit 1
          fi
          OUT="$(cat /tmp/target.txt)"
          printf '%s\n' "$OUT"
          sha="$(printf '%s\n' "$OUT" | sed -n 's/^sha=//p')"
          ref="$(printf '%s\n' "$OUT" | sed -n 's/^ref=//p')"
          # An empty field here is the same class as an unchecked exit code: the
          # resolver succeeded, but something between it and this line did not carry
          # the value through. Both outputs are load-bearing - `sha` is what every
          # later step certifies and `ref` is what the receipt will claim.
          [ -n "$sha" ] || { echo "::error::the resolver succeeded but produced no sha"; exit 1; }
          [ -n "$ref" ] || { echo "::error::the resolver succeeded but produced no ref"; exit 1; }
          echo "certifying $sha (ref $ref)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  certify:
    name: certify ${{ needs.resolve.outputs.sha }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Wait for the suites this commit produced
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # A certification does NOT re-run the suites. It reads what they
          # produced on this exact commit, and refuses if they have not finished
          # or did not run at all - re-running them under a different run id would
          # produce evidence that is about a different process than the one the
          # merge gate used.
          #
          # THE LEDGER COMES FROM A SCRIPT, NOT FROM A `--jq` FILTER.
          #
          # The filter this replaced was
          #
          #   [... ] | unique_by(.name)
          #
          # `unique_by` keeps the LAST occurrence in ARRAY ORDER, and GitHub does
          # not promise an order. Measured on four inputs:
          #
          #   old success, NEW failure      -> rust=success   <- red reported green
          #   new failure FIRST             -> rust=failure   <- same data, other order
          #   old success, NEW in_progress  -> rust=success   <- certifying mid-rerun
          #   old in_progress, NEW success  -> rust=in_progress
          #
          # It also dropped `check_suite.id`, the only field that says which
          # workflow produced a check. `scripts/ci/release-check-ledger.mjs` reads
          # both endpoints, joins them, and asks the same `checkState` the merge
          # gate uses - so certification and gating cannot disagree about which
          # attempt is the answer.
          #
          # An unreadable API exits 2 and is NOT "no checks": the old
          # `2>/dev/null || echo ""` made a transport failure look like a commit
          # with nothing to certify.
          node scripts/ci/release-check-ledger.mjs \
            --repo "$REPO" --sha "$SHA" --budget-seconds "${CERTIFY_WAIT_SECONDS:-2400}"

      - name: Write the receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve.outputs.sha }}
          REF: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          # The run id recorded in the receipt is the LATEST ci.yml run for this
          # commit, which is the run whose `ci-gate` verdict the merge gate would
          # have consulted. Recording this certification run instead would make
          # the receipt cite a run that decided nothing.
          RUN="$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=50" \
            --jq '[.workflow_runs[] | select(.path | endswith("/ci.yml"))] | .[0].id' 2>/dev/null || echo "")"
          if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
            echo "::error::no ci.yml run exists for $SHA; there is nothing to certify"
            exit 1
          fi
          node scripts/release-receipt.mjs write \
            --repo "$REPO" --run "$RUN" --sha "$SHA" --ref "$REF" \
            --image-digest "${IMAGE_DIGEST:-}" \
            --out "release-receipt-${SHA}.json"

      - name: Upload the receipt
        uses: actions/upload-artifact@v4
        with:
          name: release-receipt-${{ needs.resolve.outputs.sha }}
          path: release-receipt-*.json
          retention-days: 90
          if-no-files-found: error
