name: plugin-lifecycle

# P001-C1.3: the TypeScript plugin's whole lifecycle, in one isolated run, on
# every pull request that can change it.
#
# This workflow exists because the lifecycle acceptance had no gate. Until now
# `tests/acceptance/e2e_platform.sh` ran only inside `data-foundation.yml`'s
# `legacy-regression` job, whose `pull_request` trigger is path-filtered to a
# list that does NOT include the script itself - so a change to the acceptance
# script ran no acceptance. C0 recorded the same gap for `run_conformance.py`
# ("never run in CI"). This job runs the lifecycle as its own thing, with the
# evidence it produces kept as an artifact.
#
# It is NOT a required check and is deliberately not proposed as one yet: the
# rule this repository already follows (and C0's plan says explicitly) is that a
# check becomes required only after it has been stable on main for a while. The
# first runs are the evidence for that decision, not the decision itself.
#
# Fails closed. A missing Docker daemon, a missing PostgreSQL, or a missing
# registry is a red job, never a skip: `tests/ci/p001c13_lifecycle.sh` refuses to
# start (BLOCKED) rather than degrading to a mock, and `OPSWEAVE_REQUIRE_TEST_DOCKER`
# makes the Rust-side suites do the same.
#
# Why there is a `push` trigger and why it is unfiltered
# -----------------------------------------------------
# The first version had only `pull_request`, and the push of this very branch
# produced run 43394795219: conclusion=failure, **jobCount=0**. That is not a
# config error and not Docker/Postgres/apt - it is GitHub's representation of "a
# push matched no workflow", and it looked exactly like a red acceptance run in
# the checks list. A workflow that can report a failure without starting a job
# teaches reviewers to ignore its red.
#
# `push` is deliberately NOT path-filtered. On `main` this is the record that the
# lifecycle passed on the commit that was merged; filtering it would let a merge
# that changed, say, a shared crate be recorded as having no acceptance at all.
# It is not a PR gate on `main`, so the cost is one run per merge.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Mirrors the paths `tests/ci/impact.mjs` says require `plugin-lifecycle`. The
    # push side used to be unfiltered, on the argument that a path filter would
    # decide "this change cannot break it" using a table the gate distrusts.
    # Measurement refuted that: the docs-only commit 6824796 needed ZERO suites per
    # the analyzer and still started all seven workflows - 74 machine-minutes,
    # 17.3 of them this one.
    #
    # The argument's real content is "the two tables must not disagree", and the
    # answer to that is to derive one from the other, not to delete one. These
    # entries are generated from impact.mjs, and
    # tests/ci/check-impact-consistency.mjs fails the required spec-coverage job
    # when they drift.
    #
    # `ci.yml` stays unfiltered on push: it carries HARD_REQUIRED (rust, web,
    # contracts, spec-coverage), which is what catches a docs commit that broke
    # the build.
    paths:
      - 'apps/kernel/src/capabilities.rs'
      - 'apps/node/**'
      - 'apps/opsctl/**'
      - 'plugins/**'
      - 'scripts/assemble_plugin.py'
      - 'scripts/build-plugins.sh'
      - 'scripts/demo_common.sh'
      - 'scripts/demo_up.sh'
      - 'tests/ci/p001c13_*.sh'
      - 'tests/ci/p001c_multilang_lifecycle.sh'
      - '.github/workflows/plugin-lifecycle.yml'
  pull_request:
    paths:
      - 'apps/kernel/**'
      - 'apps/node/**'
      - 'apps/opsctl/**'
      - 'crates/**'
      - 'contracts/**'
      - 'plugins/**'
      # Every script the driver executes, plus every input those scripts read.
      # A path filter that misses one of these is how a change to the acceptance
      # code ships without the acceptance running - the exact gap this workflow
      # exists to close, so the list is derived from what the scripts actually
      # call rather than from what seemed relevant:
      #   scripts/build-plugins.sh      builds and pushes the three images
      #   scripts/assemble_plugin.py   writes each bundle's manifest
      #   scripts/demo_up.sh           not used by this job, but shares the
      #                                e2e_platform.sh contract
      #   tests/ci/p001c_up.sh         the isolated platform driver
      #   tests/ci/p001c_teardown.sh   the scoped teardown
      - 'scripts/build-plugins.sh'
      - 'scripts/assemble_plugin.py'
      - 'scripts/demo_up.sh'
      - 'scripts/demo_common.sh'
      - 'plugins/**'
      - 'tests/acceptance/e2e_platform.sh'
      - 'tests/ci/p001c13_*.sh'
      - 'tests/ci/p001c_up.sh'
      - 'tests/ci/p001c_teardown.sh'
      # The multilang matrix and everything it drives. Without these lines a
      # change to the matrix would run no matrix - which is the exact gap this
      # job was created to close for the TypeScript lifecycle.
      - 'tests/ci/p001c_multilang_lifecycle.sh'
      - 'tests/ci/p001c13_negatives.sh'
      - 'tests/ci/p001c121_demo_safety.sh'
      - '.github/workflows/plugin-lifecycle.yml'

permissions:
  contents: read

# Supersede the previous run for the same ref - but keep protected runs (a
# `workflow_dispatch`, a `schedule`) in a group of their own.
#
# THE DEFECT THIS FIXES, twice over.
#
# The previous version was `group: ${{ github.workflow }}-${{ github.ref }}` with
# `cancel-in-progress: ${{ event_name == 'pull_request' || event_name == 'push' }}`.
# Two things were wrong with it:
#
#   1. `cancel-in-progress` is evaluated by the INCOMING run, against the group it
#      is joining. A push whose expression is `true` therefore cancels whatever is
#      RUNNING in that group - including a `workflow_dispatch` somebody started by
#      hand. The expression never mentions dispatch; the shared GROUP is what put
#      them in each other's way.
#
#   2. Even at `cancel-in-progress: false`, GitHub's default `queue: single`
#      displaces an already-PENDING run: "any existing pending job or workflow run
#      in the same concurrency group is canceled" and the newcomer takes its slot.
#      So two manual runs queued behind a push lose one of them, flag or no flag.
#
# Both dissolve when the group differs by event class. A protected run gets a
# group keyed on its own `run_id`, so no automatic run can ever share a group
# with it; an automatic run gets the ref, so a newer push still supersedes an
# older one on the same branch and never touches another branch.
#
# `queue: max` would be the other way to protect a pending manual run, but it is
# not available here: actionlint's schema (1.7.7 in this repository's CI) rejects
# `queue:` as an unknown key, so it cannot be linted, let alone relied on.
#
# `tests/ci/check-concurrency-supersede.mjs` evaluates these two expressions
# against an arrival matrix and simulates the cancellation rules - it does not
# match substrings, because a substring match is what passed the broken version.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && format('protected-{0}', github.run_id) || format('auto-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  lifecycle:
    name: full TypeScript lifecycle
    runs-on: ubuntu-24.04
    # Measured locally at ~7 min for the lifecycle plus ~2 min to build the
    # bundles and images. 45 minutes leaves room for a slow runner without
    # letting a hang hold the queue.
    timeout-minutes: 45
    env:
      # The runner is dedicated to this job, so it is safe to run the container
      # cleanup. On a developer's machine the same script refuses unless this is
      # set - that check is what stops it removing a colleague's containers.
      OPSWEAVE_CI_ALLOW_SHARED_DAEMON: "1"
      # A dedicated port per workflow keeps this job from colliding with
      # data-foundation's 5002 registry when both run on one host.
      OPSWEAVE_TEST_REGISTRY_PORT: "5015"
      # `NO_PROXY` alone. A YAML mapping treats keys case-insensitively for
      # duplicate detection, so declaring both `no_proxy` and `NO_PROXY` is a
      # parse error: "job.env.NO_PROXY is already defined". GitHub rejected the
      # whole workflow on it - every push produced conclusion=failure with
      # jobCount=0 - and the workflow was listed by its file path instead of its
      # name, which is the tell that it never parsed. The lowercase form is set
      # by the scripts themselves where they need it.
      NO_PROXY: "127.0.0.1,localhost,::1"
      # The lifecycle below is the TypeScript one; the Go and Java LIFECYCLES are
      # P001-C3's deliverable and are not claimed here. Their TOOLCHAINS are still
      # required, because scripts/build-plugins.sh builds all three bundles and
      # the lifecycle stages all three (the Java plugin is what the disable
      # assertion uses). The distinction matters: this job proves the TS
      # lifecycle and that Go/Java serve Runtime v1, not their lifecycles.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
      # See .github/workflows/ci.yml for why `shared-key` is set: without it the
      # key includes the job id and every job writes a cache nobody reads.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: plugin-lifecycle

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      # `scripts/build-plugins.sh` builds all three reference plugins, so this job
      # needs the Go and Java toolchains even though the lifecycle it drives is the
      # TypeScript one. Without them the Java plugin fails to compile with
      # "release version 21 not supported" and the run BLOCKS at bundle build -
      # correctly, but it never reaches the lifecycle. Measured on run 43405082632.
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client tools
        # `pg_isready`, `createdb` and `dropdb` are what the harness uses; the
        # service container only provides the server.
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # A missing Docker daemon must fail the job, not skip it. This step is the
      # gate: every step below assumes a daemon, and `p001c13_lifecycle.sh`
      # BLOCKS rather than degrading - so a broken runner cannot report a green
      # lifecycle that never ran.
      - name: Require a working Docker daemon
        run: |
          set -eu
          docker version
          docker info >/dev/null
          echo "docker daemon: $(docker version --format '{{.Server.Version}}')"

      - name: Build the binaries the acceptance drives
        run: |
          set -eu
          cargo build --locked -p opsweave-kernel -p opsweave-node -p opsweave-opsctl
          pnpm --fail-if-no-match --filter @opsweave/platform-console build
          pnpm --fail-if-no-match --filter @opsweave/ops-web build

      # `scripts/build-plugins.sh` signs every bundle with `keys/publisher.key`,
      # and the file does not exist in a fresh checkout - it is generated. Without
      # it the bundle step dies with `io error: No such file or directory`, which
      # says nothing about a missing key. `demo_up.sh` generates it lazily for the
      # demo; a CI job has to do it explicitly, as data-foundation already does.
      - name: Generate the publisher signing key
        run: |
          set -eu
          ./target/debug/opsctl keygen --out-dir keys
          test -f keys/publisher.key
          test -f keys/publisher.pub

      - name: Prepare PostgreSQL for the harness
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -eu
          # The harness creates its own database per run id with `createdb`,
          # which needs a server that accepts local connections.
          pg_isready -h 127.0.0.1 -U postgres

      - name: Full TypeScript plugin lifecycle
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          # One run, one isolated platform, one verdict. The script starts an
          # isolated kernel/nodes/database/registry, runs the lifecycle end to
          # end, checks container ownership, and tears down. Its exit code is the
          # acceptance result and cleanup cannot overwrite it.
          tests/ci/p001c13_lifecycle.sh 2>&1 | tee lifecycle.log

      - name: The suite can fail - injected negatives
        # Runs AFTER the happy path, and only if it passed: a negative suite on a
        # platform the lifecycle already broke would report "the product refused"
        # for a reason unrelated to the injection.
        if: success()
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          tests/ci/p001c13_negatives.sh 2>&1 | tee lifecycle-negatives.log

      - name: Go and Java get the same lifecycle (P001-C3)
        # Runs LAST, and only after the TypeScript lifecycle passed: the matrix
        # builds its own platform and its own 0.0.1/0.0.2 image pairs, so an
        # earlier failure means the resources it needs are not trustworthy.
        #
        # This is the gate P001-C3 was missing. The matrix existed and nothing
        # executed it, which `tests/ci/check-spec-coverage.mjs` would report as
        # NOT_REFERENCED - a test nothing runs is a comment.
        if: success()
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          OPSWEAVE_TEST_REGISTRY_PORT: "5016"
        run: |
          set -o pipefail
          tests/ci/p001c_multilang_lifecycle.sh 2>&1 | tee lifecycle-multilang.log

      # ---------------------------------------------------------------------
      # THE BUILD INPUT THE PHASE 7 SUITES NEED, WHICH THIS JOB NEVER PRODUCED.
      #
      # Measured on five consecutive runs (45172963410, 45183654404,
      # 45190236157, 45197291594, 45203998931), every one of them SUCCESS:
      #
      #     skip no local images to push; TASK-01..06 need a built bundle
      #     0 passed, 0 failed, 1 skipped
      #     skip the data-catalog:0.0.3 image is not local
      #     0 passed, 0 failed, 1 skipped
      #
      # `scripts/build-plugins.sh` - which the previous step runs - builds
      # hello-ops, hello-go and hello-java. The data plugins come from
      # `scripts/build-data-plugins.sh`, whose only CI caller is
      # `data-foundation.yml`. So the two Phase 7 suites ran against neither the
      # images nor the bundle they assert on, and reported success for it.
      #
      # This step is that missing input. It is deliberately a separate step so a
      # failure here reads as "the fixtures did not build", not "the platform
      # mishandled a deploy".
      #
      # `OPSWEAVE_P7_REGISTRY_PORT` and the suites' default both stay 15001,
      # because the image reference is baked into the SIGNED bundle manifest: the
      # digest the suite verifies against the registry is the digest the bundle
      # names, and a different port would make the two disagree by construction.
      - name: Build the data-plugin images and bundles the Phase 7 suites assert on
        run: |
          set -euo pipefail
          docker rm -f osw-p7-registry >/dev/null 2>&1 || true
          docker run -d --name osw-p7-registry --label opsweave.p7.registry=yes \
            -p 127.0.0.1:15001:5000 registry:2 >/dev/null
          for _ in $(seq 1 30); do
            curl -fsS -m 2 http://127.0.0.1:15001/v2/ >/dev/null 2>&1 && break
            sleep 1
          done
          OPSWEAVE_REGISTRY=127.0.0.1:15001 OPSWEAVE_DATA_VERSION=0.0.3 \
            scripts/build-data-plugins.sh
          # The suites refuse to run without them (exit 3), so proving them here
          # turns a downstream BLOCKED into a clear, early failure.
          test -f dist/plugins/data-catalog-0.0.3.plugin.zip
          test -f dist/plugins/data-integration-0.0.3.plugin.zip

          # A SECOND VERSION OF THE SAME PLUGIN, because TASK-06 cannot test a
          # rollback without one.
          #
          # `phase7_publish_failures.sh` TASK-06 says: activate 0.0.4, then roll
          # back to 0.0.3. It guards on `dist/plugins/data-catalog-0.0.4.plugin.zip`
          # existing and SKIPS when it does not - and NOTHING in this repository
          # produced it, so the cancellation case has never run anywhere. The
          # rollback it measured was to the version already active, which is a
          # no-op, which is exactly the gap the Phase 7 report recorded.
          #
          # Built from the same template at a different version and a different
          # image digest, so the two deployments are genuinely different: the
          # rollback has a real transition to perform and a real container to
          # replace. It is not a copy of 0.0.3 with a new label.
          # THE DIGESTS MUST BE THE REAL ONES, NOT PLACEHOLDERS.
          #
          # A zero digest here builds and pushes an image that the node then
          # REFUSES at runtime:
          #
          #   Runtime Info does not match signed manifest: plugin=...0.0.4
          #   capability=sha256:000...000
          #
          # because the plugin reports the digest baked into the image and the
          # manifest carries the same zero value - so they match each other and
          # not the capability set the plugin actually provides. The deployment
          # ends DEGRADED, 0/1 ready, 1 failed, and TASK-06 skips again.
          #
          # `scripts/build-data-plugins.sh` computes both the same way; this
          # repeats it rather than sourcing the script, because the script builds
          # 0.0.1 by default and running it twice would overwrite the 0.0.3
          # bundles the suites just verified.
          CAP_DIGEST="$(python3 -c 'import hashlib,json;m=json.load(open("plugins/data-catalog/manifest.template.json"));raw=json.dumps(m["provides"],sort_keys=True,separators=(",",":")).encode();print("sha256:"+hashlib.sha256(raw).hexdigest())')"
          BUILD_DIGEST="sha256:$(cat plugins/data-catalog/backend/server.mjs \
            plugins/data-catalog/backend/identity.mjs \
            plugins/data-catalog/backend/quality.mjs 2>/dev/null \
            | shasum -a 256 | awk '{print $1}')"
          # `|| true` IS REQUIRED, AND ITS ABSENCE IS WHAT FAILED TWO CI RUNS.
          #
          # The step runs under `set -euo pipefail`. `docker inspect` on an image
          # that is not local exits 1; inside `$( ... )` under `set -e` that
          # aborts the whole step - before the `[ -n "$BASE_IMAGE" ]` fallback
          # could ever run. Measured on run 45335754806: the entire block printed
          # NOTHING after `build-data-plugins.sh` finished, and the step exited 1
          # with no error line, because the substitution killed the shell.
          #
          # `scripts/build-data-plugins.sh:48` already carries `|| true` for
          # exactly this reason; my version dropped it while copying the shape.
          BASE_IMAGE="$(docker inspect node:22-bookworm-slim \
            --format '{{index .RepoDigests 0}}' 2>/dev/null | head -1 || true)"
          if [ -z "$BASE_IMAGE" ]; then BASE_IMAGE="node:22-bookworm-slim"; fi
          echo "0.0.4 base image: $BASE_IMAGE"
          docker build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg PLUGIN_VERSION=0.0.4 \
            --build-arg CAPABILITY_DIGEST="$CAP_DIGEST" \
            --build-arg BUILD_DIGEST="$BUILD_DIGEST" \
            -t 127.0.0.1:15001/opsweave/data-catalog:0.0.4 \
            plugins/data-catalog/backend >/dev/null
          docker push 127.0.0.1:15001/opsweave/data-catalog:0.0.4 >/dev/null
          DC4_DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' \
            127.0.0.1:15001/opsweave/data-catalog:0.0.4)"
          rm -rf /tmp/dc4
          python3 scripts/assemble_plugin.py \
            --template plugins/data-catalog/manifest.template.json \
            --out /tmp/dc4 --version 0.0.4 --image-ref "$DC4_DIGEST" \
            --frontend-dist plugins/data-catalog/web/dist >/dev/null
          ./target/debug/opsctl bundle --dir /tmp/dc4 \
            --out dist/plugins/data-catalog-0.0.4.plugin.zip \
            --key keys/publisher.key >/dev/null
          test -f dist/plugins/data-catalog-0.0.4.plugin.zip

      - name: Publish failures against a real kernel (Phase 7 Batch A)
        # Runs AFTER the happy paths, on the same platform assumptions, and only if
        # they passed - a failure suite on a platform the lifecycle already broke
        # would report "the publish failed" for a reason unrelated to the injection.
        #
        # WHAT THIS ADDS: `docs/engineering/publish-failure-coverage.md` recorded
        # five conditions as NOT_COVERED because "each needs a KERNEL to install,
        # deploy and activate against". This job has that kernel. The script drives
        # install -> deploy -> READY -> activate -> read-back and then injects five
        # real failures, asserting each time that the ACTIVE version did NOT move.
        #
        # It now builds its input in the step above. Before that step existed this
        # ran ZERO assertions and exited 0; the script exits 3 (BLOCKED) now, so
        # the omission cannot come back silently.
        if: success()
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          tests/ci/phase7_publish_failures.sh 2>&1 | tee phase7-publish-failures.log

      - name: Two nodes, and what a node failure does (Phase 7 TASK-12)
        # Runs AFTER the publish-failure suite, serially: both start a platform and a
        # registry, and both clean up their own. What this adds is the two-node half -
        # a 2-replica deploy using BOTH nodes, and a node PROCESS stopping while its
        # containers stay up, which is the case a single-node harness cannot show.
        #
        # NOT two machines: both nodes are processes on this runner. The script says
        # so in its own output.
        if: success()
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          tests/ci/phase7_two_node_failure.sh 2>&1 | tee phase7-two-node.log

      - name: The release verdict is a function of the stages
        # Runs anywhere, no platform: it drives `verdict_of` with synthetic stage
        # rows. The VALUES come from the live run below; this pins the DECISION,
        # including that a WRONG ACTIVE version is never RELEASED.
        run: bash tests/ci/phase7_release_stages.test.sh

      - name: A real Maven 429, and who recovers it
        # NO PUBLIC NETWORK. A local server answers 429; the project's pom.xml names
        # a parent POM served there, so Maven's own resolver - wagon, checksums,
        # negative cache - runs exactly as against Central.
        #
        # It answers a question a stub cannot: does the OUTER retry fire on a genuine
        # resolution failure, and when a single 429 clears, is it Maven or the outer
        # policy that recovers? The answer decides whether a green legacy-regression
        # may be called 429 recovery at all.
        run: bash tests/scripts/maven-429-recovery.test.sh

      - name: A failed build leaves no stale bundles
        # `dist/plugins` is read by the contract validators and by the negative
        # suite. A failure before the signing stage used to leave the PREVIOUS
        # run's zips there, and nothing marks them stale.
        run: bash tests/scripts/build-plugins-stale-output.test.sh

      - name: The Phase 7 suites cannot silently pass
        # THE GATE FOR THE GATE.
        #
        # Five consecutive green runs of this workflow (45172963410, 45183654404,
        # 45190236157, 45197291594, 45203998931) contained two suites that printed
        # `0 passed, 0 failed, 1 skipped` and exited 0, because nothing built the
        # images they assert on. A step that runs and proves nothing is worse than
        # a missing step: it is cited as evidence.
        #
        # This checks the property directly - missing artifact means BLOCKED, the
        # escape hatch still works, and the build step precedes the consumers -
        # so the omission cannot come back without a red.
        run: bash tests/ci/phase7_suites_cannot_silently_pass.test.sh

      - name: Upload the acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-lifecycle-evidence
          # Both the structured record (lifecycle.json) and every step's raw
          # command, exit code, stdout and stderr. A red run is diagnosable from
          # this artifact alone.
          path: |
            artifacts/p001c13/
            artifacts/p001c13-negatives/
            lifecycle.log
            lifecycle-negatives.log
            lifecycle-multilang.log
            phase7-publish-failures.log
            artifacts/phase7-publish-failures/
            phase7-two-node.log
            artifacts/p001c-multilang-lifecycle/
          if-no-files-found: warn
          retention-days: 14

      - name: State the result
        if: always()
        run: |
          set -eu
          {
            echo "## Plugin lifecycle (P001-C1.3)"
            echo
            if [ -f artifacts/p001c13/lifecycle.json ]; then
              echo '```json'
              cat artifacts/p001c13/lifecycle.json
              echo '```'
            else
              echo "No lifecycle.json was produced: the run did not reach the lifecycle."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
