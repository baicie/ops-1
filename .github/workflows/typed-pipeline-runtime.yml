name: typed-pipeline-runtime
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/kernel/**'
      - 'apps/node/**'
      - 'apps/pipeline-worker/**'
      - 'contracts/**'
      - 'plugins/**'
      - 'tests/acceptance/**'
      - 'tests/runtime/**'
      - 'tests/ci/**'
      - '.github/workflows/typed-pipeline-runtime.yml'
permissions:
  contents: read
jobs:
  runtime-golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPSWEAVE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/opsweave
      # Makes "no URL" a failure inside the kernel test fixture instead of a silent skip, so
      # deleting the line above cannot turn the DB-backed tests green by not running them.
      OPSWEAVE_REQUIRE_TEST_DATABASE: "1"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: DB-backed kernel tests really connected
        run: |
          set -eu
          # Same gate as .github/workflows/ci.yml. Nothing before this step migrates except the
          # test fixture itself, so a ledger row proves test_pool() reached the database and ran
          # sqlx::migrate! -- i.e. the 10 DB tests in jobs::terminalization_tests did not return
          # early. Keep this step directly after cargo test: the acceptance scripts below migrate
          # on their own and would make the check vacuous.
          applied=$(psql "$OPSWEAVE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc 'select count(*) from _sqlx_migrations')
          echo "migrations applied by the test fixture: $applied"
          test "$applied" -gt 0
          present=$(psql "$OPSWEAVE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('kernel.pipeline_jobs') is not null")
          echo "kernel.pipeline_jobs exists: $present"
          test "$present" = "t"
      - run: python3 tests/contract/validate_typed_pipeline.py
      - run: tests/ci/data_foundation_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typed-pipeline-runtime-artifacts
          path: |
            /tmp/data-kernel.log
            /tmp/node-a.log
            /tmp/node-b.log
            /tmp/*worker*.log
          if-no-files-found: warn
