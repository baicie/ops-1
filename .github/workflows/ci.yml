name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  rust:
    runs-on: ubuntu-latest
    # apps/kernel's DB-backed tests (src/jobs.rs, mod terminalization_tests) skip only when
    # OPSWEAVE_TEST_DATABASE_URL is genuinely unset; a set-but-unusable URL (bad syntax,
    # unreachable server, rejected migrations) panics. This job also sets
    # OPSWEAVE_REQUIRE_TEST_DATABASE=1, which turns even that skip into a failure, so a green run
    # here can only mean the 10 DB tests really ran against the service below.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPSWEAVE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/opsweave
      # Makes "no URL" a failure inside the fixture instead of a silent skip. Unset locally.
      OPSWEAVE_REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cargo fmt --all -- --check
      # Only a genuinely unset URL makes the fixture skip, and OPSWEAVE_REQUIRE_TEST_DATABASE=1
      # turns that skip into a failure too; connect and migration failures panic on their own.
      # Keep both steps anyway: prove the URL is live before the run, and prove the fixture really
      # reached it after the run, so deleting the env above cannot pass by skipping.
      - name: DB-backed kernel tests are armed
        run: |
          set -eu
          : "${OPSWEAVE_TEST_DATABASE_URL:?the kernel DB tests would silently skip without it}"
          psql "$OPSWEAVE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc 'select 1' > /dev/null
          echo "armed against $OPSWEAVE_TEST_DATABASE_URL"
          echo "DB-gated tests: jobs::terminalization_tests (10 of its 11; the cursor test is pure)."
          echo "No workspace test needs node/worker/docker, so nothing else is expected to skip."
      - run: cargo test --locked --workspace
      - name: DB-backed kernel tests really connected
        run: |
          set -eu
          # Only the fixture migrates, so a ledger row proves test_pool() reached the database and
          # ran sqlx::migrate! -- i.e. the 10 DB tests did not return early. Do not add a migrate
          # step ahead of the tests in this job or this check goes vacuous.
          applied=$(psql "$OPSWEAVE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc 'select count(*) from _sqlx_migrations')
          echo "migrations applied by the test fixture: $applied"
          test "$applied" -gt 0
          present=$(psql "$OPSWEAVE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('kernel.pipeline_jobs') is not null")
          echo "kernel.pipeline_jobs exists: $present"
          test "$present" = "t"
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # G14.2: two applications and two shared packages. Each is typechecked and
      # built on its own, so one application cannot mask the other's failure.
      - run: pnpm --fail-if-no-match --filter @opsweave/platform-client typecheck
      - run: pnpm --fail-if-no-match --filter @opsweave/ui typecheck
      - run: pnpm --fail-if-no-match --filter @opsweave/platform-console typecheck
      - run: pnpm --fail-if-no-match --filter @opsweave/ops-web typecheck
      - run: pnpm --fail-if-no-match --filter @opsweave/hello-web typecheck
      - run: pnpm --fail-if-no-match --filter @opsweave/data-catalog-web typecheck
      - run: pnpm --fail-if-no-match --filter @opsweave/data-integration-web typecheck
      # Fails on a missing message key or a key built from a template literal.
      - run: node scripts/check-i18n.mjs
      # One status vocabulary: a wire code rendered as copy fails the build. It sits beside the
      # i18n gate because both answer the same question - what may a message say?
      - run: node scripts/check-status-vocabulary.mjs
      - run: node scripts/check-ui-tokens.mjs --ratchet docs/design/ui-visual-v3/spec/ui-debt.json
      # The token gate's own fail-closed properties: an off-scale spacing literal fails, an
      # on-scale one stays legal (code-rules B6), a budget key no rule emits is an error, and a
      # stylesheet that matches zero spacing declarations fails rather than passing.
      - run: node --test scripts/check-ui-tokens.test.mjs
      # No live file may name a retired path (rules/11). The pre-G14.2 web package was deleted in
      # 461d4da and eight executables kept building or serving it; pnpm exits 0 on a filter that
      # matches nothing, so four harnesses were green while building zero bundles. This check
      # fails closed on a missing scan root and prints its file count, so a pass cannot be vacuous.
      - run: node tests/ci/check-retired-paths.mjs
      # The retired-path gate's own counterfactuals. It allowed a fixed set of file
      # SUFFIXES, so every Dockerfile - which has none - was invisible to it, and
      # `deployments/staging/Dockerfile` kept building the deleted web package while
      # this gate reported zero references. The staging image only broke at merge
      # time, because no PR job builds it. One case here is that exact file shape.
      - run: node --test tests/ci/check-retired-paths.test.mjs
      # The geometry gate's own fail-closed properties: empty passes, dropped routes, missing
      # matrix combinations and duplicate passes.
      - run: node --test scripts/check-ui-metrics.test.mjs
      # The tracked audit artifacts are a real pass: every named route is present in each file.
      # The matrix command below is the one that checks the viewport/theme/locale combinations;
      # the route manifest deliberately has no such axis.
      - run: node scripts/check-ui-metrics.mjs --manifest docs/design/ui-visual-v3/spec/route-manifest.json artifacts/ui/visual-v3/audit
      - run: node scripts/check-ui-metrics.mjs --matrix docs/design/ui-visual-v3/spec/matrix-manifest.json artifacts/ui/observability/metrics
      - run: pnpm --fail-if-no-match --filter @opsweave/platform-console build
      - run: pnpm --fail-if-no-match --filter @opsweave/ops-web build
      - run: pnpm --fail-if-no-match --filter @opsweave/hello-web build
      - run: pnpm --fail-if-no-match --filter @opsweave/data-catalog-web build
      - run: pnpm --fail-if-no-match --filter @opsweave/data-integration-web build
      - run: node --check plugins/data-catalog/backend/server.mjs
      - run: node --check plugins/data-integration/backend/server.mjs
  # The vitest suites used to run nowhere: the web job
  # above only typechecks and builds, so a green pipeline never proved a unit test passed. It is
  # its own job so a red unit run is reported as such instead of hiding behind a build failure.
  web-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --fail-if-no-match --filter @opsweave/platform-client test
      - run: pnpm --fail-if-no-match --filter @opsweave/ui test
      - run: pnpm --fail-if-no-match --filter @opsweave/platform-console test
      - run: pnpm --fail-if-no-match --filter @opsweave/ops-web test
  # The Zabbix plugin had no CI at all: package.json pointed at a server.test.mjs that did not
  # exist, and node --check does not resolve imports, so the server could not be proven to start.
  # This job binds a real socket and runs a real PostgreSQL, which is the only evidence that the
  # plugin's routes and storage work outside one workstation. Real Zabbix remains NOT_RUN.
  zabbix-plugin:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave_zabbix
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave_zabbix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPSWEAVE_TEST_PLUGIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/opsweave_zabbix
      # A persistence gate that skips when the database is missing is not a gate.
      OPSWEAVE_REQUIRE_PLUGIN_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix plugins/zabbix-source/backend
      - name: unit tests and the real HTTP socket suite
        run: node --test plugins/zabbix-source/backend/zabbix.test.mjs plugins/zabbix-source/backend/server.test.mjs tests/ci/g13a2_endpoint_attack.test.mjs
      - name: source and collection persistence against real PostgreSQL
        run: node --test plugins/zabbix-source/backend/storage.test.mjs
  # B2.1: the data plugins' identity boundary, driven over real sockets against
  # real plugin processes and a real PostgreSQL. The suite asserts the secure
  # behaviour (an unsigned role header authenticates nothing, a signed context is
  # bound to one plugin and one user) and asserts zero row side effects on every
  # refusal. It failed 6 of 7 tests on the pre-fix commit, which is the
  # reproduction this gate protects against recurring.
  b2-plugin-identity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave_b2_identity
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave_b2_identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPSWEAVE_TEST_PLUGIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/opsweave_b2_identity
      OPSWEAVE_REQUIRE_PLUGIN_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Every OCI image is built from its own backend context, so the identity
      # module is copied per plugin. The copies must stay byte-identical to the
      # canonical source or three security-critical implementations drift apart.
      - name: plugin identity modules match the canonical source
        run: node scripts/sync-plugin-identity.mjs --check
      - run: npm ci --prefix plugins/data-catalog/backend
      - run: npm ci --prefix plugins/data-integration/backend
      - name: identity attack and regression suite
        run: node --test tests/ci/b2_plugin_identity_attack.test.mjs
  # The decomposed suites cannot prove a round trip: two implementations of the
  # same digest can both be wrong. This job starts a real Kernel, a real plugin
  # process and a real PostgreSQL, and checks that the bytes the plugin signed
  # are the bytes the Kernel verified, stored and served.
  g13a-roundtrip:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      G13A_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cargo build --locked -p opsweave-kernel
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix plugins/zabbix-source/backend
      - name: plugin bytes -> Kernel verification -> content read-back
        run: node tests/ci/g13a_evidence_roundtrip.mjs
  # The decomposed and two-process suites cannot prove a deployed plugin. This
  # job runs the production path: a real Kernel, a real Node runtime pulling the
  # OCI image, the Kernel Gateway, a real PostgreSQL and the browser. It builds
  # the UI under test from the #39 stack branch so the browser is the real
  # collect dialog, not a fixture. Upstream Zabbix is a local fixture and the
  # run says so; REAL_ZABBIX remains NOT_RUN.
  g13a1-gateway:
    runs-on: ubuntu-latest
    env:
      OPSWEAVE_REGISTRY: 127.0.0.1:5001
      # The Node process (on the host) pulls the image; only the plugin
      # container needs the Docker bridge address for its DB/fixture calls.
      OPSWEAVE_PULL_REGISTRY: 127.0.0.1:5001
      OPSWEAVE_G13A1_PLUGIN_HOST: 172.17.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cargo build --locked -p opsweave-kernel -p opsweave-node -p opsweave-opsctl
      - run: ./target/debug/opsctl keygen --out-dir keys
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: npm ci --prefix plugins/zabbix-source/backend
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opsweave/ui-tests exec playwright install --with-deps chromium
      - name: build the UI under test from this commit
        run: |
          set -euo pipefail
          # The browser must come from the same tree as the Kernel, Node and
          # plugin. The old job pinned #39's SHA, so a green run said nothing
          # about the UI merged into main.
          pnpm --fail-if-no-match --filter @opsweave/platform-console build
          # The spec this job runs opens /app/incidents/<id>, which is the OPS
          # application. Without its bundle the kernel answers that path with the
          # console shell and the ops router is not mounted, so the page loads and
          # then 404s - the exact "page loaded, everything below it missing" shape.
          pnpm --fail-if-no-match --filter @opsweave/ops-web build
          rm -rf /tmp/g13a1-ui-dist /tmp/g13a1-ops-dist
          cp -R apps/platform-console/dist /tmp/g13a1-ui-dist
          cp -R apps/ops-web/dist /tmp/g13a1-ops-dist
      - name: local registry
        run: |
          set -euo pipefail
          docker run -d --name opsweave-g13a1-registry -p 5001:5000 registry:2
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5001/v2/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5001/v2/ >/dev/null
      - name: browser -> Gateway -> Node -> OCI plugin -> fixture
        run: bash tests/ci/g13a1_gateway_e2e.sh
  # G13-B1.4: the operator claim queue, over a real Kernel and a real PostgreSQL.
  # The incident row is a labelled FIXTURE (the exact state the Event handler writes);
  # the Event -> Job -> collect half needs Node/OCI/Zabbix and has its own gates.
  # Without this job the acceptance script would be a file nothing runs - the defect
  # tests/ci/check-spec-coverage.mjs exists to refuse.
  g13b14-claim:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave_b14
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave_b14"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPSWEAVE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/opsweave_b14
      OPSWEAVE_URL: http://127.0.0.1:18241
      OPSWEAVE_ADMIN_EMAIL: admin@opsweave.local
      OPSWEAVE_ADMIN_PASSWORD: 'OpsWeave!2026'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The browser must come from this commit: the queue panel is what the spec measures.
      - run: pnpm --fail-if-no-match --filter @opsweave/platform-console build
      - run: pnpm --fail-if-no-match --filter @opsweave/ops-web build
      - run: cargo build --locked -p opsweave-kernel
      - name: start the kernel on the throw-away database
        run: |
          set -euo pipefail
          rm -rf data-ci/g13b14 && mkdir -p data-ci/g13b14
          export OPSWEAVE_BIND=127.0.0.1:18241
          export OPSWEAVE_PUBLIC_URL="$OPSWEAVE_URL"
          export DATABASE_URL="$OPSWEAVE_DATABASE_URL"
          export OPSWEAVE_DATA_DIR="$PWD/data-ci/g13b14"
          export OPSWEAVE_WEB_DIST="$PWD/apps/platform-console/dist"
          export OPSWEAVE_OPS_WEB_DIST="$PWD/apps/ops-web/dist"
          export OPSWEAVE_BOOTSTRAP_ADMIN_EMAIL="$OPSWEAVE_ADMIN_EMAIL"
          export OPSWEAVE_BOOTSTRAP_ADMIN_PASSWORD="$OPSWEAVE_ADMIN_PASSWORD"
          export OPSWEAVE_BOOTSTRAP_ADMIN_NAME='Platform Admin'
          export RUST_LOG=info
          nohup ./target/debug/opsweave-kernel > data-ci/g13b14/kernel.log 2>&1 &
          for _ in $(seq 1 120); do
            curl -fsS "$OPSWEAVE_URL/livez" >/dev/null 2>&1 && exit 0
            sleep 0.5
          done
          echo "the kernel did not answer /livez" >&2
          tail -60 data-ci/g13b14/kernel.log >&2
          exit 1
      - name: operator claim queue over real HTTP
        run: bash tests/acceptance/g13_b14_claim.sh
      - run: pnpm --filter @opsweave/ui-tests exec playwright install --with-deps chromium
      - name: claim queue in a real browser at 1440 / 1024 / 390, light and dark
        env:
          OPSWEAVE_G13B14_OUT: ${{ github.workspace }}/artifacts/g13b14
        run: pnpm --filter @opsweave/ui-tests exec playwright test g13b14-claim.spec.ts
  # G13-B1.6: a committed Evidence effect survives the crash window between
  # "evidence committed" and "job success confirmed". The fixture row is the
  # exact state a crash leaves behind; the real Kernel worker must recover it
  # from the receipt without calling any plugin.
  g13b16-effect:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave_b16
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave_b16"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPSWEAVE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/opsweave_b16
      OPSWEAVE_URL: http://127.0.0.1:18242
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cargo build --locked -p opsweave-kernel
      - name: start the kernel (its worker loop is the system under test)
        run: |
          set -euo pipefail
          rm -rf data-ci/g13b16 && mkdir -p data-ci/g13b16
          export OPSWEAVE_BIND=127.0.0.1:18242
          export OPSWEAVE_PUBLIC_URL="$OPSWEAVE_URL"
          export DATABASE_URL="$OPSWEAVE_DATABASE_URL"
          export OPSWEAVE_DATA_DIR="$PWD/data-ci/g13b16"
          export OPSWEAVE_BOOTSTRAP_ADMIN_EMAIL=admin@opsweave.local
          export OPSWEAVE_BOOTSTRAP_ADMIN_PASSWORD='OpsWeave!2026'
          export OPSWEAVE_BOOTSTRAP_ADMIN_NAME='Platform Admin'
          export RUST_LOG=info
          nohup ./target/debug/opsweave-kernel > data-ci/g13b16/kernel.log 2>&1 &
          for _ in $(seq 1 120); do
            curl -fsS "$OPSWEAVE_URL/livez" >/dev/null 2>&1 && exit 0
            sleep 0.5
          done
          echo "the kernel did not answer /livez" >&2
          tail -60 data-ci/g13b16/kernel.log >&2
          exit 1
      - name: committed evidence survives the crash window
        run: bash tests/acceptance/g13_b16_effect.sh
  # G13-B1.7 part B: a persisted job survives the enqueue token's expiry, while
  # revocation and a disabled source stop it with a stable terminal reason. The
  # real Kernel worker loop is the system under test; no Node/Zabbix is used.
  g13b17-principal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave_b17
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave_b17"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPSWEAVE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/opsweave_b17
      OPSWEAVE_URL: http://127.0.0.1:18243
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cargo build --locked -p opsweave-kernel
      - name: start the kernel (its worker loop is the system under test)
        run: |
          set -euo pipefail
          rm -rf data-ci/g13b17 && mkdir -p data-ci/g13b17
          export OPSWEAVE_BIND=127.0.0.1:18243
          export OPSWEAVE_PUBLIC_URL="$OPSWEAVE_URL"
          export DATABASE_URL="$OPSWEAVE_DATABASE_URL"
          export OPSWEAVE_DATA_DIR="$PWD/data-ci/g13b17"
          export OPSWEAVE_BOOTSTRAP_ADMIN_EMAIL=admin@opsweave.local
          export OPSWEAVE_BOOTSTRAP_ADMIN_PASSWORD='OpsWeave!2026'
          export OPSWEAVE_BOOTSTRAP_ADMIN_NAME='Platform Admin'
          export RUST_LOG=info
          nohup ./target/debug/opsweave-kernel > data-ci/g13b17/kernel.log 2>&1 &
          for _ in $(seq 1 120); do
            curl -fsS "$OPSWEAVE_URL/livez" >/dev/null 2>&1 && exit 0
            sleep 0.5
          done
          echo "the kernel did not answer /livez" >&2
          tail -60 data-ci/g13b17/kernel.log >&2
          exit 1
      - name: persisted jobs vs credential and authorization lifetime
        run: bash tests/acceptance/g13_b17_principal.sh
  # V3 brief §9: "截图不允许无上限提交 Git；仅保留精选基线，其余归档为 CI Artifact."
  # Nine runs of tests/ui/admin-polish.spec.ts accumulated 756 SHA-named screenshots (127.95 MB) of
  # the same seven admin pages because no job ever looked at what the index was carrying. The
  # capture specs still write into artifacts/ui/ - that is where they run from - and
  # .github/workflows/staging-preview.yml now archives those trees instead of leaving committing
  # them as the only way off the runner. This job is the gate: tests/ci/tracked-png-budget.json
  # holds the budget, and the guard also fails on a dangling doc reference, because a screenshot a
  # document cites is an evidence link. It needs no pnpm install - it only reads the git index.
  artifact-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/ci/check-tracked-png-budget.mjs
  # A spec that no workflow executes guarantees nothing, however correct it is; two defects
  # reached main through exactly that hole (tests/ui/g11-incident-slice.spec.ts asserted both and
  # was referenced by nothing). This job reads the command lines the workflows actually run and
  # the path filters that decide whether they run at all, so "wired in" and "editing it reruns the
  # job" are both checked. Its own known-unrun list is in the script, with a reason per entry.
  spec-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/ci/check-spec-coverage.mjs
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install jsonschema pyyaml
