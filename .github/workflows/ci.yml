name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  rust:
    runs-on: ubuntu-latest
    # apps/kernel's DB-backed tests (src/jobs.rs, mod terminalization_tests) skip only when
    # OPSWEAVE_TEST_DATABASE_URL is genuinely unset; a set-but-unusable URL (bad syntax,
    # unreachable server, rejected migrations) panics. This job also sets
    # OPSWEAVE_REQUIRE_TEST_DATABASE=1, which turns even that skip into a failure, so a green run
    # here can only mean the 10 DB tests really ran against the service below.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPSWEAVE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/opsweave
      # Makes "no URL" a failure inside the fixture instead of a silent skip. Unset locally.
      OPSWEAVE_REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cargo fmt --all -- --check
      # Only a genuinely unset URL makes the fixture skip, and OPSWEAVE_REQUIRE_TEST_DATABASE=1
      # turns that skip into a failure too; connect and migration failures panic on their own.
      # Keep both steps anyway: prove the URL is live before the run, and prove the fixture really
      # reached it after the run, so deleting the env above cannot pass by skipping.
      - name: DB-backed kernel tests are armed
        run: |
          set -eu
          : "${OPSWEAVE_TEST_DATABASE_URL:?the kernel DB tests would silently skip without it}"
          psql "$OPSWEAVE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc 'select 1' > /dev/null
          echo "armed against $OPSWEAVE_TEST_DATABASE_URL"
          echo "DB-gated tests: jobs::terminalization_tests (10 of its 11; the cursor test is pure)."
          echo "No workspace test needs node/worker/docker, so nothing else is expected to skip."
      - run: cargo test --locked --workspace
      - name: DB-backed kernel tests really connected
        run: |
          set -eu
          # Only the fixture migrates, so a ledger row proves test_pool() reached the database and
          # ran sqlx::migrate! -- i.e. the 10 DB tests did not return early. Do not add a migrate
          # step ahead of the tests in this job or this check goes vacuous.
          applied=$(psql "$OPSWEAVE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc 'select count(*) from _sqlx_migrations')
          echo "migrations applied by the test fixture: $applied"
          test "$applied" -gt 0
          present=$(psql "$OPSWEAVE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('kernel.pipeline_jobs') is not null")
          echo "kernel.pipeline_jobs exists: $present"
          test "$present" = "t"
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opsweave/platform-web typecheck
      - run: pnpm --filter @opsweave/hello-web typecheck
      - run: pnpm --filter @opsweave/data-catalog-web typecheck
      - run: pnpm --filter @opsweave/data-integration-web typecheck
      # Fails on a missing message key or a key built from a template literal.
      - run: node scripts/check-i18n.mjs
      # One status vocabulary: a wire code rendered as copy fails the build. It sits beside the
      # i18n gate because both answer the same question - what may a message say?
      - run: node scripts/check-status-vocabulary.mjs
      - run: node scripts/check-ui-tokens.mjs --ratchet docs/design/ui-visual-v3/spec/ui-debt.json
      - run: pnpm --filter @opsweave/platform-web build
      - run: pnpm --filter @opsweave/hello-web build
      - run: pnpm --filter @opsweave/data-catalog-web build
      - run: pnpm --filter @opsweave/data-integration-web build
      - run: node --check plugins/data-catalog/backend/server.mjs
      - run: node --check plugins/data-integration/backend/server.mjs
  # The vitest suite of apps/platform-web (src/**/*.test.ts) used to run nowhere: the web job
  # above only typechecks and builds, so a green pipeline never proved a unit test passed. It is
  # its own job so a red unit run is reported as such instead of hiding behind a build failure.
  web-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opsweave/platform-web test
  # The Zabbix plugin had no CI at all: package.json pointed at a server.test.mjs that did not
  # exist, and node --check does not resolve imports, so the server could not be proven to start.
  # This job binds a real socket and runs a real PostgreSQL, which is the only evidence that the
  # plugin's routes and storage work outside one workstation. Real Zabbix remains NOT_RUN.
  zabbix-plugin:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave_zabbix
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave_zabbix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPSWEAVE_TEST_PLUGIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/opsweave_zabbix
      # A persistence gate that skips when the database is missing is not a gate.
      OPSWEAVE_REQUIRE_PLUGIN_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix plugins/zabbix-source/backend
      - name: unit tests and the real HTTP socket suite
        run: node --test plugins/zabbix-source/backend/zabbix.test.mjs plugins/zabbix-source/backend/server.test.mjs tests/ci/g13a2_endpoint_attack.test.mjs
      - name: source and collection persistence against real PostgreSQL
        run: node --test plugins/zabbix-source/backend/storage.test.mjs
  # The decomposed suites cannot prove a round trip: two implementations of the
  # same digest can both be wrong. This job starts a real Kernel, a real plugin
  # process and a real PostgreSQL, and checks that the bytes the plugin signed
  # are the bytes the Kernel verified, stored and served.
  g13a-roundtrip:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      G13A_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cargo build --locked -p opsweave-kernel
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix plugins/zabbix-source/backend
      - name: plugin bytes -> Kernel verification -> content read-back
        run: node tests/ci/g13a_evidence_roundtrip.mjs
  # The decomposed and two-process suites cannot prove a deployed plugin. This
  # job runs the production path: a real Kernel, a real Node runtime pulling the
  # OCI image, the Kernel Gateway, a real PostgreSQL and the browser. It builds
  # the UI under test from the #39 stack branch so the browser is the real
  # collect dialog, not a fixture. Upstream Zabbix is a local fixture and the
  # run says so; REAL_ZABBIX remains NOT_RUN.
  g13a1-gateway:
    runs-on: ubuntu-latest
    env:
      OPSWEAVE_REGISTRY: 127.0.0.1:5001
      # The Node process (on the host) pulls the image; only the plugin
      # container needs the Docker bridge address for its DB/fixture calls.
      OPSWEAVE_PULL_REGISTRY: 127.0.0.1:5001
      OPSWEAVE_G13A1_PLUGIN_HOST: 172.17.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cargo build --locked -p opsweave-kernel -p opsweave-node -p opsweave-opsctl
      - run: ./target/debug/opsctl keygen --out-dir keys
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: npm ci --prefix plugins/zabbix-source/backend
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opsweave/ui-tests exec playwright install --with-deps chromium
      - name: build the UI under test from the #39 stack branch
        run: |
          set -euo pipefail
          git fetch origin feat/g13-a-collect-ui
          # Pin the #39 commit under test: the branch may advance, and this job
          # certifies one exact UI head, not whatever it points at today.
          UI_SHA=81d1765455f9dc9f4fe9fb8836cea9151f75253f
          git branch -f feat/g13-a-collect-ui "$UI_SHA"
          git worktree add /tmp/g13a1-ui "$UI_SHA"
          (cd /tmp/g13a1-ui && pnpm install --frozen-lockfile && pnpm --filter @opsweave/platform-web build)
          cp -R /tmp/g13a1-ui/apps/platform-web/dist /tmp/g13a1-ui-dist
      - name: local registry
        run: |
          set -euo pipefail
          docker run -d --name opsweave-g13a1-registry -p 5001:5000 registry:2
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5001/v2/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5001/v2/ >/dev/null
      - name: browser -> Gateway -> Node -> OCI plugin -> fixture
        run: bash tests/ci/g13a1_gateway_e2e.sh
  # V3 brief §9: "截图不允许无上限提交 Git；仅保留精选基线，其余归档为 CI Artifact."
  # Nine runs of tests/ui/admin-polish.spec.ts accumulated 756 SHA-named screenshots (127.95 MB) of
  # the same seven admin pages because no job ever looked at what the index was carrying. The
  # capture specs still write into artifacts/ui/ - that is where they run from - and
  # .github/workflows/staging-preview.yml now archives those trees instead of leaving committing
  # them as the only way off the runner. This job is the gate: tests/ci/tracked-png-budget.json
  # holds the budget, and the guard also fails on a dangling doc reference, because a screenshot a
  # document cites is an evidence link. It needs no pnpm install - it only reads the git index.
  artifact-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/ci/check-tracked-png-budget.mjs
  # A spec that no workflow executes guarantees nothing, however correct it is; two defects
  # reached main through exactly that hole (tests/ui/g11-incident-slice.spec.ts asserted both and
  # was referenced by nothing). This job reads the command lines the workflows actually run and
  # the path filters that decide whether they run at all, so "wired in" and "editing it reruns the
  # job" are both checked. Its own known-unrun list is in the script, with a reason per entry.
  spec-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/ci/check-spec-coverage.mjs
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install jsonschema pyyaml
      - run: python3 tests/contract/validate_contracts.py
