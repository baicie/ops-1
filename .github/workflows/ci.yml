name: ci
on:
  pull_request:
  push:
    branches: [main]

# Least privilege at the workflow level. No job here publishes packages, pushes
# an image, or writes to a pull request, so read is all any of them needs.
# `staging-preview.yml` is the only workflow with `packages: write`, and it has no
# `pull_request` trigger at all.
permissions:
  contents: read
jobs:
  # Which suites does this change actually require? Answered ONCE, here, and read
  # by every job that is expensive enough to care.
  #
  # WHY A JOB AND NOT A `paths:` FILTER
  #
  # `paths:` is workflow-level, and ci.yml holds both the jobs that must run on
  # every change (contracts, spec-coverage, artifact-budget - all seconds) and the
  # ones that cost minutes (two image builds, four g13/g13b acceptance jobs). A
  # workflow-level filter cannot separate them.
  #
  # The alternative was an `if:` on each heavy job that re-derives the answer. That
  # puts the same decision in two places, and this repository has now been bitten
  # twice by two tables that were supposed to agree. So the answer is computed
  # once, as an output, and jobs read it.
  #
  # WHY THE ANALYZER IS TRUSTWORTHY HERE, and where it is not: it is used only to
  # SKIP work. `ci-gate` still requires every suite the analyzer asked for, so a
  # wrong answer in the permissive direction fails the gate rather than passing it.
  # A wrong answer in the restrictive direction - skipping a suite that was needed
  # - is what `check-impact-consistency.mjs` guards, in the required
  # `spec-coverage` job.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image-build: ${{ steps.decide.outputs.image-build }}
      acceptance: ${{ steps.decide.outputs.acceptance }}
      rust: ${{ steps.decide.outputs.rust }}
      web: ${{ steps.decide.outputs.web }}
      web-unit: ${{ steps.decide.outputs.web-unit }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base is needed for the pull-request diff.
          fetch-depth: 0
      - name: Decide the scope
        id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
            CHANGED="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null || true)"
          else
            CHANGED="$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" 2>/dev/null || true)"
          fi
          if [ -z "$CHANGED" ]; then
            # Unknown change set -> do everything. Same fail-closed rule as the gate.
            CHANGED="__unavailable__"
            echo "no change set available; running the heavy jobs"
          fi
          printf '%s\n' "$CHANGED" | sed 's/^/  /'
          printf '%s\n' "$CHANGED" | node tests/ci/impact.mjs --stdin --json > /tmp/impact.json
          # One flag per group of expensive jobs. Add a group here only together
          # with the suite rule in impact.mjs that makes it required.
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const d = JSON.parse(readFileSync("/tmp/impact.json", "utf8"));
            const out = {
              // The two image builds (~4.5 min each). Required by anything the
              // Dockerfile compiles: apps/, crates/, contracts/, both web apps.
              "image-build": d.suites["platform-image-build"],
              // The four g13/g13b acceptance jobs (~1.6-3.9 min each). They drive
              // the Gateway against a live platform.
              "acceptance": d.suites["g12-acceptance"] || d.suites["data-foundation"],
              // The three compile/typecheck jobs. Seconds to a couple of minutes,
              // but they ran on every documentation change until now.
              "rust": d.suites["rust"],
              "web": d.suites["web"],
              "web-unit": d.suites["web-unit"],
            };
            for (const [k, v] of Object.entries(out)) {
              console.log(k + "=" + (v ? "true" : "false"));
            }
          ' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # L0 - static and policy. Seconds, not minutes, and it runs before anything
  # expensive so a YAML typo or a shell quoting bug fails fast.
  #
  # Both tools were available and neither was ever wired in. `actionlint` found a
  # real latent bug on its first run: an unquoted
  # `DATABASE_URL=...?sslmode=disable` that shellcheck reads as a brace expansion
  # (SC2125), sitting in two steps of the required `platform-only` job.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (workflow YAML and embedded shell)
        uses: raven-actions/actionlint@v2
        with:
          # Pinned, and the pin has already mattered twice:
          #
          #   1. An UNPINNED version can turn this job red without a commit,
          #      because actionlint releases change which shellcheck rules they
          #      surface.
          #   2. A LOCAL actionlint is not this actionlint. 1.7.12 (Homebrew, what
          #      a developer has) reported 0 problems on this tree; 1.7.7 reported
          #      SC2002 in platform-linux-acceptance.yml - `cat file | tail` - which
          #      is real. The local run said clean and CI said fail, and the
          #      version was the whole reason.
          #
          # Reproduce CI locally with:
          #   docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
          version: 1.7.7
      - name: shellcheck at error severity
        run: |
          set -eu
          # `error` only. The tree has zero at this level; warning-level findings
          # are dominated by style and would need a suppression pass first - see
          # docs/ci/architecture-proposal.md.
          shellcheck --severity=error -x tests/acceptance/*.sh tests/ci/*.sh scripts/*.sh

  rust:
    # ALWAYS RUNS - `rust` is a required context. See the note on `web`.
    # ALWAYS RUNS, and does NOT list `scope` in `needs`.
    #
    # Both halves matter, and the first fix missed the second. Removing the `if:`
    # made this job unconditional, but leaving `needs: [scope]` re-created the same
    # defect by another route: in GitHub Actions a job whose `needs` entry was
    # skipped or failed is ITSELF skipped. `scope` runs `git fetch`, `git diff` and
    # `node impact.mjs` under `set -euo pipefail` with a 5-minute timeout, so any
    # non-zero exit there would take `rust`, `web`, `web-unit` and
    # `platform-image-build` to `skipped` - four of the nine contexts ruleset
    # 26958761 requires - and the merge endpoint would answer
    # `9 of 9 required status checks are expected`.
    #
    # `scope` exists only to decide which of the NON-required heavy jobs run.
    runs-on: ubuntu-24.04
    # apps/kernel's DB-backed tests (src/jobs.rs, mod terminalization_tests) skip only when
    # OPSWEAVE_TEST_DATABASE_URL is genuinely unset; a set-but-unusable URL (bad syntax,
    # unreachable server, rejected migrations) panics. This job also sets
    # OPSWEAVE_REQUIRE_TEST_DATABASE=1, which turns even that skip into a failure, so a green run
    # here can only mean the 10 DB tests really ran against the service below.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPSWEAVE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/opsweave
      # Makes "no URL" a failure inside the fixture instead of a silent skip. Unset locally.
      OPSWEAVE_REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # One cache, shared by every job in this workflow.
      #
      # Thirteen jobs across the estate install a Rust toolchain and none cached
      # a compiled artifact, so each started with an empty `target/`. `shared-key`
      # is what makes them share: without it `Swatinem/rust-cache@v2` derives the
      # key from the job id (`add-job-id-key` defaults to true), and seven jobs
      # would write seven caches that never hit each other.
      #
      # The key also covers `Cargo.lock`, the workspace manifests, the toolchain
      # file and `.cargo/config.toml` via `add-rust-environment-hash-key`, so a
      # lockfile change invalidates it rather than silently reusing stale objects.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cargo fmt --all -- --check
      # Only a genuinely unset URL makes the fixture skip, and OPSWEAVE_REQUIRE_TEST_DATABASE=1
      # turns that skip into a failure too; connect and migration failures panic on their own.
      # Keep both steps anyway: prove the URL is live before the run, and prove the fixture really
      # reached it after the run, so deleting the env above cannot pass by skipping.
      - name: DB-backed kernel tests are armed
        run: |
          set -eu
          : "${OPSWEAVE_TEST_DATABASE_URL:?the kernel DB tests would silently skip without it}"
          psql "$OPSWEAVE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc 'select 1' > /dev/null
          echo "armed against $OPSWEAVE_TEST_DATABASE_URL"
          echo "DB-gated tests: jobs::terminalization_tests (10 of its 11; the cursor test is pure)."
          echo "No workspace test needs node/worker/docker, so nothing else is expected to skip."
      - run: cargo test --locked --workspace
      - name: DB-backed kernel tests really connected
        run: |
          set -eu
          # Only the fixture migrates, so a ledger row proves test_pool() reached the database and
          # ran sqlx::migrate! -- i.e. the 10 DB tests did not return early. Do not add a migrate
          # step ahead of the tests in this job or this check goes vacuous.
          applied=$(psql "$OPSWEAVE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc 'select count(*) from _sqlx_migrations')
          echo "migrations applied by the test fixture: $applied"
          test "$applied" -gt 0
          present=$(psql "$OPSWEAVE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('kernel.pipeline_jobs') is not null")
          echo "kernel.pipeline_jobs exists: $present"
          test "$present" = "t"
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
  web:
    # ALWAYS RUNS. `web` is one of the nine contexts ruleset 26958761 requires,
    # and a required check that is SKIPPED blocks a merge exactly as hard as one
    # that is missing: the rule wants a conclusion named `web` on the head commit
    # and `skipped` is not it. Measured on PR #144 - a `gateway.rs`-only change -
    # the merge endpoint answered `9 of 9 required status checks are expected`
    # with `web` and `web-unit` in `skipping`, and the PR could not merge at all.
    #
    # The scope fan-out is for jobs whose cost is worth avoiding. It must never
    # reach a job the ruleset names. `image-build` and the `g13*` acceptance jobs
    # are not required contexts, so gating those stays safe.

    # ALWAYS RUNS, and does NOT list `scope` in `needs`.
    #
    # Both halves matter, and the first fix missed the second. Removing the `if:`
    # made this job unconditional, but leaving `needs: [scope]` re-created the same
    # defect by another route: in GitHub Actions a job whose `needs` entry was
    # skipped or failed is ITSELF skipped. `scope` runs `git fetch`, `git diff` and
    # `node impact.mjs` under `set -euo pipefail` with a 5-minute timeout, so any
    # non-zero exit there would take `rust`, `web`, `web-unit` and
    # `platform-image-build` to `skipped` - four of the nine contexts ruleset
    # 26958761 requires - and the merge endpoint would answer
    # `9 of 9 required status checks are expected`.
    #
    # `scope` exists only to decide which of the NON-required heavy jobs run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # G14.2: two applications and two shared packages. Each is typechecked and
      # built on its own, so one application cannot mask the other's failure.
      - run: pnpm --fail-if-no-match --filter @opsweave/platform-client typecheck
      - run: pnpm --fail-if-no-match --filter @opsweave/ui typecheck
      - run: pnpm --fail-if-no-match --filter @opsweave/platform-console typecheck
      - run: pnpm --fail-if-no-match --filter @opsweave/ops-web typecheck
      - run: pnpm --fail-if-no-match --filter @opsweave/hello-web typecheck
      - run: pnpm --fail-if-no-match --filter @opsweave/data-catalog-web typecheck
      - run: pnpm --fail-if-no-match --filter @opsweave/data-integration-web typecheck
      # Fails on a missing message key or a key built from a template literal.
      - run: node scripts/check-i18n.mjs
      # One status vocabulary: a wire code rendered as copy fails the build. It sits beside the
      # i18n gate because both answer the same question - what may a message say?
      - run: node scripts/check-status-vocabulary.mjs
      - run: node scripts/check-ui-tokens.mjs --ratchet docs/design/ui-visual-v3/spec/ui-debt.json
      # The token gate's own fail-closed properties: an off-scale spacing literal fails, an
      # on-scale one stays legal (code-rules B6), a budget key no rule emits is an error, and a
      # stylesheet that matches zero spacing declarations fails rather than passing.
      - run: node --test scripts/check-ui-tokens.test.mjs
      # No live file may name a retired path (rules/11). The pre-G14.2 web package was deleted in
      # 461d4da and eight executables kept building or serving it; pnpm exits 0 on a filter that
      # matches nothing, so four harnesses were green while building zero bundles. This check
      # fails closed on a missing scan root and prints its file count, so a pass cannot be vacuous.
      - run: node tests/ci/check-retired-paths.mjs
      # The retired-path gate's own counterfactuals. It allowed a fixed set of file
      # SUFFIXES, so every Dockerfile - which has none - was invisible to it, and
      # `deployments/staging/Dockerfile` kept building the deleted web package while
      # this gate reported zero references. The staging image only broke at merge
      # time, because no PR job builds it. One case here is that exact file shape.
      - run: node --test tests/ci/check-retired-paths.test.mjs
      # The geometry gate's own fail-closed properties: empty passes, dropped routes, missing
      # matrix combinations and duplicate passes.
      - run: node --test scripts/check-ui-metrics.test.mjs
      # The tracked audit artifacts are a real pass: every named route is present in each file.
      # The matrix command below is the one that checks the viewport/theme/locale combinations;
      # the route manifest deliberately has no such axis.
      - run: node scripts/check-ui-metrics.mjs --manifest docs/design/ui-visual-v3/spec/route-manifest.json artifacts/ui/visual-v3/audit
      - run: node scripts/check-ui-metrics.mjs --matrix docs/design/ui-visual-v3/spec/matrix-manifest.json artifacts/ui/observability/metrics
      - run: pnpm --fail-if-no-match --filter @opsweave/platform-console build
      - run: pnpm --fail-if-no-match --filter @opsweave/ops-web build
      - run: pnpm --fail-if-no-match --filter @opsweave/hello-web build
      - run: pnpm --fail-if-no-match --filter @opsweave/data-catalog-web build
      - run: pnpm --fail-if-no-match --filter @opsweave/data-integration-web build
      - run: node --check plugins/data-catalog/backend/server.mjs
      - run: node --check plugins/data-integration/backend/server.mjs
  # The vitest suites used to run nowhere: the web job
  # above only typechecks and builds, so a green pipeline never proved a unit test passed. It is
  # its own job so a red unit run is reported as such instead of hiding behind a build failure.
  web-unit:
    # ALWAYS RUNS - `web-unit` is a required context. See the note on `web`.
    # ALWAYS RUNS, and does NOT list `scope` in `needs`.
    #
    # Both halves matter, and the first fix missed the second. Removing the `if:`
    # made this job unconditional, but leaving `needs: [scope]` re-created the same
    # defect by another route: in GitHub Actions a job whose `needs` entry was
    # skipped or failed is ITSELF skipped. `scope` runs `git fetch`, `git diff` and
    # `node impact.mjs` under `set -euo pipefail` with a 5-minute timeout, so any
    # non-zero exit there would take `rust`, `web`, `web-unit` and
    # `platform-image-build` to `skipped` - four of the nine contexts ruleset
    # 26958761 requires - and the merge endpoint would answer
    # `9 of 9 required status checks are expected`.
    #
    # `scope` exists only to decide which of the NON-required heavy jobs run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --fail-if-no-match --filter @opsweave/platform-client test
      - run: pnpm --fail-if-no-match --filter @opsweave/ui test
      - run: pnpm --fail-if-no-match --filter @opsweave/platform-console test
      - run: pnpm --fail-if-no-match --filter @opsweave/ops-web test
  # The Zabbix plugin had no CI at all: package.json pointed at a server.test.mjs that did not
  # exist, and node --check does not resolve imports, so the server could not be proven to start.
  # This job binds a real socket and runs a real PostgreSQL, which is the only evidence that the
  # plugin's routes and storage work outside one workstation. Real Zabbix remains NOT_RUN.
  zabbix-plugin:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave_zabbix
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave_zabbix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPSWEAVE_TEST_PLUGIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/opsweave_zabbix
      # A persistence gate that skips when the database is missing is not a gate.
      OPSWEAVE_REQUIRE_PLUGIN_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix plugins/zabbix-source/backend
      - name: unit tests and the real HTTP socket suite
        run: node --test plugins/zabbix-source/backend/zabbix.test.mjs plugins/zabbix-source/backend/server.test.mjs tests/ci/g13a2_endpoint_attack.test.mjs
      - name: source and collection persistence against real PostgreSQL
        run: node --test plugins/zabbix-source/backend/storage.test.mjs
  # B2.1: the data plugins' identity boundary, driven over real sockets against
  # real plugin processes and a real PostgreSQL. The suite asserts the secure
  # behaviour (an unsigned role header authenticates nothing, a signed context is
  # bound to one plugin and one user) and asserts zero row side effects on every
  # refusal. It failed 6 of 7 tests on the pre-fix commit, which is the
  # reproduction this gate protects against recurring.
  b2-plugin-identity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave_b2_identity
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave_b2_identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPSWEAVE_TEST_PLUGIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/opsweave_b2_identity
      OPSWEAVE_REQUIRE_PLUGIN_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Every OCI image is built from its own backend context, so the identity
      # module is copied per plugin. The copies must stay byte-identical to the
      # canonical source or three security-critical implementations drift apart.
      - name: plugin identity modules match the canonical source
        run: node scripts/sync-plugin-identity.mjs --check
      - run: npm ci --prefix plugins/data-catalog/backend
      - run: npm ci --prefix plugins/data-integration/backend
      - name: identity attack and regression suite
        run: |
          node --test tests/ci/b2_plugin_identity_attack.test.mjs
          # Workspace isolation was written and never run. `check-spec-coverage.mjs`
          # could not see it because it only enumerated `*.spec.ts` and `*.sh`; once
          # `*.test.mjs` was added to that inventory this suite reported
          # NOT_REFERENCED. Same domain as the attack suite above - a plugin reading
          # across a workspace boundary - so it runs here rather than in a new job.
          node --test tests/ci/b2_workspace_isolation.test.mjs
  # The decomposed suites cannot prove a round trip: two implementations of the
  # same digest can both be wrong. This job starts a real Kernel, a real plugin
  # process and a real PostgreSQL, and checks that the bytes the plugin signed
  # are the bytes the Kernel verified, stored and served.
  g13a-roundtrip:
    if: ${{ needs.scope.outputs.acceptance == 'true' }}
    needs: [scope]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      G13A_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # One cache, shared by every job in this workflow.
      #
      # Thirteen jobs across the estate install a Rust toolchain and none cached
      # a compiled artifact, so each started with an empty `target/`. `shared-key`
      # is what makes them share: without it `Swatinem/rust-cache@v2` derives the
      # key from the job id (`add-job-id-key` defaults to true), and seven jobs
      # would write seven caches that never hit each other.
      #
      # The key also covers `Cargo.lock`, the workspace manifests, the toolchain
      # file and `.cargo/config.toml` via `add-rust-environment-hash-key`, so a
      # lockfile change invalidates it rather than silently reusing stale objects.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cargo build --locked -p opsweave-kernel
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix plugins/zabbix-source/backend
      - name: plugin bytes -> Kernel verification -> content read-back
        run: node tests/ci/g13a_evidence_roundtrip.mjs
  # The decomposed and two-process suites cannot prove a deployed plugin. This
  # job runs the production path: a real Kernel, a real Node runtime pulling the
  # OCI image, the Kernel Gateway, a real PostgreSQL and the browser. It builds
  # the UI under test from the #39 stack branch so the browser is the real
  # collect dialog, not a fixture. Upstream Zabbix is a local fixture and the
  # run says so; REAL_ZABBIX remains NOT_RUN.
  g13a1-gateway:
    if: ${{ needs.scope.outputs.acceptance == 'true' }}
    needs: [scope]
    runs-on: ubuntu-24.04
    env:
      OPSWEAVE_REGISTRY: 127.0.0.1:5001
      # The Node process (on the host) pulls the image; only the plugin
      # container needs the Docker bridge address for its DB/fixture calls.
      OPSWEAVE_PULL_REGISTRY: 127.0.0.1:5001
      OPSWEAVE_G13A1_PLUGIN_HOST: 172.17.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # One cache, shared by every job in this workflow.
      #
      # Thirteen jobs across the estate install a Rust toolchain and none cached
      # a compiled artifact, so each started with an empty `target/`. `shared-key`
      # is what makes them share: without it `Swatinem/rust-cache@v2` derives the
      # key from the job id (`add-job-id-key` defaults to true), and seven jobs
      # would write seven caches that never hit each other.
      #
      # The key also covers `Cargo.lock`, the workspace manifests, the toolchain
      # file and `.cargo/config.toml` via `add-rust-environment-hash-key`, so a
      # lockfile change invalidates it rather than silently reusing stale objects.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cargo build --locked -p opsweave-kernel -p opsweave-node -p opsweave-opsctl
      - run: ./target/debug/opsctl keygen --out-dir keys
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: npm ci --prefix plugins/zabbix-source/backend
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opsweave/ui-tests exec playwright install --with-deps chromium
      - name: build the UI under test from this commit
        run: |
          set -euo pipefail
          # The browser must come from the same tree as the Kernel, Node and
          # plugin. The old job pinned #39's SHA, so a green run said nothing
          # about the UI merged into main.
          pnpm --fail-if-no-match --filter @opsweave/platform-console build
          # The spec this job runs opens /app/incidents/<id>, which is the OPS
          # application. Without its bundle the kernel answers that path with the
          # console shell and the ops router is not mounted, so the page loads and
          # then 404s - the exact "page loaded, everything below it missing" shape.
          pnpm --fail-if-no-match --filter @opsweave/ops-web build
          rm -rf /tmp/g13a1-ui-dist /tmp/g13a1-ops-dist
          cp -R apps/platform-console/dist /tmp/g13a1-ui-dist
          cp -R apps/ops-web/dist /tmp/g13a1-ops-dist
      - name: local registry
        run: |
          set -euo pipefail
          docker run -d --name opsweave-g13a1-registry -p 5001:5000 registry:2
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5001/v2/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5001/v2/ >/dev/null
      - name: browser -> Gateway -> Node -> OCI plugin -> fixture
        run: bash tests/ci/g13a1_gateway_e2e.sh
  # G13-B1.4: the operator claim queue, over a real Kernel and a real PostgreSQL.
  # The incident row is a labelled FIXTURE (the exact state the Event handler writes);
  # the Event -> Job -> collect half needs Node/OCI/Zabbix and has its own gates.
  # Without this job the acceptance script would be a file nothing runs - the defect
  # tests/ci/check-spec-coverage.mjs exists to refuse.
  g13b14-claim:
    if: ${{ needs.scope.outputs.acceptance == 'true' }}
    needs: [scope]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave_b14
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave_b14"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPSWEAVE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/opsweave_b14
      OPSWEAVE_URL: http://127.0.0.1:18241
      OPSWEAVE_ADMIN_EMAIL: admin@opsweave.local
      OPSWEAVE_ADMIN_PASSWORD: 'OpsWeave!2026'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # One cache, shared by every job in this workflow.
      #
      # Thirteen jobs across the estate install a Rust toolchain and none cached
      # a compiled artifact, so each started with an empty `target/`. `shared-key`
      # is what makes them share: without it `Swatinem/rust-cache@v2` derives the
      # key from the job id (`add-job-id-key` defaults to true), and seven jobs
      # would write seven caches that never hit each other.
      #
      # The key also covers `Cargo.lock`, the workspace manifests, the toolchain
      # file and `.cargo/config.toml` via `add-rust-environment-hash-key`, so a
      # lockfile change invalidates it rather than silently reusing stale objects.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The browser must come from this commit: the queue panel is what the spec measures.
      - run: pnpm --fail-if-no-match --filter @opsweave/platform-console build
      - run: pnpm --fail-if-no-match --filter @opsweave/ops-web build
      - run: cargo build --locked -p opsweave-kernel
      - name: start the kernel on the throw-away database
        run: |
          set -euo pipefail
          rm -rf data-ci/g13b14 && mkdir -p data-ci/g13b14
          export OPSWEAVE_BIND=127.0.0.1:18241
          export OPSWEAVE_PUBLIC_URL="$OPSWEAVE_URL"
          export DATABASE_URL="$OPSWEAVE_DATABASE_URL"
          export OPSWEAVE_DATA_DIR="$PWD/data-ci/g13b14"
          export OPSWEAVE_WEB_DIST="$PWD/apps/platform-console/dist"
          export OPSWEAVE_OPS_WEB_DIST="$PWD/apps/ops-web/dist"
          export OPSWEAVE_BOOTSTRAP_ADMIN_EMAIL="$OPSWEAVE_ADMIN_EMAIL"
          export OPSWEAVE_BOOTSTRAP_ADMIN_PASSWORD="$OPSWEAVE_ADMIN_PASSWORD"
          export OPSWEAVE_BOOTSTRAP_ADMIN_NAME='Platform Admin'
          export RUST_LOG=info
          nohup ./target/debug/opsweave-kernel > data-ci/g13b14/kernel.log 2>&1 &
          for _ in $(seq 1 120); do
            curl -fsS "$OPSWEAVE_URL/livez" >/dev/null 2>&1 && exit 0
            sleep 0.5
          done
          echo "the kernel did not answer /livez" >&2
          tail -60 data-ci/g13b14/kernel.log >&2
          exit 1
      - name: operator claim queue over real HTTP
        run: bash tests/acceptance/g13_b14_claim.sh
      - run: pnpm --filter @opsweave/ui-tests exec playwright install --with-deps chromium
      - name: claim queue in a real browser at 1440 / 1024 / 390, light and dark
        env:
          OPSWEAVE_G13B14_OUT: ${{ github.workspace }}/artifacts/g13b14
        run: pnpm --filter @opsweave/ui-tests exec playwright test g13b14-claim.spec.ts
  # G13-B1.6: a committed Evidence effect survives the crash window between
  # "evidence committed" and "job success confirmed". The fixture row is the
  # exact state a crash leaves behind; the real Kernel worker must recover it
  # from the receipt without calling any plugin.
  g13b16-effect:
    if: ${{ needs.scope.outputs.acceptance == 'true' }}
    needs: [scope]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave_b16
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave_b16"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPSWEAVE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/opsweave_b16
      OPSWEAVE_URL: http://127.0.0.1:18242
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # One cache, shared by every job in this workflow.
      #
      # Thirteen jobs across the estate install a Rust toolchain and none cached
      # a compiled artifact, so each started with an empty `target/`. `shared-key`
      # is what makes them share: without it `Swatinem/rust-cache@v2` derives the
      # key from the job id (`add-job-id-key` defaults to true), and seven jobs
      # would write seven caches that never hit each other.
      #
      # The key also covers `Cargo.lock`, the workspace manifests, the toolchain
      # file and `.cargo/config.toml` via `add-rust-environment-hash-key`, so a
      # lockfile change invalidates it rather than silently reusing stale objects.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cargo build --locked -p opsweave-kernel
      - name: start the kernel (its worker loop is the system under test)
        run: |
          set -euo pipefail
          rm -rf data-ci/g13b16 && mkdir -p data-ci/g13b16
          export OPSWEAVE_BIND=127.0.0.1:18242
          export OPSWEAVE_PUBLIC_URL="$OPSWEAVE_URL"
          export DATABASE_URL="$OPSWEAVE_DATABASE_URL"
          export OPSWEAVE_DATA_DIR="$PWD/data-ci/g13b16"
          export OPSWEAVE_BOOTSTRAP_ADMIN_EMAIL=admin@opsweave.local
          export OPSWEAVE_BOOTSTRAP_ADMIN_PASSWORD='OpsWeave!2026'
          export OPSWEAVE_BOOTSTRAP_ADMIN_NAME='Platform Admin'
          export RUST_LOG=info
          nohup ./target/debug/opsweave-kernel > data-ci/g13b16/kernel.log 2>&1 &
          for _ in $(seq 1 120); do
            curl -fsS "$OPSWEAVE_URL/livez" >/dev/null 2>&1 && exit 0
            sleep 0.5
          done
          echo "the kernel did not answer /livez" >&2
          tail -60 data-ci/g13b16/kernel.log >&2
          exit 1
      - name: committed evidence survives the crash window
        run: bash tests/acceptance/g13_b16_effect.sh
  # G13-B1.7 part B: a persisted job survives the enqueue token's expiry, while
  # revocation and a disabled source stop it with a stable terminal reason. The
  # real Kernel worker loop is the system under test; no Node/Zabbix is used.
  g13b17-principal:
    if: ${{ needs.scope.outputs.acceptance == 'true' }}
    needs: [scope]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave_b17
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave_b17"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPSWEAVE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/opsweave_b17
      OPSWEAVE_URL: http://127.0.0.1:18243
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # One cache, shared by every job in this workflow.
      #
      # Thirteen jobs across the estate install a Rust toolchain and none cached
      # a compiled artifact, so each started with an empty `target/`. `shared-key`
      # is what makes them share: without it `Swatinem/rust-cache@v2` derives the
      # key from the job id (`add-job-id-key` defaults to true), and seven jobs
      # would write seven caches that never hit each other.
      #
      # The key also covers `Cargo.lock`, the workspace manifests, the toolchain
      # file and `.cargo/config.toml` via `add-rust-environment-hash-key`, so a
      # lockfile change invalidates it rather than silently reusing stale objects.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cargo build --locked -p opsweave-kernel
      - name: start the kernel (its worker loop is the system under test)
        run: |
          set -euo pipefail
          rm -rf data-ci/g13b17 && mkdir -p data-ci/g13b17
          export OPSWEAVE_BIND=127.0.0.1:18243
          export OPSWEAVE_PUBLIC_URL="$OPSWEAVE_URL"
          export DATABASE_URL="$OPSWEAVE_DATABASE_URL"
          export OPSWEAVE_DATA_DIR="$PWD/data-ci/g13b17"
          export OPSWEAVE_BOOTSTRAP_ADMIN_EMAIL=admin@opsweave.local
          export OPSWEAVE_BOOTSTRAP_ADMIN_PASSWORD='OpsWeave!2026'
          export OPSWEAVE_BOOTSTRAP_ADMIN_NAME='Platform Admin'
          export RUST_LOG=info
          nohup ./target/debug/opsweave-kernel > data-ci/g13b17/kernel.log 2>&1 &
          for _ in $(seq 1 120); do
            curl -fsS "$OPSWEAVE_URL/livez" >/dev/null 2>&1 && exit 0
            sleep 0.5
          done
          echo "the kernel did not answer /livez" >&2
          tail -60 data-ci/g13b17/kernel.log >&2
          exit 1
      - name: persisted jobs vs credential and authorization lifetime
        run: bash tests/acceptance/g13_b17_principal.sh
  # V3 brief §9: "截图不允许无上限提交 Git；仅保留精选基线，其余归档为 CI Artifact."
  # Nine runs of tests/ui/admin-polish.spec.ts accumulated 756 SHA-named screenshots (127.95 MB) of
  # the same seven admin pages because no job ever looked at what the index was carrying. The
  # capture specs still write into artifacts/ui/ - that is where they run from - and
  # .github/workflows/staging-preview.yml now archives those trees instead of leaving committing
  # them as the only way off the runner. This job is the gate: tests/ci/tracked-png-budget.json
  # holds the budget, and the guard also fails on a dangling doc reference, because a screenshot a
  # document cites is an evidence link. It needs no pnpm install - it only reads the git index.
  artifact-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/ci/check-tracked-png-budget.mjs
  # A spec that no workflow executes guarantees nothing, however correct it is; two defects
  # reached main through exactly that hole (tests/ui/g11-incident-slice.spec.ts asserted both and
  # was referenced by nothing). This job reads the command lines the workflows actually run and
  # the path filters that decide whether they run at all, so "wired in" and "editing it reruns the
  # job" are both checked. Its own known-unrun list is in the script, with a reason per entry.
  spec-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/ci/check-spec-coverage.mjs
      # "Which suites does this change require" is answered twice - by
      # tests/ci/impact.mjs (read after the run) and by each workflow's
      # `pull_request.paths` (read before it). When the analyzer requires a suite
      # whose workflow the filter never starts, no check is ever produced, so
      # nothing can be red and `ci-gate` reports the suite delegated. This fails
      # that case where it is introduced rather than after a wasted round trip.
      - name: The impact analyzer and the workflow path filters agree
        run: node tests/ci/check-impact-consistency.mjs
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
      # See .github/workflows/ci.yml's other jobs: `shared-key` replaces the
      # job-based key so this job reads the workspace cache instead of writing one
      # nobody reads.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - run: pip install jsonschema pyyaml
      # Build one real signed bundle BEFORE validating. Without this the validator
      # takes its `else` branch and prints "(no dist/plugins yet; bundle checks
      # skipped)", which is what it has done for the life of this job: the digest
      # comparisons it contains had never executed in CI. That message reads like
      # a benign note, which is why the gap survived an audit round.
      #
      # No Docker, no registry, no OCI push: `assemble_plugin.py` is pure Python,
      # the web assets ship in the tree, and `opsctl bundle` signs with a key
      # generated here. The real packer (`scripts/build-plugins.sh`) still runs in
      # `plugin-lifecycle.yml`; this proves the validator's own checks run and can
      # fail, not that the packer is correct.
      - name: Build a bundle, so the bundle checks actually run
        run: scripts/contract-bundle-fixture.sh
      - run: python3 tests/contract/validate_contracts.py
      # The validator's failure paths, against the bundle just built. A check that
      # has never been observed to fail is not known to be a check.
      - name: The bundle checks can fail
        run: python3 tests/contract/test_bundle_validation.py

  # P001-A: the platform-only boundary is a claim until something boots it.
  #
  # Why this is its own job and not a line in `rust`: the `rust` job builds the
  # DEFAULT features, so it cannot observe a build that excludes the Ops
  # application. Without this, a change that reintroduced a `crate::incidents`
  # reference in Core - or that left a business route mounted - would compile and
  # pass every other job, and the platform-only release would be broken on the day
  # someone tried to ship it.
  #
  # It runs against a real PostgreSQL because two of the assertions below are about
  # what the binary does at startup and what it answers over HTTP, not about what
  # it compiles to.
  platform-only:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsweave
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsweave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # One cache, shared by every job in this workflow.
      #
      # Thirteen jobs across the estate install a Rust toolchain and none cached
      # a compiled artifact, so each started with an empty `target/`. `shared-key`
      # is what makes them share: without it `Swatinem/rust-cache@v2` derives the
      # key from the job id (`add-job-id-key` defaults to true), and seven jobs
      # would write seven caches that never hit each other.
      #
      # The key also covers `Cargo.lock`, the workspace manifests, the toolchain
      # file and `.cargo/config.toml` via `add-rust-environment-hash-key`, so a
      # lockfile change invalidates it rather than silently reusing stale objects.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      # The console bundle is a *configuration input* to this job, not its
      # subject: the probe asserts the console shell is still served from a
      # platform-only binary. Building it here keeps the job self-contained
      # instead of depending on another job's artifacts.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Both bundles: the light-build probe needs the console, and the
      # full-product probe needs the ops shell to prove /app is served BY it.
      # Building only the console is what made the full-product step fail with
      # `cp: cannot stat 'apps/ops-web/dist'` on its first CI run.
      - run: |
          set -eu
          pnpm --fail-if-no-match --filter @opsweave/platform-console build
          pnpm --fail-if-no-match --filter @opsweave/ops-web build
      - name: Build both feature sets
        run: |
          set -eu
          cargo build --locked -p opsweave-kernel
          cargo build --locked -p opsweave-kernel --no-default-features
      - name: Lint both feature sets
        run: |
          set -eu
          cargo clippy --locked -p opsweave-kernel --all-targets -- -D warnings
          cargo clippy --locked -p opsweave-kernel --no-default-features --all-targets -- -D warnings
      # P001-B.2 A1/A2: the installer must never put a credential in a process
      # argument. The guard is static plus executed, and it FAILS against the
      # shape it forbids (it caught a real leak and its own false negative while
      # being written), so a pass here is not vacuous.
      - name: Installer credential handling
        run: bash tests/ci/p001_credential_argv.sh
      # The two upgrade behaviours the review named: a mutable tag must never be
      # satisfied by a local copy, and an unhealthy node must yield DEGRADED
      # rather than a complete success. Source-shaped here; the live behaviour is
      # asserted in platform-linux-acceptance where a daemon and two images exist.
      - name: Installer upgrade behaviour
        run: bash tests/ci/p001_upgrade_behaviour.sh
      # P001-C1 D1: `rollback` used to return a success-shaped 200 after only
      # redeploying, so the route never moved and the operator had to run it a
      # second time. Both halves are asserted: the Kernel now reports that it did
      # not activate, and opsctl finishes the job. Verified to fail when either
      # is reverted.
      - name: Rollback must activate, or say it did not
        run: bash tests/ci/p001c_rollback_activates.sh
      - name: Test both feature sets
        env:
          OPSWEAVE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/opsweave
          OPSWEAVE_REQUIRE_TEST_DATABASE: "1"
        run: |
          set -eu
          cargo test --locked -p opsweave-kernel
          cargo test --locked -p opsweave-kernel --no-default-features
      # The binary is the evidence. A route that is merely "not linked into the UI"
      # still answers; these probes are what tell the difference.
      - name: Boot the platform-only binary and probe its boundary
        run: |
          set -eu
          cargo build -q --locked -p opsweave-kernel --no-default-features
          mkdir -p /tmp/p001/data

          # Generated, exported, and never printed. It has to be a shell variable
          # rather than a per-command prefix: a prefix applies only to that one
          # command, so the later login read would see it unset (and `set -u`
          # makes that a hard failure, which is how this step first broke).
          ADMIN_EMAIL=platform-only@example.invalid
          ADMIN_PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -d '/+=')"
          export OPSWEAVE_BOOTSTRAP_ADMIN_EMAIL="$ADMIN_EMAIL"
          export OPSWEAVE_BOOTSTRAP_ADMIN_PASSWORD="$ADMIN_PASSWORD"
          export OPSWEAVE_BIND=127.0.0.1:19081 \
                 OPSWEAVE_DATA_DIR=/tmp/p001/data \
                 DATABASE_URL='postgres://postgres:postgres@127.0.0.1:5432/opsweave?sslmode=disable' \
                 OPSWEAVE_WEB_DIST=apps/platform-console/dist
          ./target/debug/opsweave-kernel > /tmp/p001/kernel.log 2>&1 &
          echo $! > /tmp/p001/kernel.pid
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:19081/livez >/dev/null 2>&1 && break
            sleep 0.5
          done
          status() { curl -sS -o /dev/null -w '%{http_code}' "$@"; }
          B=http://127.0.0.1:19081

          fail() { echo "::error::$1"; echo "--- kernel log ---"; tail -50 /tmp/p001/kernel.log; exit 1; }

          # The platform's own surface must be present.
          [ "$(status "$B/livez")" = "200" ]        || fail "/livez is not 200 on a platform-only build"
          [ "$(status "$B/api/v1/version")" = "200" ] || fail "/api/v1/version is not 200"
          [ "$(status "$B/")" = "200" ]             || fail "the console shell is not served"
          [ "$(status "$B/admin/overview")" = "200" ] || fail "a console route is not served"

          # The business surface must be absent, and must SAY it is absent rather
          # than pretending the caller lacks a permission.
          [ "$(status -X POST "$B/api/v1/telemetry/events")" = "404" ] \
            || fail "the event ingest route still answers on a platform-only build"
          body=$(curl -sS -X POST "$B/api/v1/telemetry/events")
          case "$body" in
            *BUSINESS_ROUTE_NOT_BUILT*) ;;
            *) fail "the ingest 404 does not carry BUSINESS_ROUTE_NOT_BUILT: $body" ;;
          esac

          # `/app` is the Ops application's prefix. Answering it with the console
          # shell renders a page that owns none of its routes.
          [ "$(status "$B/app/incidents")" = "404" ] || fail "/app/incidents is not 404"
          [ "$(status "$B/app")" = "404" ]           || fail "/app is not 404"

          # No business worker ran. The line is emitted by automation_worker::spawn.
          if grep -q "automation job worker" /tmp/p001/kernel.log; then
            fail "the automation worker started on a platform-only build"
          fi

          # The registered application the binary cannot serve must not be
          # advertised. Login first: the registry read requires a session.
          jar=/tmp/p001/jar
          curl -sS -c "$jar" -X POST -H 'content-type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            "$B/api/v1/auth/login" >/dev/null || fail "the bootstrap admin could not sign in"
          apps=$(curl -sS -b "$jar" "$B/api/v1/applications")
          case "$apps" in
            *opsweave.ops*) fail "opsweave.ops is advertised by a platform-only build: $apps" ;;
          esac
          case "$apps" in
            *opsweave.console*) ;;
            *) fail "opsweave.console is missing from the registry: $apps" ;;
          esac

          kill "$(cat /tmp/p001/kernel.pid)" 2>/dev/null || true
          echo "platform-only boundary verified"

      # `platform-linux-acceptance` is a required check on `main`. A required
      # check that is path-filtered never reports on a PR that does not match,
      # and GitHub then holds the merge at "Expected - Waiting for status to be
      # reported" forever. This guard exists so the filter cannot come back
      # quietly: it caught the old one, which fired on `deployments/platform/**`
      # but not on `apps/**`, so a kernel change was never exercised while a
      # README edit was.
      - name: The Linux acceptance workflow must run on every pull request
        run: |
          set -eu
          python3 - <<'PY'
          import sys, yaml

          path = ".github/workflows/platform-linux-acceptance.yml"
          doc = yaml.safe_load(open(path))
          key = next((k for k in doc if str(k).lower() in ("on", "true")), None)
          if key is None:
              sys.exit(f"{path}: no trigger block")
          triggers = doc[key]

          if not isinstance(triggers, dict) or "pull_request" not in triggers:
              sys.exit(f"{path}: pull_request is not a trigger")

          pr = triggers["pull_request"]
          if isinstance(pr, dict):
              for forbidden in ("paths", "paths-ignore"):
                  if forbidden in pr:
                      sys.exit(
                          f"{path}: pull_request has a `{forbidden}` filter. "
                          "A path-filtered workflow cannot be a required check: "
                          "it never reports on a non-matching PR, and the merge "
                          "stays blocked at 'Expected'. See the trigger comment."
                      )

          print("pull_request runs unconditionally")
          PY

      # The mirror assertion, and the one whose absence let a real regression ship.
      #
      # Run 42791913396 deployed a STAGING image that answered `/app` with 404,
      # because `deployments/staging/Dockerfile` ends with the platform target and
      # Docker builds the last stage by default. Nothing in CI noticed: the probe
      # above only ever builds `--no-default-features`, so "the full product still
      # serves the Ops application" had no gate at all.
      #
      # Both halves are needed. A boundary is only correct if the light build
      # refuses the prefix AND the heavy build serves it; asserting one direction
      # is how the other one broke.
      - name: Boot the full product binary and prove the Ops prefix is served
        run: |
          set -eu
          cargo build -q --locked -p opsweave-kernel
          rm -rf /tmp/p001full && mkdir -p /tmp/p001full/data
          cp -r apps/platform-console/dist /tmp/p001full/web
          cp -r apps/ops-web/dist /tmp/p001full/ops-web

          ADMIN_EMAIL=full-product@example.invalid
          ADMIN_PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -d '/+=')"
          export OPSWEAVE_BOOTSTRAP_ADMIN_EMAIL="$ADMIN_EMAIL"
          export OPSWEAVE_BOOTSTRAP_ADMIN_PASSWORD="$ADMIN_PASSWORD"
          export OPSWEAVE_BIND=127.0.0.1:19082 \
                 OPSWEAVE_DATA_DIR=/tmp/p001full/data \
                 DATABASE_URL='postgres://postgres:postgres@127.0.0.1:5432/opsweave?sslmode=disable' \
                 OPSWEAVE_WEB_DIST=/tmp/p001full/web \
                 OPSWEAVE_OPS_WEB_DIST=/tmp/p001full/ops-web
          ./target/debug/opsweave-kernel > /tmp/p001full/kernel.log 2>&1 &
          echo $! > /tmp/p001full/kernel.pid
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:19082/livez >/dev/null 2>&1 && break
            sleep 0.5
          done
          status() { curl -sS -o /dev/null -w '%{http_code}' "$@"; }
          B=http://127.0.0.1:19082
          fail() { echo "::error::$1"; echo "--- kernel log ---"; tail -50 /tmp/p001full/kernel.log; exit 1; }

          # The Ops application's prefix must be served by the full product - and
          # it must be served BY THE OPS BUNDLE. A status check alone cannot tell:
          # `/app` is also in the console's client-route table, so a console-only
          # image answers 200 with the WRONG shell, and that is exactly the state
          # the staging regression shipped. Distinguish on the shell's own script
          # path, which is built with `base: '/app/'` in the ops bundle.
          for path in /app /app/home /app/incidents; do
            [ "$(status "$B$path")" = "200" ] || fail "$path is not 200 on the full product build"
            shell=$(curl -sS "$B$path")
            case "$shell" in
              */app/assets/*) ;;
              *) fail "$path was not served by the ops bundle (no /app/assets script in the shell)" ;;
            esac
          done

          # And its API must exist: a 404 with BUSINESS_ROUTE_NOT_BUILT here would
          # mean the route table was gated the wrong way round.
          body=$(curl -sS -X POST "$B/api/v1/telemetry/events")
          case "$body" in
            *BUSINESS_ROUTE_NOT_BUILT*) fail "the full product build reports the ingest route as not built" ;;
          esac

          # The console is still the console on both builds.
          [ "$(status "$B/admin/overview")" = "200" ] || fail "a console route is not served by the full product build"

          kill "$(cat /tmp/p001full/kernel.pid)" 2>/dev/null || true
          echo "full-product boundary verified"

  # P001-B.1: the platform image is a delivery artifact, and until now nothing
  # built it. `platform-only` proves the BINARY boundary; this proves the IMAGE -
  # what an operator pulls, its contents, and that it boots.
  #
  # It also guards the dependency direction the Dockerfile got wrong: the
  # platform target used to wait on a full-product web build and a full-product
  # Rust build, so a broken ops-web or pipeline-worker failed a target that ships
  # neither. The sabotage step below is that regression's counterfactual, and it
  # is the reason this job exists rather than a `docker build` one-liner.
  platform-image-build:
    # ALWAYS RUNS - `platform-image-build` is a required context. See the note on
    # `web`. `runtime-image-build` below is NOT a required context, so gating that
    # one stays safe and keeps its ~5 minutes off a docs-only change.
    # ALWAYS RUNS, and does NOT list `scope` in `needs`.
    #
    # Both halves matter, and the first fix missed the second. Removing the `if:`
    # made this job unconditional, but leaving `needs: [scope]` re-created the same
    # defect by another route: in GitHub Actions a job whose `needs` entry was
    # skipped or failed is ITSELF skipped. `scope` runs `git fetch`, `git diff` and
    # `node impact.mjs` under `set -euo pipefail` with a 5-minute timeout, so any
    # non-zero exit there would take `rust`, `web`, `web-unit` and
    # `platform-image-build` to `skipped` - four of the nine contexts ruleset
    # 26958761 requires - and the merge endpoint would answer
    # `9 of 9 required status checks are expected`.
    #
    # `scope` exists only to decide which of the NON-required heavy jobs run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the platform-only image
        run: |
          set -eu
          docker build -f deployments/staging/Dockerfile --target platform \
            -t opsweave-platform:ci .
      - name: Assert the image boundary
        run: |
          set -eu
          IMG=opsweave-platform:ci
          fail() { echo "::error::$1"; exit 1; }

          # What must be present.
          for bin in opsweave-kernel opsweave-node opsctl docker; do
            docker run --rm --entrypoint /bin/sh "$IMG" -c "test -x /usr/local/bin/$bin" \
              || fail "the image is missing /usr/local/bin/$bin"
          done
          docker run --rm --entrypoint /bin/sh "$IMG" -c 'test -f /app/web/index.html' \
            || fail "the platform console bundle is missing"

          # What must be absent. Each of these is the Ops application's.
          for path in /usr/local/bin/opsweave-pipeline-worker /app/ops-web; do
            if docker run --rm --entrypoint /bin/sh "$IMG" -c "test -e $path"; then
              fail "$path is present in a platform-only image"
            fi
          done
          envs="$(docker image inspect "$IMG" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          case "$envs" in
            *OPSWEAVE_OPS_WEB_DIST*) fail "OPSWEAVE_OPS_WEB_DIST is set in a platform-only image" ;;
          esac

          # The kernel must be the platform-only build. Asserted on the binary,
          # not on a label: a label is a claim, the binary is the thing.
          cid="$(docker create "$IMG")"
          docker cp "$cid:/usr/local/bin/opsweave-kernel" /tmp/kernel
          docker rm "$cid" >/dev/null
          if ! strings /tmp/kernel | grep -q "BUSINESS_ROUTE_NOT_BUILT"; then
            fail "the kernel in the image is not a platform-only build"
          fi
          if strings /tmp/kernel | grep -q "opsweave.ops/incidents"; then
            fail "the kernel in the image still contains the Ops application routes"
          fi
      - name: The image boots and serves the console
        run: |
          set -eu
          IMG=opsweave-platform:ci
          docker network create p001 || true
          docker run -d --name p001-pg --network p001 \
            -e POSTGRES_DB=opsweave -e POSTGRES_USER=opsweave -e POSTGRES_PASSWORD=ci-pass \
            postgres:17
          for _ in $(seq 1 60); do
            docker exec p001-pg pg_isready -U opsweave -d opsweave >/dev/null 2>&1 && break
            sleep 1
          done
          # A shared user network with a published port, NOT host networking.
          # The deployment uses host networking because a Node must reach the
          # Kernel on loopback, but that is not what this job is testing - it is
          # testing that the image boots and enforces its boundary. A published
          # port works identically on a Linux runner and on a developer's Docker
          # Desktop, where host networking is not reachable from the host at all
          # (found locally while writing this gate).
          docker run -d --name p001-kernel --network p001 -p 19081:19081 \
            -e DATABASE_URL="postgres://opsweave:ci-pass@p001-pg:5432/opsweave?sslmode=disable" \
            -e OPSWEAVE_BIND=0.0.0.0:19081 \
            -e OPSWEAVE_DATA_DIR=/app/data \
            -e OPSWEAVE_WEB_DIST=/app/web \
            -e OPSWEAVE_BOOTSTRAP_ADMIN_EMAIL=ci@example.invalid \
            -e OPSWEAVE_BOOTSTRAP_ADMIN_PASSWORD=ci-only-not-a-secret \
            "$IMG"
          # No host bind mount for /app/data: a bind-mounted host directory is
          # root-owned, the image runs as uid 10001, and the Kernel then dies with
          # "create package store directory: Permission denied" - which is exactly
          # how this step first failed on the runner. The container gets its own
          # writable path instead; the volume semantics are the install profile's
          # subject, not this boot test's.
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:19081/livez >/dev/null 2>&1 && break
            sleep 1
          done
          code() { curl -sS -o /dev/null -w '%{http_code}' "$@"; }
          [ "$(code http://127.0.0.1:19081/livez)" = "200" ] || { docker logs p001-kernel; exit 1; }
          [ "$(code http://127.0.0.1:19081/readyz)" = "200" ] || { docker logs p001-kernel; exit 1; }
          # The boundary, on the running image.
          [ "$(code http://127.0.0.1:19081/app)" = "404" ] || { echo "::error::/app is not 404"; docker logs p001-kernel; exit 1; }
          body="$(curl -sS -X POST http://127.0.0.1:19081/api/v1/telemetry/events)"
          case "$body" in
            *BUSINESS_ROUTE_NOT_BUILT*) ;;
            *) echo "::error::ingest is not reported as not-built: $body"; exit 1 ;;
          esac
          # And the console, which is what the platform IS for.
          [ "$(code http://127.0.0.1:19081/admin/overview)" = "200" ] || { echo "::error::the console is not served"; exit 1; }
          docker logs p001-kernel | tail -5
      - name: The platform target does not depend on the business build
        run: |
          set -eu
          # The counterfactual for the dependency inversion. If the platform target
          # still waited on ops-web or the pipeline worker, one of these builds
          # would fail here - which is exactly how the split was verified.
          echo "export const BROKEN = ;" >> apps/ops-web/src/main.tsx
          echo "fn broken( {" >> apps/pipeline-worker/src/main.rs
          docker build -f deployments/staging/Dockerfile --target platform \
            -t opsweave-platform:ci-sabotage . \
            || { echo "::error::the platform image depends on business code it does not ship"; exit 1; }
          echo "the platform target built with the business application deliberately broken"

  # The FULL product image, on every pull request.
  #
  # WHY THIS IS A SEPARATE JOB FROM `platform-image-build`
  #
  # `deployments/staging/Dockerfile` has two final stages. `platform` ships the
  # kernel with no business features; `runtime` ships the FULL kernel plus
  # `opsweave-pipeline-worker` and the ops-web bundle. The second one is what
  # staging actually deploys, and until this job existed it was built in exactly
  # one place: `staging-preview.yml`, which has no `pull_request` trigger. So a
  # change that broke the full kernel - a new dependency the release profile
  # cannot link, a feature the platform-only build compiles out, a missing
  # pipeline-worker binary - could merge with every required check green and
  # fail on the first deploy.
  #
  # That is a coverage gap, not an optimisation: the two targets compile
  # different feature sets, and `cargo test --locked --workspace` builds neither
  # of them in release mode.
  #
  # WHAT IT ASSERTS, and why each assertion exists
  #
  #   present   the four binaries and BOTH web bundles. `platform-image-build`
  #             asserts ops-web and the pipeline worker are ABSENT from its
  #             image; this one asserts they are present in this one. Two jobs,
  #             opposite assertions, one Dockerfile - which is what makes the
  #             stage split a tested boundary rather than a comment.
  #   boots     /livez, /readyz, /admin/overview (the platform console),
  #             /app (the ops web app) and /api/v1/version, with the served
  #             revision matching the commit. A 200 from each is not enough:
  #             the console assertion reads the HTML for the app's own mount, so
  #             an empty index.html fails.
  #   distinct  the kernel here must NOT be the platform-only build. The
  #             platform job greps its kernel for `BUSINESS_ROUTE_NOT_BUILT` and
  #             requires it; this job requires that string to be ABSENT and the
  #             ingest route to work instead. Without this pair, both images
  #             could ship the same kernel and both jobs would pass.
  runtime-image-build:
    if: ${{ needs.scope.outputs.image-build == 'true' }}
    needs: [scope]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the full runtime image
        run: |
          set -eu
          docker build -f deployments/staging/Dockerfile --target runtime \
            --build-arg OPSWEAVE_VERSION_OVERRIDE="" \
            -t opsweave-runtime:ci .
      - name: Assert the image contains the whole product
        run: |
          set -eu
          IMG=opsweave-runtime:ci
          fail() { echo "::error::$1"; exit 1; }

          for bin in opsweave-kernel opsweave-node opsctl opsweave-pipeline-worker; do
            docker run --rm --entrypoint /bin/sh "$IMG" -c "test -x /usr/local/bin/$bin" \
              || fail "the runtime image is missing /usr/local/bin/$bin"
          done
          # BOTH bundles: the platform console and the ops web app. They are
          # separate Vite builds with separate mounts (/admin vs /app).
          docker run --rm --entrypoint /bin/sh "$IMG" -c 'test -f /app/web/index.html' \
            || fail "the platform console bundle is missing from the runtime image"
          docker run --rm --entrypoint /bin/sh "$IMG" -c 'test -f /app/ops-web/index.html' \
            || fail "the ops web bundle is missing from the runtime image"
          envs="$(docker image inspect "$IMG" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          case "$envs" in
            *OPSWEAVE_OPS_WEB_DIST=/app/ops-web*) ;;
            *) fail "OPSWEAVE_OPS_WEB_DIST does not point at /app/ops-web: $envs" ;;
          esac

          # The kernel must be the FULL build, which is the exact inverse of the
          # assertion in platform-image-build. `--no-default-features` is what
          # compiles the business routes out, and it stamps
          # BUSINESS_ROUTE_NOT_BUILT into the refusal path.
          cid="$(docker create "$IMG")"
          docker cp "$cid:/usr/local/bin/opsweave-kernel" /tmp/full-kernel
          docker rm "$cid" >/dev/null
          if strings /tmp/full-kernel | grep -q "BUSINESS_ROUTE_NOT_BUILT"; then
            fail "the kernel in the runtime image is a platform-only build"
          fi
      - name: The image boots and serves both applications
        run: |
          set -eu
          IMG=opsweave-runtime:ci
          docker network create p001full || true
          docker run -d --name p001full-pg --network p001full \
            -e POSTGRES_DB=opsweave -e POSTGRES_USER=opsweave -e POSTGRES_PASSWORD=ci-pass \
            postgres:17
          for _ in $(seq 1 60); do
            docker exec p001full-pg pg_isready -U opsweave -d opsweave >/dev/null 2>&1 && break
            sleep 1
          done
          docker run -d --name p001full-kernel --network p001full -p 19082:19081 \
            -e DATABASE_URL="postgres://opsweave:ci-pass@p001full-pg:5432/opsweave?sslmode=disable" \
            -e OPSWEAVE_BIND=0.0.0.0:19081 \
            -e OPSWEAVE_DATA_DIR=/app/data \
            -e OPSWEAVE_WEB_DIST=/app/web \
            -e OPSWEAVE_OPS_WEB_DIST=/app/ops-web \
            -e OPSWEAVE_BOOTSTRAP_ADMIN_EMAIL=ci@example.invalid \
            -e OPSWEAVE_BOOTSTRAP_ADMIN_PASSWORD=ci-only-not-a-secret \
            "$IMG"
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:19082/livez >/dev/null 2>&1 && break
            sleep 1
          done
          code() { curl -sS -o /dev/null -w '%{http_code}' "$@"; }
          body() { curl -sS "$@"; }
          [ "$(code http://127.0.0.1:19082/livez)" = "200" ] || { docker logs p001full-kernel; exit 1; }
          [ "$(code http://127.0.0.1:19082/readyz)" = "200" ] || { docker logs p001full-kernel; exit 1; }

          # Both front-ends. Not "HTTP 200 means it works": each assertion reads
          # the response for something only a real build of THAT app contains.
          [ "$(code http://127.0.0.1:19082/admin/overview)" = "200" ] \
            || { echo "::error::the platform console is not served"; docker logs p001full-kernel; exit 1; }
          [ "$(code http://127.0.0.1:19082/app)" = "200" ] \
            || { echo "::error::the ops web app is not served on /app"; docker logs p001full-kernel; exit 1; }
          console_html="$(body http://127.0.0.1:19082/admin/overview)"
          case "$console_html" in
            *'<div id="root"'*|*'<div id=root'*) ;;
            *) echo "::error::/admin/overview is not a built console shell: $(printf '%s' "$console_html" | head -c 300)"; exit 1 ;;
          esac
          app_html="$(body http://127.0.0.1:19082/app)"
          case "$app_html" in
            *'<div id="root"'*|*'<div id=root'*) ;;
            *) echo "::error::/app is not a built ops-web shell: $(printf '%s' "$app_html" | head -c 300)"; exit 1 ;;
          esac
          # And they must not be the same document served twice.
          if [ "$console_html" = "$app_html" ]; then
            echo "::error::/admin/overview and /app served identical bytes; the two bundles are not distinct"
            exit 1
          fi

          # The business route the platform image refuses must work here.
          ingest_code="$(curl -sS -o /tmp/ingest.json -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -d '{"events":[]}' \
            http://127.0.0.1:19082/api/v1/telemetry/events || true)"
          if [ "$ingest_code" = "404" ] && grep -q BUSINESS_ROUTE_NOT_BUILT /tmp/ingest.json 2>/dev/null; then
            echo "::error::the runtime image refuses the ingest route as not-built; it is a platform-only kernel"
            exit 1
          fi
          echo "ingest route answered $ingest_code (not the platform-only refusal)"

          # /api/v1/version answers with exactly five fields and does not leak
          # the database URL, the data directory, or any env var.
          #
          # It deliberately does NOT assert commitSha == GITHUB_SHA, and that is
          # worth writing down because it was the first version of this step.
          # `OPSWEAVE_BUILD_SHA` is an ENVIRONMENT variable the deploy script
          # exports (scripts/deploy-staging.sh:418, deployments/staging/compose.yaml:110),
          # not a build-time fact baked into the image. In a bare `docker run` it
          # is unset and the endpoint truthfully reports `"commitSha":null` -
          # measured on this image. Asserting the sha here would have forced the
          # Dockerfile to bake in a claim the build cannot verify, which is the
          # opposite of what the assertion was for. The served-commit check lives
          # where the value exists: scripts/deploy-staging.sh:1059.
          served="$(body http://127.0.0.1:19082/api/v1/version)"
          for field in version commitSha buildTime environment startedAt; do
            case "$served" in
              *"\"$field\":"*) ;;
              *) echo "::error::/api/v1/version is missing $field: $served"; exit 1 ;;
            esac
          done
          case "$served" in
            *sslmode*|*postgres://*|*OPSWEAVE_DATA_DIR*) echo "::error::/api/v1/version leaks configuration: $served"; exit 1 ;;
          esac
          docker logs p001full-kernel | tail -5

  # The merge gate.
  #
  # WHY THIS JOB EXISTS, AND WHY IT IS NOT A SCRIPT IN ANOTHER WORKFLOW
  #
  # Seven of the nine required checks are produced by this workflow. The other
  # two - `linux-runtime` and `quality-faults` - are produced by two more
  # workflows that trigger on every PR with no path filter.
  #
  # A gate that aggregated all nine would have to wait for other workflow runs.
  # `needs:` cannot do that, and a `workflow_run`-based aggregator cannot detect
  # "another workflow was skipped by its path filter" - the event simply never
  # fires, so "all dependencies finished" is not a state it can observe. Writing
  # that gate anyway is the specific failure the CI overhaul brief forbids.
  #
  # So this gate is honest about its scope: it decides on the jobs it can see,
  # which are exactly the seven required checks this workflow owns plus every
  # non-required job here. `linux-runtime` and `quality-faults` remain directly
  # enforced by the branch ruleset, as they are today. Nothing is claimed that is
  # not checked.
  #
  # WHAT MAKES IT A GATE RATHER THAN A SUMMARY
  #
  # `if: always()` so it runs even when a dependency failed - a gate that does not
  # run when things break is a gate that passes when things break.
  #
  # It receives `needs` verbatim and decides, rather than letting GitHub's default
  # "a failed need fails the job" be the whole story. The difference matters:
  # a SKIPPED required job does not fail its dependent by default, and `skipped`
  # is what a path filter or a bad `if:` produces.
  #
  # The decision logic is tests/ci/ci-gate.mjs, with `--selftest` covering the
  # three ways this kind of gate lies (skipped counted as pass, required job not
  # wired, cancelled counted as pass).
  ci-gate:
    runs-on: ubuntu-24.04
    # 45 minutes: the wait budget (35) plus the rest of the step (~1) plus a
    # quarter-hour of headroom. 40 was measured to leave only 240 s of slack
    # against a 2100 s budget, which is not enough for a slow checkout or an API
    # retry storm - and a job killed by its own timeout reports as `cancelled`,
    # which is a worse failure than a timeout with a reason.
    #
    # The relationship that must hold:
    #   job timeout  >  GATE_BUDGET_MS  +  (checkout + ledger reads)
    # 2700 s     >  2100 s          +  ~60-120 s, with margin.
    #
    # The gate now WAITS for the suites other workflows produce instead of reading
    # whatever happened to exist when it started. The budget is 30 minutes
    # (`DEFAULT_BUDGET_MS`), derived from measured p95: data-foundation.yml is
    # 1530 s, plugin-lifecycle.yml 1174 s. A job timeout below the wait budget
    # would kill the gate mid-wait and report a cancelled check, which is a
    # different and less useful failure than a timeout with a reason.
    timeout-minutes: 45
    if: always()
    # `checks: read` is what lets this job stop taking the other workflows on
    # faith. It queries the check runs on THIS commit - by name, AND by the
    # workflow that produced them - so a suite the impact analyzer requires whose
    # workflow never started produces "absent" instead of a silent pass, and a
    # check by the wrong workflow cannot be credited to the right one.
    # `actions: read` is for the second half of that: check runs carry a
    # check_suite id, and only the workflow-runs endpoint says which workflow a
    # check_suite belongs to.
    # Read-only; the workflow-level default is `contents: read`.
    permissions:
      contents: read
      checks: read
      actions: read
    needs:
      - scope
      - lint
      - rust
      - web
      - web-unit
      - contracts
      - spec-coverage
      - platform-only
      - platform-image-build
      - runtime-image-build
      - zabbix-plugin
      - b2-plugin-identity
      - g13a-roundtrip
      - g13a1-gateway
      - g13b14-claim
      - g13b16-effect
      - g13b17-principal
      - artifact-budget
    steps:
      - uses: actions/checkout@v4
        with:
          # `git diff` against the merge base needs history, not a shallow tip.
          fetch-depth: 0
      - name: Decide
        env:
          NEEDS: ${{ toJSON(needs) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # The delegated-wait budget. 35 minutes, not 30.
          #
          # Measured 2026-11-19 over the 16 most recent completed data-foundation
          # runs: p50 1476 s, **p95 2040 s**, max 2040 s. A 30-minute budget is
          # below that p95, so a healthy run would time the gate out and fail the
          # PR - the exact failure mode the budget exists to avoid.
          #
          # The value is `vars.` so it can be raised without a commit, and this is
          # the wiring that was missing: `--budget-ms "${GATE_BUDGET_MS:-...}"`
          # appeared in the run block but nothing ever set the variable, so the
          # default was the only value it could take.
          GATE_BUDGET_MS: ${{ vars.OPSWEAVE_GATE_BUDGET_MS || '2100000' }}
        run: |
          set -euo pipefail
          # The files this commit changed.
          #
          # Pull request: from the merge base, not from `origin/main`, which may
          # have moved and would attribute other people's changes to this PR.
          #
          # Push: from the commit itself. A merge to `main` is a squash, so the
          # commit's own diff IS the change set - exactly what GitHub's path
          # filters see when they decide which workflows to start.
          #
          # WHY THE PUSH CASE MATTERS, and why it used to fail closed:
          # before this, a push had no `BASE_SHA`/`HEAD_SHA`, `CHANGED` came back
          # empty, and the script substituted `__unavailable__` - an unmapped path,
          # so the analyzer turned every suite on. On the #120 merge commit
          # (61b73f0) that demanded `data-foundation`, which has no `push` trigger
          # and so could never produce a check, and the gate went red on `main`.
          # "Require everything because I cannot see the diff" is not fail-closed,
          # it is fail-noisy: the true change set was right there in the commit.
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
            CHANGED="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null || true)"
          else
            CHANGED="$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" 2>/dev/null || true)"
            if [ -n "$CHANGED" ]; then
              echo "no pull-request base; using the commit's own diff for ${GITHUB_SHA}"
            fi
          fi
          if [ -z "$CHANGED" ]; then
            # A root commit, or a diff that could not be produced at all. This is
            # the only genuinely unknown case, and it keeps failing closed.
            echo "no change set available; requiring every suite"
            CHANGED="__unavailable__"
          fi
          echo "changed files:"; printf '%s\n' "$CHANGED" | sed 's/^/  /'
          IMPACT="$(printf '%s\n' "$CHANGED" | node tests/ci/impact.mjs --stdin --json)"
          printf '%s\n' "$IMPACT" | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const on = Object.entries(d.suites).filter(([, v]) => v).map(([k]) => k);
            console.log("suites required by this change: " + (on.join(" ") || "(none)"));
          '

          # Every check run on this commit, by name, as a flat map.
          #
          # `ci-gate` can only see `ci.yml`. The suites produced elsewhere
          # (data-foundation, plugin-lifecycle, runtime-conformance,
          # g12-acceptance, linux-runtime, quality-faults) are asserted by
          # workflows whose runs this job cannot wait on. Reading THEIR results
          # from the check-run API for this exact SHA is what turns "delegated"
          # from a promise into a fact - and what makes an ABSENT check a failure
          # rather than a silent pass.
          #
          # The API returns one entry per attempt; take the most recent conclusion
          # for each name. A name that never appears stays absent, which is the
          # state this is here to detect.
          #
          # A push to main has no `pull_request.head.sha`; the check runs are then
          # queried for github.sha, which is the same commit for that event.
          # The old read here had two defects, both measured:
          #
          #  1. `--paginate` with `--jq` prints ONE ARRAY PER PAGE, not one array.
          #     A commit with 23 check runs fits in a single page of 100, so this
          #     was invisible - but the moment a commit crosses 100 the caller
          #     feeds a multi-document stream to JSON.parse and dies with a syntax
          #     error instead of a verdict. `--slurp` collects the pages into one
          #     array of pages, which is what the caller then flattens.
          #  2. `group_by(.name) | map(last)` threw away `check_suite.id`, the only
          #     field that says WHICH workflow produced a check. ci-gate.mjs now
          #     joins that against the workflow-runs endpoint, so a check by the
          #     wrong workflow is `delegated-impostor` rather than credited.
          #
          # The fetch is left to ci-gate.mjs (it re-reads on every poll while
          # waiting), so this step only hands it the SHA and the token.
          export CHECKS_SHA="${HEAD_SHA:-$GITHUB_SHA}"
          export REPO
          echo "gate will read check runs and workflow runs for $CHECKS_SHA"

          # `|| true` because this script runs under `set -e`: without it a gate
          # that exits 1 ends the step on the spot, the summary below is never
          # written, and the Actions page shows a bare "exit code 1" with no
          # explanation - which is exactly what happened on the #120 merge commit
          # (61b73f0). The comment on the block below says "capture, write the
          # summary, then fail"; this line is what makes that true.
          #
          # `--fetch` tells the gate to read the ledger itself, which is what lets
          # it poll while suites are still running. Passing a shell-built snapshot
          # here is what made the old gate judge a moving target once and never
          # look again.
          GATE_RC=0
          node tests/ci/ci-gate.mjs \
            --needs-json "$NEEDS" \
            --impact-json "$IMPACT" \
            --fetch \
            --budget-ms "${GATE_BUDGET_MS:?GATE_BUDGET_MS must be set by the step env; a fallback here silently changes the budget}" > /tmp/gate.txt 2>&1 || GATE_RC=$?
          cat /tmp/gate.txt
          # Deliberately not `| tee`: under `set -e` a `ci-gate` exit of 1 ends the
          # step before the summary is written, and a red gate is exactly when the
          # summary matters most. Capture, write the summary, then fail.
          # The summary is what a human reads in the Actions UI.
          {
            echo "## ci-gate"
            echo '```'
            cat /tmp/gate.txt
            echo '```'
            echo
            echo "This job reads the result of all fifteen \`ci.yml\` jobs, and fails if any"
            echo "of them is not \`success\` — not only the ones the impact analyzer asked"
            echo "for."
            echo
            echo "Suites produced by other workflows are read from the check-run API for"
            echo "this exact commit:"
            echo
            echo "- \`delegated-verified\` - the check exists and passed."
            echo "- \`delegated-failed\` / \`delegated-skipped\` - a merge blocker."
            echo "- \`delegated-absent\` - the workflow did not run for this change even"
            echo "  though the impact analyzer required it. A merge blocker: there is no"
            echo "  red check to notice it, because the two decision tables (analyzer"
            echo "  rules and workflow path filters) are maintained separately."
            echo "- \`delegated-pending\` - the workflow started but had not finished"
            echo "  when this job ran. It cannot wait on another workflow's run, so this"
            echo "  is reported rather than judged; it is not a pass and not a failure."
            echo "  A \`pending\` line means the decision above was made before that"
            echo "  result existed."
            echo
            echo "\`delegated (partly)\` means this job checked one facet and another"
            echo "workflow checks the rest — read it as partial, not as covered."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$GATE_RC" -ne 0 ]; then
            echo "::error::ci-gate failed (exit $GATE_RC). The summary above says why."
            exit "$GATE_RC"
          fi
      - name: The gate's own selftest
        run: |
          set -eu
          # A gate whose logic was never counterfactually tested is the thing this
          # repository has been bitten by repeatedly. Run it before trusting it.
          node tests/ci/ci-gate.mjs --selftest
          node --test tests/ci/impact.test.mjs
          # The ledger and the bounded wait are the two halves of "the gate reads
          # the right check for the right workflow, and does not pass on a result
          # that does not exist yet". Both are tested here, next to the gate they
          # belong to, so a change to either cannot land unverified - which is
          # what happened on this branch's first run: `check-spec-coverage.mjs`
          # rejected them as NOT_REFERENCED, correctly.
          node --test tests/ci/check-run-ledger.test.mjs
          node --test tests/ci/await-delegated.test.mjs
          # Drives the PROCESS, not a helper: what it asserts is `main()`'s exit
          # code, because that is the only thing CI reads. A fixture-level test
          # would pass even if main() returned 0 on an API error.
          node --test tests/ci/ci-gate.api-failure.test.mjs
          # A test file that asserts nothing is not a passing test file.
          #
          # `node --test` exits 0 for an empty file, a comment-only file, and a
          # file whose only test is `{skip: true}` - all three measured on Node
          # 22.12.0. So "delete the assertions" is a way to make a red suite
          # green and nothing here noticed. This checks the files CI actually
          # runs, discovered from these workflow files rather than hard-coded.
          node tests/ci/check-test-substance.mjs --selftest
          node tests/ci/check-test-substance.mjs --all
          # The analyzer's output is what the gate judges, so its own tests run
          # here too - including the cases that pin the analyzer to the suites a
          # workflow can actually start.
