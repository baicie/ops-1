name: typed-pipeline-contracts
on:
  push:
    paths:
      - 'contracts/**'
      - 'tests/contract/**'
      - 'docs/architecture/0.0.3-typed-pipeline-rfc.md'
      - 'docs/adr/ADR-013-typed-pipeline-and-durable-jobs.md'
  pull_request:
    paths:
      - 'contracts/**'
      - 'tests/contract/**'
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.20,<5' 'cryptography>=42,<46'
      - run: python tests/contract/validate_typed_pipeline.py
