name: typed-pipeline-contracts
on:
  push:
    paths:
      - 'contracts/**'
      - 'tests/contract/**'
      - 'docs/architecture/0.0.3-typed-pipeline-rfc.md'
      - 'docs/adr/ADR-013-typed-pipeline-and-durable-jobs.md'
  pull_request:
    paths:
      - 'contracts/**'
      - 'tests/contract/**'
# Supersede the previous run for the SAME ref, but only when a newer one was
# triggered the same automatic way.
#
# `cancel-in-progress` unconditionally would be wrong here, and the existing
# `staging-preview.yml` shows why: it keeps three separate buckets so a push can
# never cancel a nightly certification. The same reasoning applies to every
# suite in this file - a `workflow_dispatch` is a person asking for THIS run, and
# a `schedule` is a run whose whole purpose is to exist at a fixed time. Neither
# is "superseded" by the next push, so neither is cancelled by one.
#
# What IS superseded: a push to main followed by another push to main, or a new
# commit on a pull request branch. The older run is now testing a tree nobody
# will merge, and on 2026-11-20 six merges in one minute queued four identical
# `ci.yml` runs that each spent a full suite-worth of billed minutes on commits
# already superseded.
#
# `cancel-in-progress` takes an expression here rather than `true`: GitHub
# evaluates it per run, and for a `workflow_dispatch` or `schedule` event this
# is `false`, so those runs are never cancelled out from under themselves.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  # Named for THIS workflow, not `contracts`.
  #
  # `ci.yml` also produces a check called `contracts`, running a different script
  # (`validate_contracts.py` vs `validate_typed_pipeline.py`). Two checks with one
  # name means the merge gate cannot tell which one it is looking at - and on run
  # 43711367103 this PR had three `contracts` entries: two from this workflow (push
  # and pull_request) and one from `ci.yml`.
  #
  # The ruleset's required check is `contracts`, which `ci.yml` supplies. So this
  # job is renamed and becomes an additional, non-blocking check: no protection is
  # lost, and the ambiguity is gone. Promoting it to required is a separate
  # decision for a human - see docs/ci/architecture-proposal.md.
  typed-pipeline-contracts:
    name: typed-pipeline-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.20,<5' 'cryptography>=42,<46'
      - run: python tests/contract/validate_typed_pipeline.py
